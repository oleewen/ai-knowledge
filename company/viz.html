  flex-direction: column;
  overflow: hidden;
}

  padding: 12px 16px;

  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
header h1 {
  margin: 0;
  font-size: 1.1rem;

}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

  border: 1px solid var(--border);
  color: var(--text);

}

  border: 1px solid var(--border);

  border-radius: 6px;
}
main {
  flex: 1;

}
#cy {

}
aside {
  border-left: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#detail {
  flex: 1;
  overflow: auto;
  padding: 16px;
}
#detail h2 { margin: 0 0 8px; font-size: 1.2rem; }
#detail .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
#detail .tags span {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  margin: 2px 4px 2px 0;
  font-size: 0.75rem;
}
#detail .body {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  line-height: 1.55;
  font-size: 0.92rem;
}
#detail .body a { color: var(--accent); }
#detail .body pre {
  background: var(--bg);
  padding: 10px;
  border-radius: 6px;
  overflow: auto;
}
#backlinks {
  border-top: 1px solid var(--border);

  max-height: 160px;
  overflow: auto;

#backlinks h3 { margin: 0 0 8px; font-size: 0.9rem; }

#backlinks li { margin: 4px 0; }
#backlinks a { color: var(--accent); cursor: pointer; text-decoration: none; }
#backlinks a:hover { text-decoration: underline; }
#legend {
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  max-height: 140px;
  overflow: auto;

#legend h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
.legend-item {
  display: inline-flex;
  align-items: center;
  margin: 2px 10px 2px 0;
  font-size: 0.75rem;
}
.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;

.empty-hint { color: var(--muted); font-style: italic; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  aside { border-left: none; border-top: 1px solid var(--border); }

      "body": "# 业务能力\n\n[返回 · 业务架构](../README.md)\n\n**结论**：公司级能力框架与成熟度标准。域划分见 [业务域划分](business-domain-division.md)。\n\n\u003e **映射一致性**：每个 CAP 必须唯一归属一个公司 BSD-L1。一个能力可在多个价值环节被调用，但不因跨环节使用而拆成多个能力。\n\n## 能力清单\n\n业务环节能力归属具体价值环节；业务支撑能力跨环节提供支撑，不归属单一环节。按类型汇总 CAP 入口，能力定义与归属关系见各 `CAP-*.md`。\n\n| 能力类型 | CAP |\n|----------|-----|\n| 业务环节能力 | [CAP-EXAMPLE](../VC-EXAMPLE/CAP/CAP-EXAMPLE.md) |\n| 业务支撑能力 | —（示例未登记） |\n\n## 成熟度评估\n\n评估维度与等级定义。",

        "architecture",

      "body": "# 业务域划分\n\n[返回 · 业务架构](../README.md)\n\n**结论**：公司级 BD 与 BSD-L1 按价值链与能力定界。能力见 [业务能力](business-capability.md)；价值链见 [价值链](business-value-chain.md)。\n\n域分类与入口在本章维护；职责、边界与能力映射以各 `BD-*.md`、`BSD-*.md` 与 `CAP-*.md` 为准。\n\n## 域分类与入口\n\n核心域直接实现价值环节，支撑域横跨价值环节提供支撑，通用域承载跨业务复用能力。下表仅演示现有实体；子域数按各类业务域下已登记的公司级 BSD-L1 去重统计。\n\n| 域类型 | 业务域 | 子域数 | 能力入口 |\n|--------|--------|-------:|----------|\n| 核心域 | [BD-EXAMPLE](../BD/BD-EXAMPLE/BD-EXAMPLE.md) | 1 | [业务子域](../BD/BD-EXAMPLE/index.md) · [业务能力](business-capability.md) |\n| 支撑域 | —（示例未登记） | 0 | — |\n| 通用域 | —（示例未登记） | 0 | — |\n\n通用域按业务需要明确自建、外购或集成方式；已确认的建设约束写入对应实体，技术平台登记见[技术架构](../../technical/README.md)。\n\n## 业务子域\n\n| 业务域 | 业务子域 | 职责 | 边界 | 能力 |\n|---|---|---|---|---|\n| [BD-EXAMPLE](../BD/BD-EXAMPLE/BD-EXAMPLE.md) | [BSD-EXAMPLE](../BD/BD-EXAMPLE/BSD-EXAMPLE.md) | 对标 CAP-EXAMPLE | 挂在 BD-EXAMPLE 下 | [CAP-EXAMPLE](../VC-EXAMPLE/CAP/CAP-EXAMPLE.md) |\n\n业务子域从各 `BD-*/index.md` 下钻；域与能力映射见各 `BSD-*.md` 与 `CAP-*.md`，汇总冲突以实体正文为准。\n\n## 业务域关系图\n\n```mermaid\ngraph TB\n    subgraph 核心域[\"核心域\"]\n        BD_EXAMPLE[\"BD-EXAMPLE\"]\n    end\n    BD_EXAMPLE --\u003e BSD_EXAMPLE[\"BSD-EXAMPLE\"]\n```",

      "body": "# 技术安全\n\n[返回 · 技术架构](../README.md)\n\n**结论**：公司级身份、加密、密钥与合规标准。\n\n## 认证授权\n\nIdP、令牌、RBAC/ABAC 与服务认证。\n\n## 数据加密\n\nTLS 与静态加密及密钥归属。\n\n## 密钥管理\n\nKMS 用法、轮换、隔离与禁明文。\n\n## 安全审计\n\n审计范围、留存与 SIEM 对接。\n\n## 漏洞扫描\n\n扫描门禁、分级 SLA 与例外流程。\n\n## 安全合规\n\n合规控制项、评估周期与证据包。",

      "title": "solution-slots（解决方案联邦槽位根）",
      "description": null,
      "tags": [
        "federation"
      ],
      "body": "# solution-slots\n\n公司层**解决方案联邦槽位根**。`solution-{NAME}` 为指向下级解决方案库 `文档目录` 的**软链**；**不是** `knowledge/` SSOT。\n\n| 读什么 | 文件 |\n|--------|------|\n| 本层索引 | [index.md](index.md) |\n| 建联清单 | [../knowledge-links.yaml](../knowledge-links.yaml) |\n| 布局契约 | [../../agent/references/knowledge-layout.md](../../agent/references/knowledge-layout.md) |\n\n## 约定\n\n- 路径：`company/solution-slots/solution-{NAME}` → 软链至解决方案仓 `文档目录`\n- 建槽：`docs-link`（company→solution）\n- 维护：`docs-link --check` 全量检查；`--repair --target \u003c已登记路径或URL\u003e` 单槽位修复，可先 `--dry-run`。\n- 内容更新：遵循解决方案仓普通 Git 工作流；缺仓先按已登记 `path` 准备本地仓。检查/修复不访问远端。\n- 公司不挂 `system-slots`。系统槽位在解决方案层 `system-slots`",
      "backlinks": [
        "README"
      ]
    }

      "source": "knowledge/technical/chapters/technical-security",
      "target": "knowledge/technical/README"
    },
    {
      "source": "solution-slots/README",
      "target": "solution-slots/index"
    }
  ],
  "types": [
    "Architecture Chapter",
    "Architecture Overview Buffer",
    "Business Capability",
    "Business Domain",
    "Business Line",
    "Business Subdomain",
    "Design Document",
    "Documentation",
    "Documentation Root",
    "Domain Architecture",
    "Domain Map",
    "Technical Platform",
    "Value Chain"
  ],
  "typeColors": {
    "Architecture Chapter": "#4e79a7",
    "Architecture Overview Buffer": "#f28e2b",
    "Business Capability": "#e15759",
    "Business Domain": "#4e79a7",
    "Business Line": "#59a14f",
    "Business Subdomain": "#59a14f",
    "Design Document": "#b07aa1",
    "Documentation": "#ff9da7",
    "Documentation Root": "#9c755f",
    "Domain Architecture": "#bab0ac",
    "Domain Map": "#4e79a7",
    "Technical Platform": "#f28e2b",
    "Value Chain": "#e15759"
  }
}
</script>
<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function textElement(tag, text, className) {
    const element = document.createElement(tag);
    element.textContent = text;
    if (className) element.className = className;
    return element;
  }

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    el.replaceChildren(textElement('h3', '类型图例'));
    const types = bundle.types || [];
    if (!types.length) el.appendChild(textElement('span', '无', 'empty-hint'));
    types.forEach(t => {
      const item = textElement('span', '', 'legend-item');
      const swatch = textElement('span', '', 'legend-swatch');
      swatch.style.backgroundColor = typeColors[t] || '#888';
      item.append(swatch, document.createTextNode(t));
      el.appendChild(item);
    });
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    box.replaceChildren(textElement('h3', 'Cited by'));
    if (!links.length) {
      box.appendChild(textElement('p', '无引用', 'empty-hint'));
      return;
    }
    const list = document.createElement('ul');
    links.forEach(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      const item = document.createElement('li');
      const a = textElement('a', label);
      a.dataset.id = src;
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(src);
      });
      item.append(a, document.createTextNode(' '), textElement('span', `(${src})`, 'empty-hint'));
      list.appendChild(item);
    });
    box.appendChild(list);
  }

  function renderMarkdown(container, markdown) {
    // Fail closed: missing, unsupported or failed libraries leave literal text.
    container.textContent = markdown;
    if (!window.marked || typeof window.marked.parse !== 'function' ||
        !window.DOMPurify || !window.DOMPurify.isSupported) return;
    try {
      const fragment = window.DOMPurify.sanitize(window.marked.parse(markdown, { breaks: true }), {
        USE_PROFILES: { html: true },
        RETURN_DOM_FRAGMENT: true,
        SANITIZE_NAMED_PROPS: true,
        FORBID_TAGS: ['style'],
        FORBID_ATTR: ['style'],
      });
      container.replaceChildren(fragment);
    } catch (error) {
      container.textContent = markdown;
      console.warn('Markdown unavailable; displaying plain text.', error);
    }
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.replaceChildren(textElement('p', '概念不存在', 'empty-hint'));
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const meta = textElement('div', '', 'meta');
    [['ID:', c.id], ['Type:', c.type || '—'], ['Description:', desc]].forEach(([label, value]) => {
      const row = document.createElement('div');
      row.append(textElement('strong', label), document.createTextNode(' ' + value));
      meta.appendChild(row);
    });
    const tags = textElement('div', '', 'tags');
    (c.tags || []).forEach(t => tags.appendChild(textElement('span', t)));
    if (!tags.children.length) tags.appendChild(textElement('span', '—', 'empty-hint'));
    const body = textElement('div', '', 'body');
    renderMarkdown(body, c.body || '');
    detail.replaceChildren(textElement('h2', c.title || c.id), meta, tags, body);
    body.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
</body>
</html>
