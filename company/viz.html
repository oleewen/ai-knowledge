      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 公司知识库设计\n\n`company/`：公司层知识编排与系统槽位治理。不承载系统实现细节。路径 SSOT 见 [knowledge-layout](../agent/references/knowledge-layout.md)。\n\n## 阅读顺序\n\n1. [README.md](README.md) — 定位  \n2. 本文 — 边界、契约、同步  \n3. [knowledge/README.md](knowledge/README.md) — 五视角  \n4. [../system/DESIGN.md](../system/DESIGN.md) — 系统层对照  \n\n## 1. 定位与边界\n\n| 层 | 职责 |\n|----|------|\n| `company/` | 聚合视图、导航、公司级实体正文 SSOT |\n| `system/` | 系统层治理与架构聚合 |\n| `application/` | 实现级实体与字段语义 SSOT |\n\n- **治理**：公司层结构语义、导航、归档入口  \n- **内容**：公司级实体与企业架构顶层在 `company/knowledge/`；实现细节在 system/application  \n- **流程**：`solutions/` + `analysis/` 跨系统上游；PRD/ASD/DSD/TDD 在各系统 `requirements/`  \n- **引用**：路径与槽位映射，不复制下游正文  \n\n## 2. 目录契约\n\n| 层级 | 目录 | 职责 |\n| --- | --- | --- |\n| 企业架构 | `knowledge/` | 五视角治理叙事；[`overview/`](knowledge/overview/NAME-overview.md) 为 extract/archive/tag 缓冲区（非 docs-distill） |\n| 方案 | `solutions/` | 跨系统 SOLUTION → `analysis/` |\n| 分析 | `analysis/` | 跨系统 ANALYSIS → 各系统 `requirements/` |\n| 槽位 | `system-{name}/` | 系统镜像入口 |\n| 清单 | `knowledge-links.yaml` | 建联与同步编排（可空） |\n| 运维 | `changelogs/` | CHANGE-LOG / INDEXING-LOG |\n\n入口：[README](README.md) · [INDEX-GUIDE](INDEX-GUIDE.md) · [index.md](index.md) · [docs-meta](docs-meta.md)\n\n### 公司级实体（正文 SSOT ∈ `knowledge/**`）\n\n系统/应用仅引用 ID。overview 非实体 SSOT。完整字段表见 [application/DESIGN.md](../application/DESIGN.md) §2.2.1。\n\n| 视角 | 实体 | 说明 |\n| --- | --- | --- |\n| 业务 | BD / CAP | 业务域；能力目录 L1–L3 |\n| 产品 | PL | 跨系统产品族 |\n| 应用 | SYS | 公司内系统边界 |\n| 数据 | MDG | 主数据治理目录 |\n| 技术 | TPL | 平台能力（云/DevOps/安全/开发环境） |\n\n命名：[naming-conventions](../agent/knowledge/naming-conventions.md)\n\n### 五视角聚焦\n\n| 视角 | 公司层聚焦 |\n| --- | --- |\n| 业务 | BD、CAP、商业模式、价值链 |\n| 产品 | PL、度量、体验 |\n| 应用 | SYS、系统目录与治理 |\n| 数据 | MDG、治理、湖仓、安全 |\n| 技术 | TPL：云、DevOps、安全、开发环境、可观测 |\n\n系统层落地见 [system/DESIGN.md](../system/DESIGN.md#五视角系统层聚焦)。\n\n### 系统镜像槽位\n\n- 下行：`knowledge-links.yaml` → docs-link 建槽 → docs-pull（本地 `path`，不 clone）  \n- 上行：公司 overview 用 extract/archive/tag；**docs-distill 仅写** `system/knowledge/overview/`  \n\n### SDD 衔接\n\n| 层级 | 方案 | 分析 | 需求交付 |\n| --- | --- | --- | --- |\n| 公司 | `company/solutions/` | `company/analysis/` | **无** |\n| 系统 | `system/solutions/` | `system/analysis/` | `system/requirements/` |\n\n同 IDEA-ID：`ANALYSIS` 拆归属 → 各系统 `REQUIREMENT-{IDEA-ID}/`。\n\n治理：槽位名 `system-{sys_name}`；不写实现/字段；跨层用链接；改目录语义先改本文。\n\n## 3. 同步与追溯\n\n1. 下游 `system/` 整理可同步内容  \n2. docs-pull → `company/system-{sys_name}/`（读目标 `.docsconfig` 的 DOC_ROOT/DOC_DIR）  \n3. 校核 `knowledge/` 与 `knowledge-links.yaml`  \n4. 追加槽位 `changelogs/CHANGE-LOG.md`（根 CHANGE-LOG 可选汇总）  \n\n冲突以下游事实源为准；company 只修映射与导航。\n\n## 4. 门禁与演进\n\n- 命名统一；禁止实现细节入 company 正文  \n- 跨层描述可追溯至 system/application  \n- 槽位同步禁止覆盖槽位 `README.md` / `index.md` / `changelogs/`；默认单槽位（`--sys-name`），`--all` 才全量；仅本地 Git `path`  \n\n演进：稳契约 → 完善 links 元数据 → 自动化巡检。\n\n## 参考\n\n[README](README.md) · [knowledge/](knowledge/README.md) · [system-SYSNAME](system-SYSNAME/README.md) · [knowledge-links.yaml](knowledge-links.yaml) · [knowledge-layout](../agent/references/knowledge-layout.md) · [system/DESIGN](../system/DESIGN.md)",

      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 示例跨系统需求分析\n\n> 读者：**需求分析师**与**产品/架构**。\n> 本文件为 `company/analysis/` 下的示例分析，用于展示跨系统需求分析在 company 层的推荐写法。\n\n---\n\n## 1. 背景与目标\n\n### 1.1 需求背景\n\n- 关联解决方案：`solutions/SOLUTION-EXAMPLE.md`\n- 场景说明：业务侧需要在公司层先完成“跨系统目标、边界、依赖、风险”的收敛，再由各系统拆分承接。\n\n### 1.2 需求目标\n\n| 目标编号 | 目标描述 |\n| -------- | -------- |\n| G-1 | 明确跨系统目标、边界与承接关系 |\n| G-2 | 为后续系统侧需求拆解提供统一起点 |\n| G-3 | 让参与方在 company 层先对范围、影响与风险形成共识 |\n\n### 1.3 范围与边界\n\n#### 范围内（In Scope）\n\n- 说明跨系统目标、关键参与方与分析边界。\n- 记录需要由各系统后续承接的需求主题与依赖关系。\n- 为下游 PRD/ASD/DSD/TDD 提供统一起点。\n\n#### 范围外（Out of Scope）\n\n- 不在 company 层展开系统实现设计、接口细节或数据模型。\n- 不替代各系统侧的正式 requirements 包。\n\n#### 假设与约束\n\n- 假设业务目标已在 `SOLUTION-EXAMPLE` 中达成初步共识。\n- 假设系统边界与公司级实体命名已具备统一口径。\n\n### 1.4 业务价值\n\n- 在公司层先统一跨系统口径，减少后续多系统各写一版分析导致的漂移。\n- 让系统侧承接物聚焦本系统职责，不重复重写跨系统背景。\n\n---\n\n## 2. 范围与约束\n\n### 2.1 核心场景\n\n业务方提出一项跨系统改进诉求，需要先在公司层确认哪些系统参与、哪些规则需要统一、哪些内容留到系统侧细化。\n\n### 2.2 关键参与方\n\n| 角色 | 关注点 | 说明 |\n| ---- | ---- | ---- |\n| 业务负责人 | 目标、范围、优先级 | 确认为什么做、做到哪 |\n| 产品/分析 | 业务规则、验收口径 | 负责把目标拆成可承接需求 |\n| 系统负责人 | 系统边界、依赖、风险 | 确认由谁承接、如何分段 |\n\n### 2.3 范围约束\n\n- 公司层只保留跨系统分析，不承载落地设计细节。\n- 产出必须可被一个或多个 `system/requirements/REQUIREMENT-{IDEA-ID}/` 承接。\n- 若存在未知项，应显式记录在待澄清问题中，而不是省略。\n\n### 2.4 交付约束\n\n- 先形成最小可评审分析，再由各系统按职责推进。\n- 若仅为模板演示，可保留“示例”内容，但结构必须与现行模板一致。\n\n---\n\n## 3. 影响与冲突\n\n### 3.1 影响面\n\n- 影响 `company/solutions/` 与 `company/analysis/` 的同链追溯关系。\n- 影响各系统需求承接入口与责任边界划分。\n\n### 3.2 影响业务能力\n\n| 能力 | 影响程度 | 影响说明 |\n| ---- | ---- | ---- |\n| 跨系统需求收敛 | 高 | 先在公司层完成共识，再进入系统侧承接 |\n| 责任边界澄清 | 高 | 提前明确哪些内容留在 company 层、哪些交由系统侧承接 |\n| 追溯一致性 | 中 | 保持方案、分析与后续承接文档的关系可追溯 |\n\n### 3.3 影响传播路径\n\n`company/solutions/` -> `company/analysis/` -> `system/requirements/`\n\n### 3.4 业务冲突\n\n| 冲突编号 | 冲突描述 | 严重程度 | 化解方案 |\n| -------- | -------- | -------- | -------- |\n| C-1 | 公司层分析与系统侧承接边界不清 | 中 | 在 analysis 中明确“到此为止”的边界，并在系统侧再细化 |\n\n---\n\n## 4. 思路与方案\n\n### 4.1 解决思路\n\n以“跨系统目标先收敛、系统侧再承接”为主线，在 company 层先明确范围、参与方、影响、风险与分阶段计划，再由各系统按职责细化。\n\n### 4.2 方案对比\n\n| 方案 | 描述 | 优点 | 风险 |\n| ---- | ---- | ---- | ---- |\n| A | 先在 company 层完成跨系统分析，再分发到系统侧承接 | 边界清晰、便于统一口径 | 需要多方先达成共识 |\n| B | 各系统直接分别分析，再事后汇总 | 启动快 | 口径容易漂移、追溯成本高 |\n\n### 4.3 关键决策\n\n| 决策点 | 推荐方案 | 选定理由 |\n| ------ | -------- | -------- |\n| 跨系统分析放在哪一层先收敛 | A | 先在 company 层统一范围和边界，再进入系统侧承接更稳定 |\n\n---\n\n## 5. 风险与待定\n\n### 5.1 风险评估\n\n| 风险编号 | 风险描述 | 可能性 | 影响程度 | 应对策略 |\n| -------- | -------- | -------- | -------- | -------- |\n| R-1 | 参与系统对承接边界理解不一致 | 中 | 高 | 在 analysis 中明确系统职责与交付边界 |\n| R-2 | 关键规则未在 company 层达成共识就直接下沉 | 中 | 中 | 先冻结核心规则，再分发到系统侧细化 |\n\n### 5.2 待澄清问题\n\n| 问题编号 | 问题描述 | 影响范围 | 状态 |\n| -------- | -------- | -------- | ---- |\n| Q-1 | 哪些规则必须在 company 层先统一，哪些可留给系统侧补充 | 需求拆解 | 待确认 |\n\n---\n\n## 6. 交付计划\n\n### 6.1 MVP 拆分\n\n| MVP阶段 | 核心内容 | 业务价值 | 依赖关系 |\n| ------- | -------- | -------- | -------- |\n| MVP-1 | 明确跨系统目标、参与方与承接边界 | 各方先形成统一认知 | 无 |\n| MVP-2 | 补齐风险、依赖与分阶段计划 | 便于系统侧继续细化与排期 | MVP-1 |\n\n### 6.2 关键里程碑\n\n| 里程碑 | 交付物 | 验收标准 |\n| ------ | ------ | -------- |\n| 里程碑-1 | company 层分析初稿 | 目标、边界、参与方已达成基本共识 |\n| 里程碑-2 | 系统侧承接计划 | 各系统已明确自身承接内容与依赖 |\n\n---\n\n## 7. 附录\n\n### 7.1 术语表\n\n| 术语 | 定义 |\n| ---- | ---- |\n| IDEA-ID | 跨阶段共享的需求链标识 |\n| 承接 | 系统侧基于公司层分析继续细化 requirements |\n\n### 7.2 参考文档\n\n- `company/README.md`\n- `company/DESIGN.md`\n- `company/solutions/SOLUTION-EXAMPLE.md`\n\n### 7.3 内部参考（仅供研发接力）\n\n- 示例文档不展开工程设计；若需继续细化，请在系统侧 requirements 包中补充。\n\n### 7.4 质量自查表 (Self-Check)\n\n- [ ] 结构齐全：`## 1`–`## 7` 完整。\n- [ ] 目标可追溯：`G-*` 可回指 `SOLUTION-EXAMPLE`。\n- [ ] 边界清晰：明确 company 层只做跨系统分析。\n- [ ] 风险与待定可见：`R-*`、`Q-*` 不省略。\n- [ ] 元数据完整：frontmatter 与文件名、parent 一致。",
      "backlinks": []
    },

      "body": "# 应用视角元数据（company/knowledge/application）\n\n公司级系统边界（SYS）的视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-APPLICATION` |\n| 视角 | application |\n| 层级范围 | company |\n| 说明 | 公司内系统边界目录；系统层 APP、应用层 MS/API 引用 SYS ID。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | SYS | 公司内系统层 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | sys | SYS | `SYS-{NAME}` | — |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `company`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### SYS 专属（正文）\n\n| 字段 | 说明 |\n| --- | --- |\n| architecture | apps / external_dependencies / ddd_layers（摘要即可） |\n| definition_scope | 本层主定义多为 `local` |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| 系统层 APP.parent_sys_id | SYS.full_id | 应用归属系统（下游引用） |\n| 系统层 PL 与 SYS 对齐 | SYS.full_id | 产品线常与 SYS 一一对应（叙事层约定） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | SYS 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# 业务视角元数据（company/knowledge/business）\n\n公司级业务域（BD）与业务能力目录（CAP）的视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | company |\n| 说明 | 公司级业务域划分与 L1/L2/L3 能力目录；系统/应用层引用 BD/CAP ID，不重复字段语义。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | BD | 公司级业务域 |\n| 2 | CAP | 公司级业务能力目录（L1/L2/L3，通过 `level` 与 `parent_id` 表达树形） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | bd | BD | `BD-{NAME}` | — |\n| 2 | cap | CAP | `CAP-{NAME}` | CAP（L2/L3 的 `parent_id` 指向上级 CAP；L1 为空） |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `company`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### BD / CAP 专属（正文）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| BD | `strategic_classification`（`core_domain` / `supporting` / `generic`） | 详细说明 |\n| CAP | `level`（L1/L2/L3）、`parent_id`（L1 可空）、`maps_to_bd_id`（推荐） | 关系 / 跨视角 |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| CAP.maps_to_bd_id | BD.full_id | 能力归属业务域 |\n| 系统层 maps_to_cap_ids | CAP.full_id | 系统能力映射到公司级 CAP（下游引用，不在此定义） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | BD/CAP 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# solutions — 解决方案文档\n\n公司层 SDD **方案**目录：`SOLUTION-{IDEA-ID}.md` → [../analysis/](../analysis/README.md)。\n\n| 项 | 约定 |\n|----|------|\n| 文件 | 根目录平铺 |\n| 归档 | [archive/](archive/) |\n| IDEA-ID | 需求链统一标识 |\n| frontmatter | `id` 与文件名一致 |\n\n## 索引\n\n| 编号 | 标题 | 关联 analysis | 状态 |\n|------|------|---------------|------|\n| SOLUTION-EXAMPLE | 示例跨系统解决方案 | ANALYSIS-EXAMPLE | draft |\n\n规范：[sdx-solution](../../agent/skills/sdx-solution/SKILL.md)",

    "solutions/SOLUTION-EXAMPLE": {
      "id": "solutions/SOLUTION-EXAMPLE",
      "type": "",
      "title": "示例跨系统解决方案",
      "description": null,
      "tags": [
        "example"
      ],
      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 示例跨系统解决方案\n\n> 读者：**业务与产品**。\n> 本文件为 `company/solutions/` 下的示例方案，用于展示跨系统方案文档的推荐写法。\n\n---\n\n## 1. 背景与目标\n\n### 1.1 业务现状\n\n这是一个跨系统协作场景的结构示例：多个系统共同完成同一条业务链路，业务侧需要在一个视角下看到统一状态与可追溯信息。\n\n### 1.2 存在问题\n\n现状下信息分散在多个系统中，业务人员需要在多个入口之间来回切换，导致排查耗时、协作成本高，且对外口径不一致风险上升。\n\n### 1.3 业务目标\n\n- G-1 将跨系统链路的关键状态聚合为统一视图，业务侧能快速定位“当前在哪里卡住了”。  \n- G-2 将对外承诺口径统一到可验证的业务规则，减少解释成本与争议。\n\n### 1.4 业务价值\n\n减少人工对账与沟通往返；提升问题响应速度；降低因口径不一致带来的客户体验波动。\n\n---\n\n## 2. 范围与约束\n\n### 2.1 核心场景\n\n业务人员在一个入口下发起查询，系统返回该业务对象在各系统中的关键状态、时间点与下一步动作建议。\n\n### 2.2 涉及角色\n\n| 用户角色 | 角色描述 | 核心关注点 |\n| -------- | -------- | ---------- |\n| 业务人员 | 处理业务流转与对外解释 | 状态可见、口径一致 |\n| 运营人员 | 跟进处理时效与异常 | 时效、异常定位 |\n| 协作方 | 参与链路中某环节处理 | 交接清晰、可追溯 |\n\n### 2.3 范围边界\n\n#### 范围内（In Scope）\n\n- 对单一业务对象提供跨系统关键状态的统一展示与追溯信息。\n- 提供与业务规则一致的状态解释与下一步指引。\n\n#### 范围外（Out of Scope）\n\n- 不引入新的业务规则变更；仅对既有规则进行口径统一与呈现。\n- 不改变各系统原有处理流程；仅补齐展示与追溯所需的业务字段口径。\n\n#### 成功标准\n\n- 业务人员在单一入口完成状态查询与定位，且能给出一致解释口径。\n- 典型问题的定位耗时显著下降（以业务侧可验收口径为准）。\n\n### 2.4 关键约束\n\n#### 业务约束\n\n- 对外口径必须一致；出现冲突时以业务规则优先级与可追溯证据为准。\n\n#### 资源约束\n\n- 以最小改动方式落地，优先覆盖高频链路与高价值对象。\n\n#### 技术约束\n\n- 仅使用业务可读的描述表达“能力限制”，不在正文展开工程实现细节。\n\n#### 交付约束\n\n- 如无外部硬截止，按业务优先级分阶段交付；每阶段可独立验收。\n\n---\n\n## 3. 影响与冲突\n\n### 3.1 影响面\n\n- 业务人员：入口变更为统一视图，减少多处查询。\n- 运营人员：异常定位路径更短，可追溯信息更集中。\n- 协作方：需要对关键状态口径达成一致并可追溯。\n\n### 3.2 影响业务能力\n\n|功能/业务能力|影响程度|影响类型|影响说明|\n|------------|--------|--------------|--------|\n|状态查询|高|口径调整|从多入口查询收敛为统一视图|\n|异常定位|中|追溯增强|提供关键时间点与责任归属提示|\n|对外解释|高|承诺一致性提升|以统一规则与证据支撑解释口径|\n\n### 3.3 影响传播路径\n\n```text\n[状态查询] → [异常定位] → [对外解释] → [跨团队协作]\n```\n\n### 3.4 业务冲突\n\n|冲突编号|冲突描述|冲突类型|严重程度|化解方案|化解成本|\n|--------|--------|--------------------------|--------|--------|--------|\n|C-1|不同系统对同一状态的命名与判定口径不一致|规则冲突/流程冲突/数据冲突|中|统一口径并补齐可追溯证据|中|\n\n---\n\n## 4. 思路与方案\n\n### 4.1 解决思路\n\n以“业务对象”为中心建立统一视图：对齐关键状态口径、补齐可追溯信息，并用业务可读的方式说明当前状态与下一步动作。\n\n### 4.2 方案对比\n\n|对比维度|方案A|方案B|\n|--------|-----|-----|\n|业务匹配度|高：统一视图与统一口径|中：仍依赖人工对齐口径|\n|实现复杂度|中：需口径与追溯对齐|低：仅做文档约定|\n|影响范围|中：涉及多系统协同|低：改动较少|\n|风险程度|中：口径收敛需共识|中：口径漂移风险仍在|\n|可扩展性|高：可逐步扩覆盖面|低：依赖人工维护|\n\n### 4.3 关键决策\n\n|决策点|推荐方案|备选方案|选定理由|\n|------|--------|--------|--------|\n|统一视图是否引入口径收敛|方案A|方案B|口径不一致会持续制造争议，统一视图必须以可追溯口径为基础|\n\n---\n\n## 5. 风险与待定\n\n### 5.1 风险评估\n\n|风险编号|风险描述|可能性|影响程度|应对策略|\n|--------|--------|--------|--------|--------|\n|R-1|口径共识难以达成，导致推进受阻|中|中|先覆盖高频链路，按业务优先级逐步扩展|\n|R-2|可追溯信息不足影响解释口径|中|高|明确必填追溯项并分阶段补齐|\n\n### 5.2 待澄清问题\n\n|问题编号|问题描述|影响范围|责任人|期望澄清日期|状态|\n|--------|--------|--------|------|------------|------|\n|Q-1|统一口径的优先级规则如何定义|对外口径|待定|待定|待确认|\n\n---\n\n## 6. 交付计划\n\n### 6.1 MVP 拆分\n\n|MVP阶段|核心内容|业务价值|预估工作量|依赖关系|\n|-------|--------|--------|----------|--------|\n|MVP-1|统一视图的最小闭环（核心状态 + 可追溯要点）|先让业务侧能定位与解释|小|无|\n|MVP-2|扩展覆盖更多链路与异常类型|提升覆盖面与稳定性|中|MVP-1|\n\n### 6.2 关键里程碑\n\n|里程碑|日期|交付物|验收标准|\n|------|----|------|--------|\n|里程碑-1|2026-07-31|MVP-1 可验收版本|业务侧可在单一入口完成定位与解释|\n|里程碑-2|2026-08-15|MVP-2 扩展版本|覆盖范围按约定扩大且验收通过|\n\n---\n\n## 7. 附录\n\n### 7.1 术语表\n\n| 术语 | 定义 |\n| ---- | ---- |\n| 统一视图 | 面向业务侧的跨系统状态聚合展示 |\n| 口径 | 对同一状态/规则的统一定义与解释方式 |\n\n### 7.2 参考文档\n\n- `company/README.md`\n- `company/DESIGN.md`\n- `company/analysis/ANALYSIS-EXAMPLE.md`\n\n### 7.3 内部参考（仅供研发接力）\n\n无（示例文档）。\n\n### 7.4 质量自查表 (Self-Check)\n\n- [ ] **结构与占位**  \n  *通过标准*：`## 1`–`## 7` 齐全；小节无内容须有「不适用/待补充」等，禁止空白无标注。\n\n- [ ] **§1**  \n  *通过标准*：§1.1–§1.4 有实质或「不适用」；**G-n** 可指回来源。\n\n- [ ] **§2**  \n  *通过标准*：主路径覆盖；§2.3 In/Out 与成功标准；§2.4 含交付节点或「无外部截止」。\n\n- [ ] **§3**  \n  *通过标准*：§3.1–§3.3 与 §3.2 一致；影响含功能/对外承诺/下游等相关维；§3.3 业务协作链；§3.4 每 **C-n** 有化解与成本（业务后果）。\n\n- [ ] **§4**  \n  *通过标准*：§4.1 可读；多方案 §4.2 已填否则说明；§4.3 决策含推荐、备选、理由。\n\n- [ ] **§5**  \n  *通过标准*：每 **R-n** 有可能性、影响、应对；**Q-n** 表更新（无则「无」）。\n\n- [ ] **§6**  \n  *通过标准*：MVP 价值与依赖；里程碑含阶段/日期、交付物、验收；依赖无环或有说明。\n\n- [ ] **业务可读**  \n  *通过标准*：正文无工程标识；技术线索仅 §7.3 且「待研发确认」。\n\n- [ ] **一致性**  \n  *通过标准*：与原始需求、`knowledge/`、领域索引一致或已标盲区。\n\n- [ ] **可追溯**  \n  *通过标准*：**G-n**/**C-n**/**R-n** 可指回；编号连贯（跳号注明）。\n\n- [ ] **术语与引用**  \n  *通过标准*：§7.1 专用术语；§7.2 已引路径。\n\n- [ ] **格式与元数据**  \n  *通过标准*：文首 frontmatter 完整；`id` 与文件名一致。",

<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
