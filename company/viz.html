      "body": "# 公司知识库设计\n\n本文件定义 `company/` 的设计边界、目录契约、同步闭环与演进策略。  \n`company/` 负责公司层知识编排与系统槽位治理，不承载下游系统实现细节。\n\n---\n\n## 阅读顺序\n\n1. [README.md](README.md) — 公司知识库定位与目录说明\n2. 本文 — 设计边界、治理规则与流程约束\n3. [knowledge/README.md](knowledge/README.md) — 企业架构视图入口\n4. [system-SYSNAME/README.md](system-SYSNAME/README.md) — 系统槽位模板说明\n5. [../agent/references/knowledge-layout.md](../agent/references/knowledge-layout.md) — 三层路径与 overview SSOT\n6. [../system/DESIGN.md](../system/DESIGN.md) — 系统知识库设计（下游对齐参考）\n\n---\n\n## 1. 定位与边界\n\n`company/DESIGN.md` 的定位是公司知识库设计说明，核心职责是定义公司层治理语义、系统槽位编排规则与同步入口约束。\n\n- `company/` 承载公司层聚合视图与导航；\n- `system/` 承载系统层治理与架构聚合；\n- `application/` 仍是实体事实源与字段语义的 SSOT。\n\n边界约束：\n\n- **治理边界**：`company/` 负责公司层结构语义、导航与归档入口；\n- **内容边界**：系统实现细节留在 `system/`，应用实体细节留在 `application/`；架构层只保留企业架构顶层视图，不承载各视角的实现细节文件；\n- **流程边界**：`company/` 承载跨系统方案（`solutions/`）与需求分析（`analysis/`）；PRD/ASD/DSD/TDD 等交付物由各系统侧 `requirements/` 承接，不在 `company/` 层定义；\n- **引用边界**：优先路径引用与槽位映射，避免跨层复制正文；路径 SSOT 见 [agent/references/knowledge-layout.md](../agent/references/knowledge-layout.md)。\n\n---\n\n## 2. 目录契约与治理规则\n\n`company/` 采用「企业架构层 + 系统槽位层 + 建联清单」的轻量契约模型。\n\n| 层级 | 目录 | 职责 |\n| --- | --- | --- |\n| 企业架构层 | `knowledge/` | 承载公司级企业架构顶层视图（五视角，聚焦治理叙事，不含实现细节）；含 [`knowledge/overview/`](knowledge/overview/NAME-overview.md) 缓冲区（docs-tag / docs-archive 操作对象） |\n| 方案层 | `solutions/` | 公司级跨系统解决方案；明确「哪个系统负责提供什么功能」，作为 `analysis/` 上游输入 |\n| 分析层 | `analysis/` | 公司级跨系统需求分析；衔接 `solutions/`，输出由各系统侧 `requirements/` 承接 |\n| 槽位层 | `system-{name}/` | 挂载系统镜像内容的统一入口 |\n| 清单层 | `knowledge-links.yaml` | 记录建联关系与同步编排信息 |\n| 运维 | `changelogs/` | `CHANGE-LOG.md`、`INDEXING-LOG.md`（见 [changelogs/README.md](changelogs/README.md)） |\n\n**索引说明**：Agent 检索入口为 [README.md](README.md)、[INDEX-GUIDE.md](INDEX-GUIDE.md)、[docs-meta.md](docs-meta.md)、本文与仓库根 [INDEX-GUIDE.md](../INDEX-GUIDE.md) §公司知识库。\n\n#### 公司级实体\n\n下列实体在 **company/** 首次定义；系统层、应用层仅引用 ID，不重复字段语义（完整表见 [application/DESIGN.md](../application/DESIGN.md) §2.2.1）。\n\n| 视角 | 实体 | 说明 |\n| --- | --- | --- |\n| 业务 | BD（业务域） | 公司级业务划分 |\n| 业务 | CAP（业务能力） | 公司级能力目录（L1/L2/L3） |\n| 产品 | PL（产品线） | 跨系统产品族 |\n| 应用 | SYS（系统层） | 公司内系统边界 |\n| 数据 | MDG（主数据域） | 公司级主数据治理目录 |\n| 技术 | TPL（技术平台能力） | 公司级平台能力目录（云/DevOps/安全/开发环境） |\n\n命名细则见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md)。\n\n#### 公司层五视角聚焦范围\n\n公司层见本文 §公司层五视角聚焦范围；系统 / 应用层落地见 [system/DESIGN.md](../system/DESIGN.md) §五架构视角。\n\n| 视角 | 公司层聚焦内容 |\n| --- | --- |\n| **业务** | 业务域划分（BD）、业务能力目录（CAP L1/L2/L3）、商业模式、价值链 |\n| **产品** | 产品线（PL）、跨系统产品族治理、度量标准、体验设计 |\n| **应用** | 系统边界（SYS）、公司内系统目录与治理 |\n| **数据** | 主数据域（MDG）、数据治理、数仓与湖、数据安全、数据分析 |\n| **技术** | 技术平台能力（TPL）：云基础设施、DevOps、技术安全、开发环境；可观测性标准 |\n\n#### 系统镜像槽位\n\n`system-{name}/` 承接下游 `system/` 知识库的镜像同步结果，供公司层导航与跨系统治理；不承载系统实现细节。\n\n- **下行同步**：由 `knowledge-links.yaml` 登记后，经脚本或人工将目标 `system/` 文档同步至 `company/system-{name}/`（尚无与 `/docs-pull` 同级的独立 Slash 技能；应用联邦镜像才使用 `/docs-pull`）。\n- **架构上行**：公司侧 overview/archive 流程见 [knowledge/overview/](knowledge/overview/NAME-overview.md) 与 [agent/skills/docs-extract/SKILL.md](../agent/skills/docs-extract/SKILL.md)、[docs-archive/SKILL.md](../agent/skills/docs-archive/SKILL.md)；系统侧蒸馏见 [system/DESIGN.md](../system/DESIGN.md)（`/docs-distill` 仅落盘 `system/knowledge/overview/`）。\n\n#### SDD 跨层衔接\n\n| 层级 | 方案 | 分析 | 需求交付 |\n| --- | --- | --- | --- |\n| 公司 | `company/solutions/` | `company/analysis/` | **不在 company/** |\n| 系统 | `system/solutions/` | `system/analysis/` | `system/requirements/` |\n\n公司 `analysis/ANALYSIS-{IDEA-ID}.md` 拆解跨系统归属后，各系统侧在对应 `system/requirements/REQUIREMENT-{IDEA-ID}/` 承接 PRD/ASD/DSD/TDD（同 IDEA-ID 链）。\n\n治理规则：\n\n- **命名规则**：系统槽位统一 `system-{SYSTEM_NAME}`；\n- **职责规则**：`company/` 不承载系统实现细节与应用字段定义；\n- **引用规则**：跨层内容使用链接引用，不复制下游正文；\n- **变更规则**：新增槽位或调整目录语义时，先更新本文件约束再更新内容。\n\n---\n\n## 3. 同步流程与追溯闭环\n\n`company/` 的流程定位是“公司层编排入口”，流程保持轻量但可审计。\n\n1. **系统侧准备**：下游 `system/` 侧完成可同步内容整理；\n2. **公司侧挂载**：按 `knowledge-links.yaml` 将内容同步至 `company/system-{name}/` 槽位（非 `/docs-pull` 技能路径）；\n3. **治理校核**：在 `company/knowledge/` 与 `knowledge-links.yaml` 维护一致性；\n4. **追溯记录**：对新增、替换、退役槽位记录来源、影响范围与状态。\n\n闭环原则：\n\n- `company/` 负责可见性、可治理性、可追溯性；\n- `company/` 不重写下游内容，只维护公司层映射与入口；\n- 出现冲突时以下游事实源为准，`company/` 修复映射与导航。\n\n---\n\n## 4. 质量门禁与演进策略\n\n质量门禁采用“轻规则、强一致性”：\n\n- **命名门禁**：槽位目录命名统一，禁止同义目录并存；\n- **边界门禁**：`company/` 文档不引入系统实现与应用字段细节；\n- **引用门禁**：跨层描述必须可追溯至 `system/` 或 `application/`；\n- **变更门禁**：槽位变更先更新设计约束，再更新目录与链接清单。\n\n演进顺序：\n\n1. 稳定目录契约与槽位命名；\n2. 完善 `knowledge-links.yaml` 的来源、状态与更新时间信息；\n3. 增补自动化巡检（命名一致性、链接可达性、槽位完整性）。\n\n---\n\n## 参考\n\n- [README.md](README.md)\n- [knowledge/README.md](knowledge/README.md)\n- [system-SYSNAME/README.md](system-SYSNAME/README.md)\n- [knowledge-links.yaml](knowledge-links.yaml)\n- [agent/references/knowledge-layout.md](../agent/references/knowledge-layout.md)\n- [../INDEX-GUIDE.md](../INDEX-GUIDE.md)\n- [../system/DESIGN.md](../system/DESIGN.md)",

      "body": "# company 索引指南（INDEX_GUIDE）\n\n> **最后更新**: 2026-06-21  \n> **文档定位**: 面向 AI Agent 的 **`company/` 文档根**九章机器索引；描述公司知识库、五视角企业架构与 **`system-{name}/`** 镜像槽位。系统层实体见 [../system/](../system/)；应用层见 [../application/](../application/)。\n\n---\n\n## 一、项目概览（Project Overview）\n\n### 1.1 速查表\n\n| 组件 | 路径 | 描述 |\n|------|------|------|\n| 公司库人类入口 | [README.md](README.md) | 子目录表、阅读顺序 |\n| 设计契约 | [DESIGN.md](DESIGN.md) | 目录边界、公司层 SSOT、同步闭环 |\n| 架构入口 | [knowledge/README.md](knowledge/README.md) | 五视角索引 |\n| OKF 根索引 | [index.md](index.md) | `okf_version: \"0.1\"` |\n| 目录元数据 | [docs-meta.md](docs-meta.md) | Directory Meta |\n| 联邦建联 | [knowledge-links.yaml](knowledge-links.yaml) | 系统建联登记 |\n| 运维日志 | [changelogs/README.md](changelogs/README.md) | CHANGE-LOG、INDEXING-LOG |\n| 仓库根全索引 | [../INDEX-GUIDE.md](../INDEX-GUIDE.md) | 中央库根地图 |\n| 系统侧索引 | [../system/INDEX-GUIDE.md](../system/INDEX-GUIDE.md) | system 九章索引 |\n\n### 1.2 元信息\n\n- **目录角色**: **公司知识库** — 公司层 BD/CAP/PL/SYS/MDG/TPL SSOT、`knowledge/` 五视角叙事、`system-{name}/` 镜像槽位\n- **技术栈**: Markdown、YAML（knowledge-links.yaml）\n\n---\n\n## 二、架构视图（Architecture View）\n\n### 2.1 模块结构\n\n```text\ncompany/\n├── README.md / INDEX-GUIDE.md / DESIGN.md / docs-meta.md / index.md\n├── knowledge-links.yaml\n├── knowledge/\n├── solutions/ analysis/\n├── system-SYSNAME/\n└── changelogs/\n```\n\n### 2.2 文档目录\n\n- **架构入口**: [knowledge/README.md](knowledge/README.md)\n- **系统侧对照**: [../system/knowledge/README.md](../system/knowledge/README.md)\n\n---\n\n## 三、接口清单（Interface Catalog）\n\n| 小节 | 状态 | 说明 |\n|------|------|------|\n| 3.1～3.4 | [未索引] | 无运行时 API |\n\n---\n\n## 四、模块依赖（Module Dependencies）\n\n| 上游 | 下游 | 关系 |\n|------|------|------|\n| `company/knowledge/` | `system/knowledge/` | 公司层实体 SSOT |\n| `company/solutions/` | `company/analysis/` | SDD 上游 |\n\n---\n\n## 五、详细索引（Detailed Index）\n\n| 实体 | 路径 |\n|------|------|\n| BD-EXAMPLE | [knowledge/business/BD-EXAMPLE/BD-EXAMPLE.md](knowledge/business/BD-EXAMPLE/BD-EXAMPLE.md) |\n| CAP-EXAMPLE-L1 |       "body": "# 公司知识库（顶层 `company/`）\n\n本目录为 **公司知识库根** 语义：公司级企业架构（`knowledge/`）与各 **`system-{name}/`** 系统镜像槽位。\n\n> **路径 SSOT**：公司侧五视角目录为 **`knowledge/`**（与 `application/knowledge`、`system/knowledge` 三轨同名）。详见 [DESIGN.md](DESIGN.md) 与 [agent/references/knowledge-layout.md](../agent/references/knowledge-layout.md)。\n\n## 子目录\n\n| 路径 | 说明 |\n|------|------|\n| [`INDEX-GUIDE.md`](INDEX-GUIDE.md) | Agent 九章机器索引 |\n| [`DESIGN.md`](DESIGN.md) | 设计边界、目录契约、SDD 跨层衔接与同步闭环 |\n| [`knowledge/`](knowledge/README.md) | 公司级企业架构（业务/产品/应用/数据/技术五视角，聚焦治理叙事） |\n| [`solutions/`](solutions/README.md) | 公司级跨系统解决方案（明确哪个系统负责什么功能，作为 analysis 上游） |\n| [`analysis/`](analysis/README.md) | 公司级跨系统需求分析（衔接 solutions，下游由各 `system/requirements/` 承接） |\n| [`system-SYSNAME/`](system-SYSNAME/README.md) | 占位槽位；真实系统名替换 `SYSNAME`，内容经建联同步填入 |\n| [`changelogs/`](changelogs/README.md) | 变更留痕与索引运维（CHANGE-LOG、INDEXING-LOG） |\n| [`knowledge-links.yaml`](knowledge-links.yaml) | 系统建联清单，记录挂载关系与同步编排信息 |\n\n## 阅读顺序\n\n1. [knowledge/README.md](knowledge/README.md) — 五视角企业架构入口  \n2. [solutions/README.md](solutions/README.md) / [analysis/README.md](analysis/README.md) — 跨系统 SDD 上游  \n3. [system-SYSNAME/README.md](system-SYSNAME/README.md) — 系统镜像槽位（按需替换 `SYSNAME`）  \n\n与系统知识库侧 [`../system/knowledge/`](../system/knowledge/README.md) 对照阅读；设计契约见 [DESIGN.md](DESIGN.md)。",

      "body": "# changelogs — 变更留痕与索引运维\n\n`company/` 知识库变更可追溯入口：仅约定 **Markdown** 日志产物，不重复阶段文档写作规范。阶段约定 SSOT 为本 README（无 `{dirname}_meta.yaml`）。\n\n## 目录文件\n\n| 文件 | 用途 |\n|------|------|\n| `README.md` | 本说明 |\n| [CHANGE-LOG.md](CHANGE-LOG.md) | `company/` 侧维护性变更与 **docs-change** 聚合；文末 `<!-- docs-change:baseline_time_ms=... -->` 为增量基线 |\n| [INDEXING-LOG.md](INDEXING-LOG.md) | **docs-indexing** 运行记录；主表**第一行** `indexing_finished_ms` 为增量锚点（[indexing-log-spec.md](../../agent/skills/docs-indexing/references/indexing-log-spec.md)） |\n\n## 关联索引\n\n- [../INDEX-GUIDE.md](../INDEX-GUIDE.md)\n- 仓库根 [INDEX-GUIDE.md](../../INDEX-GUIDE.md)（按需）\n\n## Skill 指针\n\n| Skill | 说明 |\n|-------|------|\n| [docs-change](../../agent/skills/docs-change/SKILL.md) | 聚合 git / CHANGELOG / 本地 mtime，**写入/更新** `CHANGE-LOG.md` |\n| [docs-indexing](../../agent/skills/docs-indexing/SKILL.md) | 生成 `INDEX-GUIDE.md`，在 `INDEXING-LOG.md` 主表**插入**一行（最新在上） |\n\n命令清单与执行入口见 [../../agent/skills/README.md](../../agent/skills/README.md)。\n\n## 索引维护\n\n目录结构或日志约定变更时，须更新本 README 与相关 `INDEX-GUIDE.md`（按需）。",

      "body": "```yaml\n# company/ 目录元数据（根导航与 SSOT 指针）\nid: \"DIR-COMPANY\"\nname: \"公司知识库根（company）\"\ndescription: \"公司级知识库 company/ 根目录：人类与 Agent 主导航（README、INDEX_GUIDE）、设计约束（DESIGN）及五视角企业架构 SSOT。\"\n\nrole:\n  kind: \"documentation_root\"\n  ssot_subdirectory: \"knowledge/\"\n  # 治理与命名 SSOT 见 agent/knowledge/knowledge-governance.md\n\nchild_directories:\n  knowledge:\n    readme: \"knowledge/README.md\"\n    description: \"五架构视角企业架构；含 overview/ 蒸馏缓冲区\"\n  solutions:\n    readme: \"solutions/README.md\"\n    description: \"公司级跨系统解决方案\"\n  analysis:\n    readme: \"analysis/README.md\"\n    description: \"公司级跨系统需求分析\"\n  system-SYSNAME:\n    readme: \"system-SYSNAME/README.md\"\n    description: \"系统镜像槽位（占位 SYSNAME）\"\n  changelogs:\n    readme: \"changelogs/README.md\"\n    description: \"变更留痕与索引运维\"\n\nchild_files:\n  - \"README.md\"\n  - \"INDEX-GUIDE.md\"\n  - \"DESIGN.md\"\n  - \"knowledge-links.yaml\"\n\ninputs:\n  - path: \"(from-repository-and-delivery)\"\n    description: \"仓库治理、跨系统方案/分析产出与归档回写\"\n\noutputs:\n  primary_artifact:\n    pattern: \"README.md, INDEX-GUIDE.md, DESIGN.md, knowledge/**/*\"\n    description: \"根级导航与设计 + knowledge/ 公司层 per-entity OKF concept\"\n\nnaming_conventions:\n  directory_index:\n    description: \"实体 ID 与 IDEA-ID 命名以 agent/knowledge/naming-conventions.md 为准\"\n    reference: \"../agent/knowledge/naming-conventions.md\"\n\nintegration:\n  upstream:\n    - path: \"../agent/\"\n      description: \"规范、模板与 Agent 技能（命名 SSOT：agent/knowledge/；闸门：agent/rules/）\"\n  downstream:\n    - path: \"../system/\"\n      description: \"系统层 reference 引用公司层 BD/PL/SYS/MDG/TPL SSOT\"\n  traceability:\n    description: \"阶段链 solutions → analysis；各系统 PRD/ASD 在对应 system/requirements/\"\n\nreferences:\n  - path: \"./README.md\"\n  - path: \"./INDEX-GUIDE.md\"\n  - path: \"./DESIGN.md\"\n  - path: \"../agent/knowledge/knowledge-governance.md\"\n```",

      "body": "# 应用架构\n\n[返回上一级 · 应用架构目录](README.md)\n\n本节定义公司级应用架构表达标准（C4、分层、演进），为各系统知识库的应用蓝图提供统一参照。\n\n## 系统上下文\n\n<!-- **应写内容**：C4 L1 上下文图的公司级绘制规范；人物与系统关系标注（业务流程编码）约定；信任边界与外部依赖记录标准。 -->\n\n<!-- **产出建议**：C4 Context 图模板；主要外部依赖与协议类型清单规范。 -->\n\n## 职责边界\n\n<!-- **应写内容**：应用/逻辑服务职责清单的标准字段（名称、职责、负责人、生命周期）；与业务能力、业务域映射原则；避免职责重叠的评审要点。 -->\n\n<!-- **产出建议**：服务清单表模板；与 business-capability 系统映射的交叉引用约定。 -->\n\n## 服务能力矩阵\n\n<!-- **应写内容**：业务流程编码与系统能力、接口要点、SLA 的对照表规范；填写粒度与更新节奏。 -->\n\n<!-- **产出建议**：服务能力矩阵表模板；与 business-processes 系统映射的衔接。 -->\n\n## 分层结构\n\n<!-- **应写内容**：分层模型（渠道层、核心域、共享能力、支撑后台等）的公司级标准；跨层调用规则与禁止项；与领域/产品线划分的正交关系。 -->\n\n<!-- **产出建议**：分层示意图模板；可选「服务—分层」矩阵规范。 -->\n\n## 演进路线\n\n<!-- **应写内容**：架构演进阶段、里程碑与触发条件的记录标准；当前态/过渡态/目标态标注；与产品路线图的衔接。 -->\n\n<!-- **产出建议**：演进时间线或阶段表模板；关键里程碑与责任团队字段。 -->",

      "body": "# 应用视角元数据（company/knowledge/application）\n\n公司级系统边界（SYS）的视角元数据 SSOT。实例索引见 [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-APPLICATION` |\n| 视角 | application |\n| 层级范围 | company |\n| 说明 | 公司内系统边界目录；系统层 APP、应用层 MS/API 引用 SYS ID。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | SYS | 公司内系统层 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | sys | SYS | `SYS-{NAME}` | — |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | 固定为 `SYS` |\n| full_id | 规范 ID，如 `SYS-BILLING-APPEAL` |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源（如 `application-overview.md`） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| 系统层 APP.parent_sys_id | SYS.full_id | 应用归属系统（下游引用） |\n| 系统层 PL 与 SYS 对齐 | SYS.full_id | 产品线常与 SYS 一一对应（叙事层约定） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md) | SYS 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# 系统概述\n\n[返回上一级 · 应用架构目录](README.md)\n\n本节定义公司级系统概述写作标准，为一页纸 SSOT 提供统一结构与字段要求，供各系统知识库参照。\n\n## 系统使命\n\n<!-- **应写内容**：系统使命陈述的标准格式；与业务概述、产品概述的交叉引用约定；核心价值要点列表要求。 -->\n\n<!-- **产出建议**：使命陈述模板（1～2 句）+ 核心价值要点；链至 business/product overview 的引用规范。 -->\n\n## 用户场景\n\n<!-- **应写内容**：用户类型与典型场景的记录标准；与业务 Persona、产品画像的一致性要求。 -->\n\n<!-- **产出建议**：用户类型表或场景列表模板；链至 product-user-journeys 的约定。 -->\n\n## 系统范围\n\n<!-- **应写内容**：纳入范围与非目标（不做清单）的书写标准；边界变更决策入口；与业务架构业务范围的对应关系。 -->\n\n<!-- **产出建议**：范围内外对照表模板。 -->\n\n## 外部依赖\n\n<!-- **应写内容**：外部系统、第三方服务与信任边界的摘要标准；数据出入方向记录要求；与 C4 上下文图的衔接。 -->\n\n<!-- **产出建议**：外部依赖摘要表模板；链至 application-architecture 系统上下文的约定。 -->\n\n## 技术摘要\n\n<!-- **应写内容**：语言、运行时、部署形态各一句摘要的标准；与技术架构详述的分工边界。 -->\n\n<!-- **产出建议**：技术栈摘要表模板（3～5 行）；链至 technical-overview 的约定。 -->",

      "body": "# 业务架构\n\n[返回上一级 · 架构文档索引](../README.md)\n\n本目录为业务架构**目录与入口**，聚焦公司级业务架构顶层内容。实体 SSOT：[business-meta.md](business-meta.md)、[../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)（**BD-***、**CAP-***）；per-entity 见下表。\n\n| 章节 | 文件 | 概述 |\n|------|------|------|\n| 业务概述 | [business-overview.md](business-overview.md) | 公司级背景、目标与范围，供各系统业务语境参照。 |\n| 业务域划分 | [business-domain-division.md](business-domain-division.md) | 一级业务域（L1）定义及域间关系，供 L2–L5 子树对齐。 |\n| 商业模式 | [business-model.md](business-model.md) | 商业画布与收支模型框架。 |\n| 价值链 | [business-value-chain.md](business-value-chain.md) | 价值创造环节与竞争壁垒框架。 |\n| 业务能力 | [business-capability.md](business-capability.md) | 公司级能力框架与成熟度标准。 |\n| 组织角色 | [business-roles-and-organization.md](business-roles-and-organization.md) | 干系人、角色与组织协作标准。 |\n\n## 实体索引（per-entity）\n\n| 层级 | full_id | 名称 | per-entity |\n|------|---------|------|------------|\n| BD | BD-EXAMPLE | 示例业务域 | [BD-EXAMPLE/BD-EXAMPLE.md](BD-EXAMPLE/BD-EXAMPLE.md) |\n| CAP | CAP-EXAMPLE-L1 | 示例一级能力 | [BD-EXAMPLE/CAP-EXAMPLE-L1.md](BD-EXAMPLE/CAP-EXAMPLE-L1.md) |\n| CAP | CAP-EXAMPLE | 示例二级能力 | [BD-EXAMPLE/CAP-EXAMPLE.md](BD-EXAMPLE/CAP-EXAMPLE.md) |",

      "body": "# 业务能力\n\n[返回上一级 · 业务架构目录](README.md)\n\n本节定义公司级业务能力框架与成熟度标准，从能力视角描述「能做什么、成熟与否、由谁承载」，为各系统知识库的能力实践提供统一参照。\n\n## 能力清单\n\n<!-- **应写内容**：公司级分层能力树（如 L1 价值流、L2 能力域、L3 能力）；每项能力的描述、客户/内部价值、与业务域的对应关系；区分客户可见能力与内部支撑能力。 -->\n\n<!-- **产出建议**：公司级能力清单或能力地图一图；与流程、术语交叉引用约定。 -->\n\n## 成熟度评估\n\n<!-- **应写内容**：评估维度（如覆盖度、自动化、质量、成本）的公司级标准；等级定义与目标等级；差距分析方法；评估周期与责任人。 -->\n\n<!-- **产出建议**：成熟度矩阵或雷达图模板；优先改进项列表规范。 -->\n\n## 系统映射\n\n<!-- **应写内容**：公司级能力与承载系统（SYS）的映射原则；缺口（能力无系统、系统无能力）的标注与治理；与集成架构、应用组合规划的一致性要求。 -->\n\n<!-- **产出建议**：能力—系统映射表模板；缺口与项目清单挂钩规则。 -->",

      "body": "# 业务域划分\n\n[返回上一级 · 业务架构目录](README.md)\n\n本节按企业架构习惯划分一级业务域（L1），说明各域职责及域间关系，为各系统知识库的 L2–L5 子树提供上层参照。\n\n> **层级约定**：L1–L5 均为「业务域」文档层级，不强制绑定 BD/BSD/BC/AGG/AB 实体码；可在清单中通过「实体映射」列做软关联。\n\n## 业务域清单\n\n<!-- **应写内容**：一级业务域（L1）编号（BZ-L1-XXX）、名称、战略分类（核心 / 支撑 / 通用）、职责摘要；父级填 `—`；可选实体映射（如 BD-XXX）。 -->\n\n<!-- **产出建议**：L1 清单表（级别 × ID × 名称 × 父级 × 分类 × 说明 × 实体映射）。 -->\n\n| 级别 | 业务域 ID | 名称 | 父级业务域 | 分类 | 说明 | 实体映射 |\n| --- | --- | --- | --- | --- | --- | --- |\n| L1 | 示例：BZ-L1-CORE | 示例：核心业务域 | — | 核心域 | 示例：承载差异化竞争能力 | 示例：BD-EXAMPLE |\n\n## 业务域职责\n\n<!-- **应写内容**：每一 L1 业务域的目标、范围内外、主要业务能力、关键实体或事件；域负责人或对口角色；与相邻 L1 的协作边界。与统一语言表术语一致。 -->\n\n<!-- **产出建议**：每 L1 一段职责说明；可选「范围内 / 范围外」对照。 -->\n\n**示例：BZ-L1-CORE**：负责公司核心业务能力，包括 [能力A]、[能力B]；与 [支撑域] 通过异步协作，主数据归属本域。\n\n## 核心域 / 支撑域 / 通用域\n\n<!-- **应写内容**：按 DDD 战略设计或同类方法，标注各 L1 业务域的战略分类；分类理由与资源投入原则（核心域差异化、支撑域效率、通用域复用）。可与业务能力地图交叉引用。 -->\n\n<!-- **产出建议**：域—分类矩阵；必要时标注演进方向（如从支撑域沉淀为平台能力）。 -->\n\n| 业务域 | 分类 | 说明 |\n| --- | --- | --- |\n| 示例：BZ-L1-CORE | 核心域 | 示例：承载差异化竞争能力 |\n| 示例：BZ-L1-SUPPORT | 支撑域 | 示例：为核心域提供通用支撑能力 |\n\n## 业务域关系图\n\n<!-- **应写内容**：L1 业务域之间的依赖及数据流或事件流（谁消费谁、主数据流向）；图例与命名与术语表一致。 -->\n\n<!-- **产出建议**：业务层领域关系图（PlantUML、Mermaid 或配图）；图下附 3～5 条关键依赖说明。 -->\n\n```mermaid\nflowchart LR\n    A[示例：BZ-L1-CORE] --> B[示例：BZ-L1-SUPPORT]\n    B --> C[示例：BZ-L1-GENERIC]\n```",
      "backlinks": [
        "knowledge/business/README",
        "knowledge/overview/NAME-overview"
      ]

      "body": "# 业务视角元数据（company/knowledge/business）\n\n公司级业务域（BD）与业务能力目录（CAP）的视角元数据 SSOT。实例索引见 [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | company |\n| 说明 | 公司级业务域划分与 L1/L2/L3 能力目录；系统/应用层引用 BD/CAP ID，不重复字段语义。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | BD | 公司级业务域 |\n| 2 | CAP | 公司级业务能力目录（L1/L2/L3，通过 `level` 与 `parent_id` 表达树形） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | bd | BD | `BD-{NAME}` | — |\n| 2 | cap | CAP | `CAP-{NAME}` | CAP（L2/L3 的 `parent_id` 指向上级 CAP；L1 为空） |\n\n---\n\n## 4. 必填字段\n\n### 通用字段（BD、CAP 均须）\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | 层级标识：`BD` 或 `CAP` |\n| full_id | 规范 ID，如 `BD-CHARGING-APPEAL` |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源（叙事文档或章节，如 `business-domain-division.md`） |\n\n### BD 专属\n\n| 字段 | 说明 |\n| --- | --- |\n| strategic_classification | 战略分类：`core_domain` / `supporting` / `generic` |\n\n### CAP 专属\n\n| 字段 | 说明 |\n| --- | --- |\n| level | 能力层级：`L1` / `L2` / `L3` |\n| parent_id | 上级 CAP 的 `full_id`；L1 留空 |\n| maps_to_bd_id | 关联业务域 BD 的 `full_id`（推荐） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| CAP.maps_to_bd_id | BD.full_id | 能力归属业务域 |\n| 系统层 maps_to_cap_ids | CAP.full_id | 系统能力映射到公司级 CAP（下游引用，不在此定义） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md) | BD/CAP 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",
      "backlinks": [
        "knowledge/business/README"
      ]
    },

      "body": "# 商业模式\n\n[返回上一级 · 业务架构目录](README.md)\n\n本节定义公司级商业模式框架，说明价值如何创造与捕获，为各系统知识库提供商业论证参照。\n\n## 商业画布\n\n<!-- **应写内容**：客户细分、价值主张、渠道、客户关系、收入来源、核心资源、关键活动、重要合作、成本结构九大模块的要点；与业务概述、能力地图一致；模式假设与验证状态。 -->\n\n<!-- **产出建议**：一页画布图或结构化表格模板；关键假设列表规范。 -->\n\n## 收支模型\n\n<!-- **应写内容**：收入类型与计费逻辑（一次性、订阅、按量等）的公司级标准；主要成本结构与规模经济点；敏感性假设；财务口径与业务指标口径的差异说明。 -->\n\n<!-- **产出建议**：简要财务模型或假设表模板；与 KPI 中财务类指标对齐约定。 -->",

      "body": "# 业务概述\n\n[返回上一级 · 业务架构目录](README.md)\n\n本节定义公司级业务背景、目标与范围，为各系统知识库的业务语境提供统一参照。\n\n## 背景与愿景\n\n<!-- **应写内容**：行业与市场背景、用户痛点或监管驱动；组织使命与中长期愿景；公司在价值链中的定位及与竞品/替代方案的差异假设。可附一页「问题—机会—主张」摘要，便于干系人对齐。 -->\n\n<!-- **产出建议**：背景与驱动力 1～2 段；愿景以一句为主，可展开为要点列表。 -->\n\n## 业务目标\n\n<!-- **应写内容**：战略周期内可衡量的公司业务目标；分解为 OKR 或 KPI（含基线、目标值、统计口径与责任方）；目标与产品、运营、风控等职能的对应关系。避免仅列口号，须可复盘、可追踪。 -->\n\n<!-- **产出建议**：目标表或 OKR 列表；关键指标定义（分子分母、频率、数据源）。 -->\n\n## 业务范围\n\n<!-- **应写内容**：公司级纳入范围的能力、客群、地域与渠道；明确排除项（不做清单）及与相邻业务、合作方的责任边界；范围变更的决策入口，降低范围蔓延争议。 -->\n\n<!-- **产出建议**：范围内外对照表；与外部依赖的接口责任一句话约定（可链路至契约或 PRD）。 -->",

      "body": "# 数据治理\n\n[返回上一级 · 数据架构目录](README.md)\n\n本节定义公司级数据治理标准，覆盖标准、元数据、质量、血缘与主数据，为各系统知识库提供统一参照。\n\n## 数据标准\n\n<!-- **应写内容**：命名、编码、度量单位、时间与时区、主数据代码表的公司级标准；标准制定与例外流程；与模型、接口字段同步约定。 -->\n\n<!-- **产出建议**：标准文档索引模板；必填标准项检查表。 -->\n\n## 数据字典\n\n<!-- **应写内容**：技术元数据与业务元数据采集范围标准；血缘、影响分析与搜索入口；与数据目录或治理平台集成规范。 -->\n\n<!-- **产出建议**：元数据平台说明模板；核心实体字典链接规范。 -->\n\n## 数据质量\n\n<!-- **应写内容**：质量维度（完整性、准确性、及时性、一致性等）的公司级标准；规则定义、阈值与告警；问题工单与修复闭环；关键报表的数据质量 SLA。 -->\n\n<!-- **产出建议**：质量规则目录模板；质量大盘链接规范。 -->\n\n## 数据血缘\n\n<!-- **应写内容**：字段/表/作业级血缘粒度的公司级标准；采集方式（解析 SQL、日志、平台 API）；影响分析与合规举证的使用场景。 -->\n\n<!-- **产出建议**：血缘工具与覆盖范围说明模板；典型链路截图或链接规范。 -->\n\n## 主数据\n\n<!-- **应写内容**：主数据域（客户、产品、组织等）、权威源与分发方式的公司级标准；黄金记录合并规则与人工审核；与业务侧主数据流程一致。 -->\n\n<!-- **产出建议**：主数据清单与系统归属模板；分发接口或事件说明规范。 -->",

      "body": "# 数据视角元数据（company/knowledge/data）\n\n公司级主数据域（MDG）的视角元数据 SSOT。实例索引见 [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-DATA` |\n| 视角 | data |\n| 层级范围 | company |\n| 说明 | 公司级主数据治理目录；系统层 DS、应用层 ENT 引用 MDG ID（`authoritative_mdg_id` 等）。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | MDG | 公司级主数据域 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | mdg | MDG | `MDG-{NAME}` | — |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | 固定为 `MDG` |\n| full_id | 规范 ID，如 `MDG-CUSTOMER-MASTER` |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源（如 `data-governance.md`） |\n\n### MDG 专属\n\n| 字段 | 说明 |\n| --- | --- |\n| governance_owner | 治理责任方（组织或角色） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| authoritative_mdg_id | MDG.full_id | 主数据权威域（下游引用） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md) | MDG 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# 数据架构概述\n\n[返回上一级 · 数据架构目录](README.md)\n\n本节定义公司级数据层设计原则、全景与生命周期标准，为各系统知识库的数据架构提供统一参照。\n\n## 设计原则\n\n<!-- **应写内容**：与业务目标一致的原则（如单一事实来源、域内自治、最小必要采集）的公司级标准；非功能约束（一致性级别、延迟、成本、合规）；原则的可检验方式及例外审批。 -->\n\n<!-- **产出建议**：原则列表模板（每条附适用场景）；与禁止/不推荐模式对照。 -->\n\n## 架构全景\n\n<!-- **应写内容**：从业务对象到 OLTP、消息、数仓/湖、分析与开放的端到端视图标准；主要数据域与系统边界；批/实时路径摘要；命名与 [`business-glossary.md`](../business/business-glossary.md) 一致。 -->\n\n<!-- **产出建议**：一页全景图模板（PlantUML、Mermaid 或配图）；图下列主要数据存储与流向说明规范。 -->\n\n## 生命周期\n\n<!-- **应写内容**：采集、存储、使用、共享、归档、销毁各阶段的责任与规则标准；保留周期与法律依据；与备份、合规删除、匿名化的衔接。 -->\n\n<!-- **产出建议**：生命周期阶段表或示意图模板；关键实体保留策略索引。 -->",

      "body": "# 数据安全与隐私\n\n[返回上一级 · 数据架构目录](README.md)\n\n本节定义公司级数据分类分级、脱敏、访问、备份恢复与隐私合规标准，为各系统知识库提供统一参照。\n\n## 分类分级\n\n<!-- **应写内容**：分类维度（个人、金融、运营等）与等级定义的公司级标准；每级的存储、传输、访问与审计要求；打标方式（元数据标签、列级）。 -->\n\n<!-- **产出建议**：分类分级矩阵模板；与加密、脱敏策略的映射。 -->\n\n## 数据脱敏\n\n<!-- **应写内容**：静态脱敏、动态脱敏、令牌化等选型的公司级标准；保留可分析性与不可逆性的平衡；与测试数据生成流程。 -->\n\n<!-- **产出建议**：脱敏规则表模板（字段 × 方法 × 环境）；工具与配置位置规范。 -->\n\n## 访问控制\n\n<!-- **应写内容**：库表行列级权限模型的公司级标准；审批流与最小权限；服务账号与人账号分离；审计查询范围。 -->\n\n<!-- **产出建议**：权限模型说明模板；高危操作双人复核等规则。 -->\n\n## 备份恢复\n\n<!-- **应写内容**：备份频率、保留、异地与加密的公司级标准；恢复演练与 RTO/RPO；与业务连续性文档一致。 -->\n\n<!-- **产出建议**：备份策略表模板；恢复 Runbook 索引规范。 -->\n\n## 隐私合规\n\n<!-- **应写内容**：适用法律下的处理合法性基础、主体权利的技术支持标准；跨境传输与标准合同；DPIA 或等价评估入口。 -->\n\n<!-- **产出建议**：合规控制与技术措施对照模板；法务确认引用规范。 -->",

      "body": "# 数据仓库与数据湖\n\n[返回上一级 · 数据架构目录](README.md)\n\n本节定义公司级分析域分层、建模与湖仓一体标准，为各系统知识库提供统一参照。\n\n## 数仓分层\n\n<!-- **应写内容**：ODS / DWD / DWS / ADS 各层职责、数据粒度与刷新频率的公司级标准；层间依赖与禁止逆向依赖；命名与主题域规范。 -->\n\n<!-- **产出建议**：分层架构图模板；层—主题对照表规范。 -->\n\n## 维度建模\n\n<!-- **应写内容**：业务过程、粒度、维度与度量的公司级建模标准；缓慢变化维策略；与业务指标口径对齐；避免同一指标多口径无文档。 -->\n\n<!-- **产出建议**：核心星型/雪花模型图模板；指标与事实表映射规范。 -->\n\n## 数据湖\n\n<!-- **应写内容**：湖存储格式（Parquet、Iceberg 等）、catalog 与元数据服务的公司级标准；入湖质量与分区策略；与数仓的物化或联邦查询关系。 -->\n\n<!-- **产出建议**：数据湖拓扑图模板；入湖规范与目录结构。 -->\n\n## 数据集市\n\n<!-- **应写内容**：面向部门或产品的主题集市范围、刷新与权限的公司级标准；与主数仓的关系；避免重复建设同一语义。 -->\n\n<!-- **产出建议**：集市清单模板（主题 × 用户群 × 数据源）；所有权说明。 -->",

      "body": "# 产品架构\n\n[返回上一级 · 产品架构目录](README.md)\n\n本节定义公司级产品线（PL）划分与组合关系，为各系统知识库的产品模块（PM）提供上层参照，并与业务域（BD）可对齐。\n\n## 产品线清单（PL）\n\n<!-- **应写内容**：产品线编号（PL-XXX）、名称、定位、目标用户、状态（活跃 / 规划中 / 退役）；与业务域 BD 的对应关系；负责人或对口产品团队。 -->\n\n<!-- **产出建议**：产品线清单表（PL-ID × 名称 × 定位 × 状态 × 负责人）；关键 PL 附一句话价值主张。 -->\n\n| PL-ID | 名称 | 定位 | 状态 | 说明 |\n| --- | --- | --- | --- | --- |\n| 示例：PL-EXAMPLE | 示例产品线 | 示例：面向 XX 客群的核心产品族 | 活跃 | 示例：承载差异化产品能力 |\n\n## 产品线职责与边界\n\n<!-- **应写内容**：每一产品线的核心价值、范围内外（不做清单）、与相邻 PL 的协作边界；主数据或体验归属；与商业模式、定价策略的交叉引用。 -->\n\n<!-- **产出建议**：每 PL 一段职责说明；可选「范围内 / 范围外」对照表。 -->\n\n## 产品线关系图\n\n<!-- **应写内容**：产品线之间的协同、复用、依赖或互斥关系；产品组合全景（Portfolio Map）；命名与术语表一致。 -->\n\n<!-- **产出建议**：产品组合关系图（Mermaid 或配图）；图下附 3～5 条关键依赖说明。 -->\n\n```mermaid\nflowchart LR\n    A[示例：PL-A] --> B[示例：PL-B]\n    B --> C[示例：PL-C]\n```",

      "body": "# 产品视角元数据（company/knowledge/product）\n\n公司级产品线（PL）的视角元数据 SSOT。实例索引见 [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-PRODUCT` |\n| 视角 | product |\n| 层级范围 | company |\n| 说明 | 公司级跨系统产品族目录；系统层 PM、应用层 FT/UC 引用 PL ID。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | PL | 公司级产品线 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | pl | PL | `PL-{NAME}` | — |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | 固定为 `PL` |\n| full_id | 规范 ID，如 `PL-BILLING-APPEAL` |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源（如 `product-architecture.md`） |\n\n### PL 专属\n\n| 字段 | 说明 |\n| --- | --- |\n| target_users | 目标用户角色列表（逗号分隔或简述） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| 系统层 PM.parent_id | PL.full_id | 产品模块归属产品线（下游引用） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md) | PL 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# 产品度量\n\n[返回上一级 · 产品架构目录](README.md)\n\n本节定义公司级产品度量框架、埋点规范与实验原则，为各系统知识库的产品度量实践提供统一参照。\n\n## 北极星\n\n<!-- **应写内容**：北极星指标的定义方法；与用户价值、商业结果的逻辑链；反指标或护栏指标；评审与调整节奏；各 PL 北极星与公司级北极星的对齐原则。 -->\n\n<!-- **产出建议**：北极星定义模板；与业务 KPI 对齐说明。 -->\n\n## 核心指标\n\n<!-- **应写内容**：AARRR 或等价框架下的指标分类；定义、口径、责任人标准；与数仓/报表主题的一致性要求；指标字典治理规则。 -->\n\n<!-- **产出建议**：公司级指标字典摘要或链接；与数据架构指标治理交叉引用。 -->\n\n## 埋点与事件\n\n<!-- **应写内容**：事件命名、公共属性、采样与隐私的公司级规范；与页面、组件、关键旅程的映射原则；版本化与兼容性要求。 -->\n\n<!-- **产出建议**：埋点规范与事件目录模板；与数据架构埋点规范一致。 -->\n\n## A/B 测试\n\n<!-- **应写内容**：分流策略、样本量、统计方法与伦理边界的公司级标准；实验平台与发布、功能开关的配合原则；结论沉淀与全量推广标准。 -->\n\n<!-- **产出建议**：实验模板或规范；历史实验索引与复盘要求。 -->\n\n## 行为分析\n\n<!-- **应写内容**：漏斗、留存、路径等分析场景的方法论；与产品评审例会的结合方式；隐私与聚合展示原则；核心看板类型与更新节奏。 -->\n\n<!-- **产出建议**：分析 Playbook 摘要；看板清单模板。 -->",

      "body": "# 产品概述\n\n[返回上一级 · 产品架构目录](README.md)\n\n本节阐明产品定位、用户、竞争与路线，为功能架构、旅程与度量提供统一语境，并与业务架构可对齐。\n\n## 价值主张\n\n<!-- **应写内容**：产品解决的核心问题与差异化价值；与商业模式、业务能力的对应关系；非目标或暂不承诺的能力边界。语言需可被销售、研发与运营一致引用。 -->\n\n<!-- **产出建议**：一句话定位 + 价值主张要点列表；可选「我们是什么 / 不是什么」对照。 -->\n\n## 目标用户\n\n<!-- **应写内容**：主要与次要用户细分；每类 Persona 的目标、痛点、使用情境、决策因素与技术素养；与业务侧客群定义一致。避免虚构无验证的画像。 -->\n\n<!-- **产出建议**：Persona 卡片或表（含名称、场景、关键需求）；与获客渠道、定价策略的交叉引用。 -->\n\n## 竞品分析\n\n<!-- **应写内容**：直接/间接竞品与替代方案；功能、体验、定价、生态对比；可借鉴点与防御点。分析维度与更新频率说明。 -->\n\n<!-- **产出建议**：竞品对比矩阵或一页摘要；信息来源与最后评审日期。 -->\n\n## 产品路线\n\n<!-- **应写内容**：按季度或主题的阶段目标、交付物与依赖；与业务 OKR、技术演进的衔接；已承诺与探索项区分。变更记录与沟通节奏。 -->\n\n<!-- **产出建议**：时间线或 Now/Next/Later 视图；与版本、里程碑编号对应。 -->",

      "body": "# 交互与体验设计\n\n[返回上一级 · 产品架构目录](README.md)\n\n本节定义公司级视觉与交互语言标准，保证核心流程可理解、可完成、可访问，为各系统知识库的体验实践提供统一参照。\n\n## 设计规范\n\n<!-- **应写内容**：公司级色彩、字体、间距、组件库与变体标准；品牌与无障碍约束；与设计 Token、代码组件库的同步机制；破坏性变更管理。 -->\n\n<!-- **产出建议**：Design System 规范或 Storybook 链接；版本与破坏性变更说明。 -->\n\n## 页面原型\n\n<!-- **应写内容**：高保真/低保真原型的范围与粒度标准；关键页面状态（空、加载、错误、权限不足）的呈现规范；与设计稿、前端实现的评审流程。 -->\n\n<!-- **产出建议**：原型规范与模板；页面—组件—状态索引约定。 -->\n\n## 交互流程\n\n<!-- **应写内容**：任务级交互序列（含分支与校验反馈）的方法论；与异常路径、文案一致性要求；微交互与动效的使用边界。 -->\n\n<!-- **产出建议**：交互流程图规范；与用例、埋点事件对齐约定。 -->\n\n## 无障碍\n\n<!-- **应写内容**：目标标准（如 WCAG 等级）；键盘、读屏、对比度、焦点顺序要求；组件无障碍验收清单；审计与修复流程。 -->\n\n<!-- **产出建议**：无障碍检查表模板；关键页面的审计记录要求。 -->",

      "body": "# 开发环境与工具链\n\n[返回上一级 · 技术架构目录](README.md)\n\n本节定义公司级本地开发、工具链与内部平台标准，为各系统知识库提供统一参照。\n\n## 本地环境\n\n<!-- **应写内容**：前置依赖（语言版本、容器、云 CLI）、一键脚本或 Compose 的公司级标准；与远程开发环境的选项；常见故障与文档维护责任。 -->\n\n<!-- **产出建议**：dev-setup 文档模板；环境校验命令规范。 -->\n\n## 开发工具\n\n<!-- **应写内容**：IDE、CLI、API 调试、DB 客户端等公司级推荐与版本；许可证与合规注意事项；可选工具与默认工具区分。 -->\n\n<!-- **产出建议**：工具清单表模板；更新节奏规范。 -->\n\n## 内部平台\n\n<!-- **应写内容**：内部门户、工单、监控、发布平台等入口与用途的公司级目录标准；账号申请与权限模型；与外部 SaaS 的边界。 -->\n\n<!-- **产出建议**：平台目录模板（名称 × URL × 负责人）；新人必读链接规范。 -->",

      "body": "# DevOps 与工程实践\n\n[返回上一级 · 技术架构目录](README.md)\n\n本节定义公司级交付流水线、质量门禁与发布策略标准，为各系统知识库提供统一参照。\n\n## CI/CD\n\n<!-- **应写内容**：构建、测试、安全扫描、制品晋级与环境部署阶段的公司级标准；制品库与不可变部署；与分支策略、环境晋升的对应关系。 -->\n\n<!-- **产出建议**：流水线示意图模板；各阶段工具与失败处理说明规范。 -->\n\n## 分支管理\n\n<!-- **应写内容**：主干/GitFlow/Trunk-Based 等公司级选型准则；分支命名、保护规则与合并要求；与发布节奏、热修复流程的配合。 -->\n\n<!-- **产出建议**：分支策略一页说明模板；与 CODEOWNERS 的衔接。 -->\n\n## 代码规范\n\n<!-- **应写内容**：语言级风格、静态检查、提交信息规范的公司级标准；Code Review 最低要求与合并门禁；技术债登记方式。 -->\n\n<!-- **产出建议**：规范文档索引；Lint/Format 在 CI 中的强制项。 -->\n\n## 自动化测试\n\n<!-- **应写内容**：单元/集成/E2E 各层测试职责、覆盖率期望与运行频率的公司级标准；测试数据与环境依赖；与流水线阶段的绑定。 -->\n\n<!-- **产出建议**：测试金字塔或策略表模板；Flaky 测试治理说明。 -->\n\n## 发布策略\n\n<!-- **应写内容**：蓝绿/金丝雀/滚动等公司级发布模式选用准则；流量切换与健康检查；回滚条件；与 [`product-release.md`](../product/product-release.md#灰度发布) 的配合。 -->\n\n<!-- **产出建议**：发布 Runbook 摘要模板；关键服务发布检查表。 -->\n\n## IaC\n\n<!-- **应写内容**：Terraform/Pulumi/CloudFormation 等公司级选型与目录结构标准；状态存储、锁与权限；审查与 plan 门禁；漂移检测。 -->\n\n<!-- **产出建议**：IaC 仓库说明模板；模块与环境映射规范。 -->",

      "body": "# 基础设施架构\n\n[返回上一级 · 技术架构目录](README.md)\n\n本节定义公司级计算、网络与边缘交付标准，为各系统知识库的基础设施实践提供统一参照。\n\n## 部署架构\n\n<!-- **应写内容**：机房、区域、可用区与云账号拓扑的公司级规划标准；关键服务部署位置与跨区策略；与数据主权、延迟目标的对应；混合云或边缘节点说明规范。 -->\n\n<!-- **产出建议**：部署拓扑图模板；环境（开发/测试/生产）差异摘要规范。 -->\n\n## 网络拓扑\n\n<!-- **应写内容**：VPC、子网、路由、防火墙边界的公司级标准；DMZ、内网、管理网分层；东西向与南北向流量路径；零信任或传统边界模型的采用范围。 -->\n\n<!-- **产出建议**：网络拓扑图模板；安全域清单及默认拒绝策略说明。 -->\n\n## 云资源规划\n\n<!-- **应写内容**：网段与 IP 规划、子网用途、NAT 与出口策略的公司级标准；安全组/NSG 命名与最小权限原则；标签与成本分摊约定。 -->\n\n<!-- **产出建议**：资源规划表或 IaC 模块说明模板；变更审批与防漂移措施。 -->\n\n## 容器编排\n\n<!-- **应写内容**：K8s 集群划分（业务线/环境/合规域）、节点池与实例类型的公司级标准；命名空间、资源配额与网络策略；Ingress、Service Mesh 或 Gateway 选型；升级与补丁策略。 -->\n\n<!-- **产出建议**：集群架构图模板；关键清单（集群列表、版本、责任人）规范。 -->\n\n## 流量接入\n\n<!-- **应写内容**：CDN 静态与动态加速边界；LB 层（四层/七层）与健康检查；DNS 解析、TTL、灾备切换；证书与 HTTPS 终止位置的公司级标准。 -->\n\n<!-- **产出建议**：流量路径示意图模板；域名与证书台账索引规范。 -->",

      "body": "# 技术视角元数据（company/knowledge/technical）\n\n公司级技术平台能力（TPL）的视角元数据 SSOT。实例索引见 [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-TECHNICAL` |\n| 视角 | technical |\n| 层级范围 | company |\n| 说明 | 公司级平台能力目录（云/DevOps/安全/开发环境）；系统层 TSD、应用层 MW/CMP 引用 TPL ID。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | TPL | 公司级技术平台能力 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | tpl | TPL | `TPL-{NAME}` | — |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | 固定为 `TPL` |\n| full_id | 规范 ID，如 `TPL-K8S-PLATFORM` |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源（如 `technical-overview.md`） |\n\n### TPL 专属\n\n| 字段 | 说明 |\n| --- | --- |\n| domain | 能力域：云基础设施 / DevOps / 安全 / 开发环境 等 |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| TSD.parent_tpl_id | TPL.full_id | 系统级技术域归属平台能力（下游引用） |\n| APP.implements_tpl_ids | TPL.full_id | 应用实现的平台能力（下游引用） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../KNOWLEDGE-INDEX.md](../KNOWLEDGE-INDEX.md) | TPL 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 公司级实体定义 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |",

      "body": "# 技术架构概述\n\n[返回上一级 · 技术架构目录](README.md)\n\n本节定义公司级技术选型、技术雷达与决策记录标准，为各系统知识库的技术基线提供统一参照。\n\n## 技术选型\n\n<!-- **应写内容**：按层次或领域归纳主要技术选型（语言、框架、运行时、数据存储、消息等）的公司级标准；每项选型的适用场景与退出条件；与组织技能栈、招聘与培训成本的匹配说明。 -->\n\n<!-- **产出建议**：选型总览表模板（技术 × 用途 × 负责人）；与「禁止/待评估」清单区分。 -->\n\n## 技术雷达\n\n<!-- **应写内容**：采用、试验、评估、暂缓/淘汰的四象限或环状分类的公司级标准；评审周期与准入标准；与业务增长、合规要求变化的关系。 -->\n\n<!-- **产出建议**：Tech Radar 图或表模板；变更记录与评审纪要索引规范。 -->\n\n## 选型决策\n\n<!-- **应写内容**：重大选型（新引入、替换、下线）的背景、备选方案、决策结论与后果的公司级记录标准；与 [system/adr/README.md](../../../system/adr/README.md) ADR 或技术 RFC 的对应关系。 -->\n\n<!-- **产出建议**：决策索引表模板；链路至 ADR/文档；弃用技术的迁移窗口说明。 -->",

      "body": "# 安全架构\n\n[返回上一级 · 技术架构目录](README.md)\n\n本节定义公司级身份、数据、密钥与合规安全标准，为各系统知识库提供统一参照。\n\n## 认证授权\n\n<!-- **应写内容**：身份提供者、令牌类型与生命周期的公司级标准；RBAC/ABAC 模型与租户隔离；服务间认证（mTLS、服务账号）；与统一登录、审计的衔接。 -->\n\n<!-- **产出建议**：认证授权架构图模板；角色与权限模型索引规范。 -->\n\n## 数据加密\n\n<!-- **应写内容**：TLS 版本与密码套件策略；静态加密（磁盘、列级、应用层）及密钥归属的公司级标准；密钥轮换与兼容性；与 [`data-security-privacy.md`](../data/data-security-privacy.md#分类分级) 数据分级一致。 -->\n\n<!-- **产出建议**：加密策略摘要模板；例外清单与审批。 -->\n\n## 密钥管理\n\n<!-- **应写内容**：KMS/HSM 或云密钥服务公司级用法；密钥分级、轮换与访问审计；开发/测试与生产密钥隔离；禁止明文入库与日志打印。 -->\n\n<!-- **产出建议**：密钥管理规范；关键密钥类型清单模板。 -->\n\n## 安全审计\n\n<!-- **应写内容**：审计事件范围、留存周期与防篡改的公司级标准；与 SIEM 或集中日志的对接；合规举证要求。 -->\n\n<!-- **产出建议**：审计字段与保留策略表模板；查询与告警入口规范。 -->\n\n## 漏洞扫描\n\n<!-- **应写内容**：依赖扫描、镜像扫描、DAST/SAST 在流水线中的位置的公司级标准；漏洞分级、SLA 与例外流程；与漏洞赏金或 SRC 的关系。 -->\n\n<!-- **产出建议**：扫描工具与频率表模板；严重漏洞响应流程摘要。 -->\n\n## 安全合规\n\n<!-- **应写内容**：适用的合规框架与控制项映射的公司级标准；技术侧落地；评估周期与证据包位置；与 [`data-security-privacy.md`](../data/data-security-privacy.md#隐私合规) 对齐。 -->\n\n<!-- **产出建议**：合规控制与技术措施对照表模板；免责声明与责任边界。 -->",

    {

    },
    {

      "target": "knowledge/technical/README"
    },
    {

    },

    },
    {
      "source": "solutions/README",

    }
  ],
  "types": [
    "Agent Index Guide",
    "Analysis Document",
    "Architecture Chapter",
    "Architecture Overview Buffer",
    "Business Capability",
    "Business Domain",
    "Design Document",

    "Documentation",

    "Knowledge Index",
    "Master Data Domain",
    "Perspective Meta",
    "Perspective Tree Meta",
    "Product Line",
    "Solution Document",
    "System",
    "Technical Platform"
  ],
  "typeColors": {
    "Agent Index Guide": "#4e79a7",
    "Analysis Document": "#f28e2b",
    "Architecture Chapter": "#e15759",
    "Architecture Overview Buffer": "#76b7b2",
    "Business Capability": "#59a14f",
    "Business Domain": "#4e79a7",
    "Design Document": "#b07aa1",
    "Directory Meta": "#ff9da7",
    "Documentation": "#9c755f",
    "Documentation Root": "#bab0ac",
    "Knowledge Index": "#4e79a7",
    "Master Data Domain": "#f28e2b",
    "Perspective Meta": "#e15759",
    "Perspective Tree Meta": "#76b7b2",
    "Product Line": "#ff9da7",
    "Solution Document": "#edc948",
    "System": "#499894",
    "Technical Platform": "#ff9da7"
  }
}
</script>
<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
</body>
