      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 示例跨系统需求分析\n\n> **结论**：选方案 A——公司层先收敛跨系统目标/边界/风险，再由各系统承接。  \n> 读者：需求分析师、产品/架构。路径：`company/analysis/`。上游：`solutions/SOLUTION-EXAMPLE.md`。\n\n---\n\n## 1. 背景与目标\n\n### 1.1 需求背景\n\n关联 `SOLUTION-EXAMPLE`：业务侧须在公司层先收敛跨系统目标、边界、依赖、风险，再由各系统拆分承接。\n\n### 1.2 需求目标\n\n| 目标编号 | 目标描述 |\n| -------- | -------- |\n| G-1 | 明确跨系统目标、边界与承接关系 |\n| G-2 | 为后续系统侧需求拆解提供统一起点 |\n| G-3 | 参与方在 company 层先对范围、影响与风险形成共识 |\n\n### 1.3 范围与边界\n\n#### 范围内（In Scope）\n\n- 跨系统目标、关键参与方与分析边界\n- 各系统后续承接的需求主题与依赖\n- 下游 PRD/ASD/DSD/TDD 的统一起点\n\n#### 范围外（Out of Scope）\n\n- 不展开系统实现、接口或数据模型\n- 不替代各系统正式 requirements 包\n\n#### 假设与约束\n\n- 业务目标已在 `SOLUTION-EXAMPLE` 初步共识\n- 系统边界与公司级实体命名已有统一口径\n\n### 1.4 业务价值\n\n公司层先统一跨系统口径，减多系统各写一版导致的漂移；系统侧承接物聚焦本职，不重写跨系统背景。\n\n---\n\n## 2. 范围与约束\n\n### 2.1 核心场景\n\n跨系统改进诉求 → 公司层确认参与系统、须统一规则、可留系统侧细化项。\n\n### 2.2 关键参与方\n\n| 角色 | 关注点 | 说明 |\n| ---- | ---- | ---- |\n| 业务负责人 | 目标、范围、优先级 | 确认为什么做、做到哪 |\n| 产品/分析 | 业务规则、验收口径 | 目标拆成可承接需求 |\n| 系统负责人 | 系统边界、依赖、风险 | 谁承接、如何分段 |\n\n### 2.3 范围约束\n\n- 公司层只保留跨系统分析，不承载落地设计细节\n- 产出须可被一个或多个 `system/requirements/REQUIREMENT-{IDEA-ID}/` 承接\n- 未知项显式记入待澄清，不省略\n\n### 2.4 交付约束\n\n- 先最小可评审分析，再按系统职责推进\n- 模板演示可保留「示例」内容，结构须与现行模板一致\n\n---\n\n## 3. 影响与冲突\n\n### 3.1 影响面\n\n- `company/solutions/` ↔ `company/analysis/` 同链追溯\n- 各系统需求承接入口与责任边界\n\n### 3.2 影响业务能力\n\n| 能力 | 影响程度 | 影响说明 |\n| ---- | ---- | ---- |\n| 跨系统需求收敛 | 高 | 公司层先共识，再入系统侧 |\n| 责任边界澄清 | 高 | 明确 company 层止点与系统侧承接 |\n| 追溯一致性 | 中 | 方案、分析与承接文档可追溯 |\n\n### 3.3 影响传播路径\n\n`company/solutions/` → `company/analysis/` → `system/requirements/`\n\n### 3.4 业务冲突\n\n| 冲突编号 | 冲突描述 | 严重程度 | 化解方案 |\n| -------- | -------- | -------- | -------- |\n| C-1 | 公司层分析与系统侧承接边界不清 | 中 | analysis 写清「到此为止」；系统侧再细化 |\n\n---\n\n## 4. 思路与方案\n\n### 4.1 解决思路\n\n**结论**：跨系统目标先收敛，系统侧再承接——company 层先定范围、参与方、影响、风险与分阶段计划。\n\n### 4.2 方案对比\n\n| 方案 | 描述 | 优点 | 风险 |\n| ---- | ---- | ---- | ---- |\n| A | company 层先跨系统分析，再分发系统侧 | 边界清、口径易统一 | 须多方先共识 |\n| B | 各系统分别分析，事后汇总 | 启动快 | 口径易漂、追溯成本高 |\n\n### 4.3 关键决策\n\n| 决策点 | 推荐方案 | 选定理由 |\n| ------ | -------- | -------- |\n| 跨系统分析放在哪一层先收敛 | A | 先统一范围与边界，再入系统侧更稳 |\n\n---\n\n## 5. 风险与待定\n\n### 5.1 风险评估\n\n| 风险编号 | 风险描述 | 可能性 | 影响程度 | 应对策略 |\n| -------- | -------- | ------ | -------- | -------- |\n| R-1 | 参与系统对承接边界理解不一致 | 中 | 高 | analysis 写清系统职责与交付边界 |\n| R-2 | 关键规则未在 company 层共识就下沉 | 中 | 中 | 先冻核心规则，再分发细化 |\n\n### 5.2 待澄清问题\n\n| 问题编号 | 问题描述 | 影响范围 | 状态 |\n| -------- | -------- | -------- | ---- |\n| Q-1 | 哪些规则须 company 层先统一，哪些可留系统侧 | 需求拆解 | 待确认 |\n\n---\n\n## 6. 交付计划\n\n### 6.1 MVP 拆分\n\n| MVP阶段 | 核心内容 | 业务价值 | 依赖关系 |\n| ------- | -------- | -------- | -------- |\n| MVP-1 | 跨系统目标、参与方与承接边界 | 各方先统一认知 | 无 |\n| MVP-2 | 风险、依赖与分阶段计划 | 便于系统侧细化与排期 | MVP-1 |\n\n### 6.2 关键里程碑\n\n| 里程碑 | 交付物 | 验收标准 |\n| ------ | ------ | -------- |\n| 里程碑-1 | company 层分析初稿 | 目标、边界、参与方基本共识 |\n| 里程碑-2 | 系统侧承接计划 | 各系统明确承接内容与依赖 |\n\n---\n\n## 7. 附录\n\n### 7.1 术语表\n\n| 术语 | 定义 |\n| ---- | ---- |\n| IDEA-ID | 跨阶段共享的需求链标识 |\n| 承接 | 系统侧基于公司层分析继续细化 requirements |\n\n### 7.2 参考文档\n\n- `company/README.md`\n- `agent/knowledge/knowledge-governance.md`\n- `company/solutions/SOLUTION-EXAMPLE.md`\n\n### 7.3 内部参考（仅供研发接力）\n\n示例不展开工程设计；细化请在系统侧 requirements 包补充。\n\n### 7.4 质量自查表 (Self-Check)\n\n- [ ] 结构齐全：`## 1`–`## 7` 完整。\n- [ ] 目标可追溯：`G-*` 可回指 `SOLUTION-EXAMPLE`。\n- [ ] 边界清晰：明确 company 层只做跨系统分析。\n- [ ] 风险与待定可见：`R-*`、`Q-*` 不省略。\n- [ ] 元数据完整：frontmatter 与文件名、parent 一致。",

      "body": "# 业务视角元数据（company/knowledge/business）\n\n公司级 VC / BD / BSD(L1) / CAP 视角元数据 SSOT。实例索引：[index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | company |\n| 说明 | BA：VC→CAP 能力目录 ∥ BD 域模型；BSD(L1) 桥接 CAP 与 PL。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | VC | 价值链（能力目录根） |\n| 2 | BD | 业务域（支撑 VC） |\n| 3 | BSD(L1) | 业务子域（`level: 1`；挂 BD；对标 PL） |\n| 4 | CAP | 业务能力（实现 VC；一对一映射 BSD(L1)） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | vc | VC | `VC-{NAME}` | — |\n| 2 | bd | BD | `BD-{NAME}` | —（平铺单文件） |\n| 3 | bsd1 | BSD | `BSD-{NAME}` | BD（`level: 1`） |\n| 4 | cap | CAP | `CAP-{NAME}` | VC（经 `implements_to_vc`，非 `parent_id`） |\n\n目录：`VC-{NAME}/VC-{NAME}.md` + `VC-{NAME}/CAP-*.md`；`BD-{NAME}.md`、一级 `BSD-{NAME}.md` 平铺。\n\n---\n\n## 4. 字段（OKF）\n\nFrontmatter 10 必填 + 正文四段见 okf-spec §2；本层 `layer_scope` 固定 `company`。\n\n| 层级 | 字段 | 说明 |\n| --- | --- | --- |\n| VC | `supported_by_bd`、`implemented_by_cap` | 均为列表必填；与 BD/CAP 双向同步 |\n| BD | `supports_to_vc`、`children` | 单值必填；列表必填；children 仅 BSD(L1) |\n| BSD(L1) | `level`、`parent`、`maps_to_pl`、`maps_to_cap` | 固定 `1`；均单值必填 |\n| CAP | `implements_to_vc`、`maps_to_bsd` | 均单值必填；目标必须为 BSD(L1) |\n| BD | `strategic_classification` | 正文扩展 |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| CAP.implements_to_vc | VC.id | CAP 实现价值链 |\n| CAP.maps_to_bsd | BSD(L1).id | CAP 与 BSD(L1) 一对一映射 |\n| BD.supports_to_vc | VC.id | BD 支撑价值链 |\n| BSD(L1).maps_to_pl | PL.id | BSD(L1) 对标产品线 |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [index.md](../index.md) | VC/BD/BSD(L1)/CAP 实例 SSOT |\n| naming-conventions（Agent 元知识） | ID 命名 SSOT |",

      "body": "# 业务能力\n\n[返回 · 业务架构](../README.md)\n\n公司级能力框架与成熟度标准。\n\n## 能力清单\n\n公司级业务能力按业务环节能力与业务支撑能力两层组织；业务支撑能力跨价值环节提供支撑，不归属单一环节。\n\n### 业务环节能力\n\n| 能力 | 归属环节 | 说明 |\n|------|---------|------|\n\n### 业务支撑能力\n\n| 能力 | 归属域 | 说明 |\n\n## 成熟度评估\n\n评估维度、等级、周期与责任人。\n\n## 产品与方案映射\n\nCAP 对标 PL / SLN 为**推导路径**（不新增 CAP 直连字段）：\n\n1. `CAP.implements_to_vc` → VC  \n2. `CAP.maps_to_bsd` → BSD(L1)\n3. `BSD(L1).maps_to_pl` → PL\n3. `SLN.maps_to_pl_id` → 同一 PL（一 PL 一 SLN）",

      "body": "# 业务域划分\n\n[返回 · 业务架构](../README.md)\n\n公司级 L1/L2 业务域划分与域间关系。业务域由价值链VC与业务能力CAP推导而来，遵循 DDD 限界上下文原则划定边界；能力定义见 [业务能力](business-capability.md)，价值链见 [价值链](business-value-chain.md)。\n\n## 核心域\n<!-- 一级业务域：直接实现价值环节 -->\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么，不做什么 | 提供什么能力 |\n\n## 支撑域\n<!-- 一级业务域：横跨环节 -->\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么，不做什么 | 提供什么能力 |\n\n## 通用域\n<!-- 一级业务域：跨业务复用 -->\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么，不做什么 | 提供什么能力 |\n\n## 业务子域\n\n| 业务域 | 业务子域 | 职责 | 边界 | 能力 |\n|---|---|---|---|---|\n| XX域 | XX子域 | 定义与职责 | 做什么，不做什么 | 提供什么能力 |\n\n## 业务域关系图\n\n```mermaid\ngraph TB\n    subgraph 核心域[\"核心域 · 直接实现价值环节\"]\n        direction LR\n        DOM_SALE[\"XX域\"] --> DOM_ORDER[\"XX域\"] \n    end\n\n    subgraph 支撑域群[\"支撑域群 · 横跨环节\"]\n        DOM_FULFILL[\"XX域\"]\n    end\n\n    subgraph 通用域群[\"通用域 · 跨业务复用\"]\n        DOM_COMMON[\"XX域\"]\n    end\n\n    DOM_ORDER -..-> DOM_FULFILL\n    DOM_SALE -..-> DOM_COMMON \n```\n\n## 能力→域映射\n\n完整能力定义见 [业务能力](business-capability.md)。\n\n> 映射一致性约束：每个能力必须有唯一 L1 业务域归属；一个能力可在多个价值环节被调用，但不因跨环节使用而拆成多个能力。\n\n| 能力 | 所在域 | 域群 |\n|------|------|------|\n| XX能力 | XX域 | 核心域 |\n| XX能力 | XX域 | 支撑域 |\n| XX能力 | XX域 | 通用域 |\n\n## 实体对齐\n\n| 业务域/子域 | 实体ID |\n|------|------|\n| XX域 | BD-XX |\n| YY子域 | BSD-YY |",
      "backlinks": [
        "knowledge/business/README",
        "knowledge/business/chapters/business-value-chain",
        "knowledge/overview/NAME-overview"
      ]
    },

      "body": "# 数据视角元数据（company/knowledge/data）\n\n公司级数据视角：**本层无实体**。主数据域 MDG ∈ 系统库 `knowledge/data/MDG-*`。实例索引：[index.md](../index.md) §4（空表）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-DATA` |\n| 视角 | data |\n| 层级范围 | company |\n| 说明 | 仅治理/湖仓/安全等叙事；不登记 MDG/DS/ENT；MDG 由各系统 `SYS.uses_mdg_ids` 引用本系统 `MDG-*`。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| — | （无） | 公司层数据视角不落实体 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| — | — | — | — | — |\n\n---\n\n## 4. 字段（OKF）\n\n本层无 per-entity frontmatter。MDG 字段见系统 `data-meta.md`。\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| 系统 SYS.uses_mdg_ids | 系统 MDG.id | 系统声明使用的主数据域 |\n| 系统 DS.authoritative_mdg_id | 系统 MDG.id | 数据源归属主数据域 |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [index.md](../index.md) | 公司实体索引（§4 无行） |\n| 系统 `knowledge/data/` | MDG/DS/ENT SSOT |\n| naming-conventions（Agent 元知识） | ID 命名 SSOT |",

      "body": "# 知识树元数据（company/knowledge）\n\n公司层五视角知识树元数据 SSOT。实例索引：[index.md](index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE` |\n| layer_scope | company |\n| perspectives | business, product, application, data, technical |\n\n---\n\n## 2. 子目录\n\n| 目录 | 视角 | meta | 实例索引 |\n| --- | --- | --- | --- |\n| business/ | 业务 | [business-meta.md](business/business-meta.md) | [index.md](index.md) §1 |\n| product/ | 产品 | [product-meta.md](product/product-meta.md) | [index.md](index.md) §2 |\n| application/ | 应用 | [application-meta.md](application/application-meta.md) | [index.md](index.md) §3 |\n| data/ | 数据 | [data-meta.md](data/data-meta.md) | [index.md](index.md) §4 |\n| technical/ | 技术 | [technical-meta.md](technical/technical-meta.md) | [index.md](index.md) §5 |\n\n**子文件**：[README.md](README.md) · [overview/](overview/README.md)\n\n---\n\n## 3. 角色\n\n| 字段 | 值 |\n| --- | --- |\n| is_single_source_of_truth | true（公司级实体正文 SSOT） |\n| upstream | —（联邦顶层） |\n| downstream | 系统层、应用层（引用公司 ID） |\n\n---\n\n## 4. 索引\n\n| 类型 | 路径 |\n| --- | --- |\n| company_index | index.md（库外） |\n| entity_index | [index.md](index.md) |\n| design | knowledge-governance（agent/knowledge） |\n| governance | knowledge-governance（Agent 元知识） |\n\n---\n\n## 5. 公司层 BD 落盘\n\n| 层级 | 路径 | 说明 |\n| --- | --- | --- |\n| company | `knowledge/business/BD-{NAME}/BD-{NAME}.md` | 公司 SSOT（目录锚点） |\n| system | `BD-{NAME}.md` | 视角根 reference |\n| application | `BD-{NAME}.md` | 视角根 reference |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 五视角架构入口 |\n| knowledge-governance（agent/knowledge） | 公司库设计契约 |\n| naming-conventions（Agent 元知识） | 命名 SSOT |",

      "body": "# solutions — 解决方案文档\n\n公司层 SDD 方案目录：`SOLUTION-{IDEA-ID}.md` → [../analysis/](../analysis/README.md)。\n\n| 项 | 约定 |\n|----|------|\n| 文件 | 根目录平铺 |\n| 归档 | [archive/](archive/) |\n| IDEA-ID | 需求链统一标识 |\n| frontmatter | `id` 与文件名一致 |\n\n## 索引\n\n| 编号 | 标题 | 关联 analysis | 状态 |\n|------|------|---------------|------|\n| SOLUTION-EXAMPLE | 示例跨系统解决方案 | ANALYSIS-EXAMPLE | draft |\n\n规范：[sdx-solution](../../agent/skills/sdx-solution/SKILL.md)",

    "solutions/SOLUTION-EXAMPLE": {
      "id": "solutions/SOLUTION-EXAMPLE",
      "type": "",
      "title": "示例跨系统解决方案",
      "description": null,
      "tags": [
        "example"
      ],
      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 示例跨系统解决方案\n\n> **结论**：选方案 A——业务对象中心统一视图，收敛可追溯口径（G-1 / G-2）。  \n> 读者：业务与产品。路径：`company/solutions/`。\n\n---\n\n## 1. 背景与目标\n\n### 1.1 业务现状\n\n多系统共担同一业务链路；业务侧缺单一视角下的统一状态与可追溯信息。\n\n### 1.2 存在问题\n\n信息分散、多入口切换 → 排查慢、协作成本高、对外口径易不一致。\n\n### 1.3 业务目标\n\n| 目标编号 | 目标 | 度量 | 预期收益 |\n| -------- | ---- | ---- | -------- |\n| G-1 | 跨系统关键状态聚合为统一视图，快速定位「卡在哪」 | 单入口完成定位；典型问题定位耗时显著下降 | 少对账往返；快响应 |\n| G-2 | 对外承诺口径落到可验证业务规则，减解释成本与争议 | 解释口径一致；争议次数下降 | 稳客户体验（口径一致） |\n\n---\n\n## 2. 范围与约束\n\n### 2.1 核心场景\n\n单入口查询业务对象 → 返回各系统关键状态、时间点、下一步建议。\n\n### 2.2 涉及角色\n\n| 用户角色 | 角色描述 | 核心关注点 |\n| -------- | -------- | ---------- |\n| 业务人员 | 流转与对外解释 | 状态可见、口径一致 |\n| 运营人员 | 时效与异常 | 时效、异常定位 |\n| 协作方 | 链路环节处理 | 交接清晰、可追溯 |\n\n### 2.3 范围边界\n\n#### 范围内（In Scope）\n\n- 单一业务对象：跨系统关键状态统一展示与追溯\n- 与业务规则一致的状态解释与下一步指引\n\n#### 范围外（Out of Scope）\n\n- 不改既有业务规则（仅统一口径与呈现）\n- 不改各系统原处理流程（仅补展示/追溯字段口径）\n\n#### 成功标准\n\n- 单入口完成状态查询与定位，解释口径一致\n- 典型问题定位耗时显著下降（业务可验收口径）\n\n---\n\n## 3. 影响与冲突\n\n### 3.1 影响面\n\n- 业务：统一视图，少多处查询\n- 运营：异常定位更短、追溯更集中\n- 协作方：关键状态口径须一致且可追溯\n\n### 3.2 影响业务能力\n\n| 功能/业务能力 | 影响程度 | 影响类型 | 影响说明 |\n| ------------ | -------- | -------- | -------- |\n| 状态查询 | 高 | 口径调整 | 多入口 → 统一视图 |\n| 异常定位 | 中 | 追溯增强 | 关键时间点与责任归属提示 |\n| 对外解释 | 高 | 承诺一致性 | 统一规则 + 证据支撑口径 |\n\n### 3.3 影响传播路径\n\n```text\n[状态查询] → [异常定位] → [对外解释] → [跨团队协作]\n```\n\n### 3.4 业务冲突\n\n| 冲突编号 | 冲突描述 | 冲突类型 | 严重程度 | 化解方案 | 化解成本 |\n| -------- | -------- | -------- | -------- | -------- | -------- |\n| C-1 | 不同系统对同一状态命名/判定口径不一致 | 规则/流程/数据冲突 | 中 | 统一口径并补齐可追溯证据 | 中 |\n\n---\n\n## 4. 思路与方案\n\n### 4.1 解决思路\n\n**结论**：业务对象中心统一视图 = 对齐状态口径 + 补齐追溯 + 说明现状与下一步（业务可读）。多方案取舍见 §5.2。\n\n### 4.2 关键约束\n\n| 约束类型 | 约束描述 | 影响 |\n| -------- | -------- | ---- |\n| 业务 | 对外口径必须一致；冲突时以业务规则优先级 + 可追溯证据为准 | 统一视图须先收敛口径 |\n| 资源 | 最小改动；优先高频链路与高价值对象 | 分阶段覆盖，不全量一次铺开 |\n| 技术 | 正文只用业务可读方式写能力限制；不展开工程实现 | 实现细节下沉研发确认 |\n| 交付 | 无外部硬截止；按业务优先级分阶段，每阶段可独立验收 | 节奏由优先级驱动 |\n\n---\n\n## 5. 风险与待定\n\n### 5.1 风险评估\n\n| 风险编号 | 风险描述 | 可能性 | 影响程度 | 应对策略 |\n| -------- | -------- | ------ | -------- | -------- |\n| R-1 | 口径共识难，推进受阻 | 中 | 中 | 先高频链路，按优先级扩展 |\n| R-2 | 追溯不足影响解释 | 中 | 高 | 明确必填追溯项，分阶段补齐 |\n\n### 5.2 问题决策\n\n| 决策编号 | 决策点 | 影响 | 决策要点 | 状态 |\n| -------- | ------ | ---- | -------- | ---- |\n| Q-1 | 统一视图是否引入口径收敛 | 对外解释与争议成本 | 推荐方案A（统一视图+口径收敛）；备选方案B（仅文档约定人工对齐）；无口径则争议持续 | 已决策 |\n| Q-2 | 统一口径的优先级规则如何定义 | 对外口径 | 待业务规则 owner 给出优先级与证据要求 | 待确认 |\n\n**技术决策索引**：见 [company/adr/CONTEXT.md](../adr/CONTEXT.md)（技术/架构选型不入上表）。\n\n---\n\n## 6. 交付计划\n\n### 6.1 关键里程碑\n\n| 里程碑 | 覆盖范围 | 前置条件 | 交付物 | 验收标准 | 退出条件 |\n| ------ | -------- | -------- | ------ | -------- | -------- |\n| 里程碑-1 | 统一视图最小闭环：核心状态 + 可追溯要点 | Q-1 已决策；高频链路清单确认 | 可验收统一视图 | 单入口完成定位与解释 | 核心状态口径无未决冲突；可独立演示 |\n| 里程碑-2 | 扩链路与异常类型 | 里程碑-1 退出 | 扩展覆盖范围 | 覆盖按约定扩大且验收通过 | 约定链路均纳入；无阻塞性口径缺口 |\n\n### 6.2 切换方案\n\n| 里程碑 | 试点方式 | 通过标准 | 切换流程 | 回退条件 |\n| ------ | -------- | -------- | -------- | -------- |\n| 里程碑-1 | 选定高频对象/链路试点 | 试点对象定位与解释达标；口径争议可控 | 试点通过 → 扩大同一链路覆盖 → 宣布该链路切主入口 | 口径争议失控或定位准确率不达标 → 回退多入口并行 |\n\n---\n\n## 7. 附录\n\n### 7.1 术语表\n\n| 术语 | 定义 |\n| ---- | ---- |\n| 统一视图 | 面向业务侧的跨系统状态聚合展示 |\n| 口径 | 对同一状态/规则的统一定义与解释方式 |\n\n### 7.2 参考文档\n\n- `company/README.md`\n- `agent/knowledge/knowledge-governance.md`\n- `company/analysis/ANALYSIS-EXAMPLE.md`\n\n### 7.3 内部参考（仅供研发接力）\n\n无（示例文档）。\n\n### 7.4 质量自查表 (Self-Check)\n\n- [ ] **结构与占位**：`## 1`–`## 7` 齐全；空节须标「不适用/待补充」\n- [ ] **§1**：§1.1–§1.3 有实质或「不适用」；**G-n** 表含目标/度量/预期收益\n- [ ] **§2**：主路径；§2.3 In/Out + 成功标准\n- [ ] **§3**：与 §3.2 一致；含功能/对外承诺/下游；§3.3 协作链；每 **C-n** 有化解与成本\n- [ ] **§4**：§4.1 可读；§4.2 约束表已填；多方案取舍在 §5.2\n- [ ] **§5**：每 **R-n** 有可能性、影响、应对；**Q-n** 更新（无则「无」）\n- [ ] **§6**：§6.1 含覆盖/前置/交付/验收/退出；§6.2 仅需切换节点；阶段骨架在本文，ANALYSIS 1:1 映射 MVP\n- [ ] **业务可读**：正文无工程标识；技术线索仅 §7.3 且「待研发确认」\n- [ ] **一致性**：与需求、`knowledge/`、领域索引一致或已标盲区\n- [ ] **可追溯**：**G-n**/**C-n**/**R-n**/**Q-n** 可指回；编号连贯\n- [ ] **术语与引用**：§7.1 专用术语；§7.2 已引路径\n- [ ] **格式与元数据**：frontmatter 完整；`id` 与文件名一致",

<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
