:root {

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
header h1 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
  flex: 1 1 200px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
input[type="search"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  min-width: 220px;
}
select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
}
main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 380px;
  min-height: 0;
}
#cy {
  background: radial-gradient(circle at 30% 20%, #1a2332 0%, var(--bg) 70%);
}
aside {
  border-left: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#detail {
  flex: 1;
  overflow: auto;
  padding: 16px;
}
#detail h2 { margin: 0 0 8px; font-size: 1.2rem; }
#detail .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
#detail .tags span {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  margin: 2px 4px 2px 0;
  font-size: 0.75rem;
}
#detail .body {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  line-height: 1.55;
  font-size: 0.92rem;
}
#detail .body a { color: var(--accent); }
#detail .body pre {
  background: var(--bg);
  padding: 10px;
  border-radius: 6px;
  overflow: auto;
}
#backlinks {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  max-height: 160px;
  overflow: auto;
}
#backlinks h3 { margin: 0 0 8px; font-size: 0.9rem; }
#backlinks ul { margin: 0; padding-left: 18px; }
#backlinks li { margin: 4px 0; }
#backlinks a { color: var(--accent); cursor: pointer; text-decoration: none; }
#backlinks a:hover { text-decoration: underline; }
#legend {
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  max-height: 140px;
  overflow: auto;
}
#legend h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
.legend-item {
  display: inline-flex;
  align-items: center;
  margin: 2px 10px 2px 0;
  font-size: 0.75rem;
}
.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;
}
.empty-hint { color: var(--muted); font-style: italic; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  aside { border-left: none; border-top: 1px solid var(--border); }
}
</style>

      "body": "# 业务视角元数据（company/knowledge/business）\n\n**结论**：VC / BD / BL / BSD-L1 / CAP 视角元数据 SSOT。BA：VC→CAP 能力目录 ∥ BD 域模型；BL 无 parent，`maps_to` BSD-L1 一对一；BSD-L1 `maps_to` CAP。实例：[index.md](../index.md)。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-COMPANY-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | company |\n| 说明 | BA：VC→CAP 能力目录 ∥ BD 域模型；BL 无 parent，`maps_to` BSD-L1 一对一；BSD-L1 `maps_to` CAP。 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | VC | 价值链（能力目录根） |\n| 2 | BD | 业务域（支撑 VC） |\n| 3 | BSD-L1 | 业务子域（`level: 1`；挂 BD；由 BL 一对一映射；`maps_to` CAP） |\n| 4 | CAP | 业务能力（实现 VC；由 BSD-L1 一对一映射） |\n\nBL 不进上表序号。\n\n| 层级代码 | 说明 |\n| --- | --- |\n| BL | 业务线；无 parent；`maps_to` BSD-L1 一对一 |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | vc | VC | `VC-{NAME}` | — |\n| 2 | bd | BD | `BD-{NAME}` | —（无 parent） |\n| 3 | bsd1 | BSD | `BSD-{NAME}` | BD（`level: 1`） |\n| 4 | cap | CAP | `CAP-{NAME}` | VC（经 `implements_to`，非同类树 `parent`） |\n| — | bl | BL | `BL-{NAME}` | —（无 parent） |\n\n目录：`VC-{NAME}/VC-{NAME}.md` + `VC-{NAME}/CAP-*.md`；`BD-{NAME}/BD-{NAME}.md` + `BD-{NAME}/BSD-*.md`；`BL/BL-{NAME}.md`（单文件）。\n\n## 4. 字段（OKF）\n\nFrontmatter 10 必填 + 正文四段见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2；`layer_scope` = `company`。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。\n\n| 层级 | 字段 | 说明 |\n| --- | --- | --- |\n| VC | `supported_by`、`implemented_by` | 列表必填；与 BD/CAP 双向同步 |\n| BD | `supports_to`、`children` | 单值/列表必填；children 仅 BSD-L1 |\n| BL | `maps_to`、`mapped_by` | `maps_to` 单值必填，目标为 BSD-L1，一对一；`mapped_by` 列表，含解决方案 PL（纯 ID） |\n| BSD-L1 | `level`、`parent`、`children`、`maps_to`、`mapped_by` | `level` 固定 `1`；`children` 仅 BSD-L2；`maps_to` 单值 CAP；`mapped_by` 列表，含 BL |\n| CAP | `implements_to`、`mapped_by` | `implements_to` 单值必填，目标为 VC；`mapped_by` 列表，含 BSD-L1 |\n| BD | `strategic_classification` | 正文扩展 |\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| CAP.implements_to | VC.id | CAP 实现价值链 |\n| CAP.mapped_by | BSD-L1.id | 对端列表 |\n| BD.supports_to | VC.id | BD 支撑价值链 |\n| BL.maps_to | BSD-L1.id | 一对一 |\n| BSD-L1.mapped_by | BL.id | 对端列表 |\n| BSD-L1.maps_to | CAP.id | 一对一 |\n| BSD-L1.children | BSD-L2.id | 仅 L2 |\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事索引 |\n| [index.md](../index.md) | 实例 SSOT |\n| [naming-conventions](../../../agent/knowledge/naming-conventions.md) | ID 命名 |",

      "body": "# 业务能力\n\n[返回 · 业务架构](../README.md)\n\n**结论**：公司级能力框架与成熟度标准。域划分见 [业务域划分](business-domain-division.md)。\n\n> **映射一致性**：每个 CAP 必须唯一归属一个公司 BSD-L1。一个能力可在多个价值环节被调用，但不因跨环节使用而拆成多个能力。\n\n## 能力清单\n\n两层：业务环节能力（归属环节）· 业务支撑能力（跨环节，不归属单一环节）。\n\n### 业务环节能力\n\n| 能力 | 归属环节 | 说明 |\n|------|---------|------|\n\n### 业务支撑能力\n\n| 能力 | 归属域 | 说明 |\n|------|--------|------|\n\n## 成熟度评估\n\n评估维度与等级定义。",

      "tags": [
        "architecture",

      "body": "# 业务域划分\n\n[返回 · 业务架构](../README.md)\n\n**结论**：公司级 BD 与 BSD-L1 由价值链与能力推导，按 DDD 限界上下文定界。能力见 [业务能力](business-capability.md)；价值链见 [价值链](business-value-chain.md)。\n\n## 核心域\n\n直接实现价值环节的一级域。\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么 / 不做什么 | 提供什么能力 |\n\n## 支撑域\n\n横跨价值环节的一级域。\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么 / 不做什么 | 提供什么能力 |\n\n## 通用域\n\n跨业务复用的一级域。\n\n| 业务域 | 职责 | 边界 | 能力 |\n|---|---|---|---|\n| XX域 | 定义与职责 | 做什么 / 不做什么 | 提供什么能力 |\n\n## 业务子域\n\n| 业务域 | 业务子域 | 职责 | 边界 | 能力 |\n|---|---|---|---|---|\n| XX域 | XX子域 | 定义与职责 | 做什么 / 不做什么 | 提供什么能力 |\n\n## 业务域关系图\n\n```mermaid\ngraph TB\n    subgraph 核心域[\"核心域 · 直接实现价值环节\"]\n        direction LR\n        DOM_SALE[\"XX域\"] --> DOM_ORDER[\"XX域\"]\n    end\n\n    subgraph 支撑域群[\"支撑域群 · 横跨环节\"]\n        DOM_FULFILL[\"XX域\"]\n    end\n\n    subgraph 通用域群[\"通用域 · 跨业务复用\"]\n        DOM_COMMON[\"XX域\"]\n    end\n\n    DOM_ORDER -..-> DOM_FULFILL\n    DOM_SALE -..-> DOM_COMMON\n```",

<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
