# 知识库建联清单（可由 docs-link.sh / docs-install.sh 维护）
# company 层解决方案建联唯一事实源；允许空。公司无 type: parent。
# `links: []` = 尚未挂载 solution 槽位（合法模板态）；实例化后按解决方案追加 child。
# docs-install 会写入一条 type: meta（装机源元库；doc_dir=company，指向元仓模板子树）。
# 缺省无 type 的条目视为 child。child 用 solution_name / solution_label。
# 槽位：solution-slots/solution-{NAME}。公司不挂 system-slots。
#
# 样例：
#   - type: meta
#     repository: "git@github.com:example/ai-knowledge.git"
#     path: "~/workspaces/ai-knowledge"
#     doc_dir: "company"
#   - repository: "git@github.com:example/sln-foo.git"
#     path: "~/workspaces/sln-foo"
#     doc_dir: "docs"
#     solution_name: "sln-foo"
#     solution_label: "示例解决方案"
links: []
