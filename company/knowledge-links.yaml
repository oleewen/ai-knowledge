# 知识库建联清单（可由 docs-link.sh / docs-install.sh 维护）
# company 层解决方案建联唯一事实源；允许空。公司无 type: parent。
# 已有一条 type: meta（装机源元库；dir=company，指向元仓模板子树）。child 未挂载；实例化后按解决方案追加。
# 每条必须写 type：parent、child 或 meta。child 用 name / label。
# dir：meta 的值 = KNOWLEDGE_TYPE；parent/child 的值 = 对方 DOC_DIR。空则省略。
# 槽位：solution-slots/solution-{NAME}。公司不挂 system-slots。
#
# 样例：
#   - type: meta
#     repository: "git@github.com:example/ai-knowledge.git"
#     path: "${WORK_SPACE}/ai-knowledge"
#     dir: "company"
#   - type: child
#     repository: "git@github.com:example/sln-foo.git"
#     path: "${WORK_SPACE}/sln-foo"
#     dir: "docs"
#     name: "sln-foo"
#     label: "示例解决方案"
links:
  - type: meta
    repository: "git@github.com:oleewen/ai-knowledge.git"
    path: "${WORK_SPACE}/ai-knowledge"
    dir: "company"
