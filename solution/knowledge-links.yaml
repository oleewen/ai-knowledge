# 知识库建联清单（可由 docs-link.sh / docs-install.sh 维护）
# 可含一条 type: parent（上级 company）、一条 type: meta（装机源元库）与若干 type: child。
# 每条必须写 type：parent、child 或 meta。
# dir：meta 的值 = 本库 KNOWLEDGE_TYPE（solution），指向元仓模板子树；parent/child 的值 = 对方 DOC_DIR。空则省略。
# 示例：
#   - type: meta
#     repository: "git@github.com:example/ai-knowledge.git"
#     path: "~/workspaces/ai-knowledge"
#     dir: "solution"
#   - type: parent
#     repository: "git@github.com:example/company-ea.git"
#     path: "~/workspaces/company-ea"
#     dir: "docs"
#     name: "company-ea"
#     label: "company-ea"
#   - type: child
#     repository: "https://example.com/org/sys-foo.git"
#     path: "~/workspaces/sys-foo"
#     dir: "docs"
#     name: "sys-foo"
#     label: "sys-foo"
links:
  - type: meta
    repository: "git@github.com:oleewen/ai-knowledge.git"
    path: "~/workspaces/ai-knowledge"
    dir: "solution"
