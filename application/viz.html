header {
  padding: 12px 16px;

  background: var(--panel);

  flex-wrap: wrap;

}
header h1 {
  margin: 0;
  font-size: 1.1rem;

}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
input[type="search"] {

  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  min-width: 220px;
}
select {
  background: var(--bg);
  border: 1px solid var(--border);

  border-radius: 6px;
}
main {
  flex: 1;
  display: grid;

  min-height: 0;
}
#cy {

}
aside {
  border-left: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#detail {
  flex: 1;
  overflow: auto;
  padding: 16px;
}
#detail h2 { margin: 0 0 8px; font-size: 1.2rem; }
#detail .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
#detail .tags span {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  margin: 2px 4px 2px 0;
  font-size: 0.75rem;
}
#detail .body {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  line-height: 1.55;
  font-size: 0.92rem;
}
#detail .body a { color: var(--accent); }
#detail .body pre {
  background: var(--bg);
  padding: 10px;
  border-radius: 6px;
  overflow: auto;
}
#backlinks {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  max-height: 160px;
  overflow: auto;
}
#backlinks h3 { margin: 0 0 8px; font-size: 0.9rem; }
#backlinks ul { margin: 0; padding-left: 18px; }
#backlinks li { margin: 4px 0; }
#backlinks a { color: var(--accent); cursor: pointer; text-decoration: none; }
#backlinks a:hover { text-decoration: underline; }
#legend {
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  max-height: 140px;
  overflow: auto;
}
#legend h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
.legend-item {
  display: inline-flex;
  align-items: center;
  margin: 2px 10px 2px 0;
  font-size: 0.75rem;
}
.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;
}
.empty-hint { color: var(--muted); font-style: italic; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  aside { border-left: none; border-top: 1px solid var(--border); }
}
</style>

      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 示例应用解决方案\n\n> **结论**：在本应用内先收敛「申诉提交通道 + 进度可见」，再扩审核协同。  \n> 读者：业务与产品。路径：`application/analysis/`。  \n> 下游：[../features/FEATURE-EXAMPLE.md](../features/FEATURE-EXAMPLE.md)\n\n---\n\n## 1. 背景与目标\n\n### 1.1 业务现状\n\n用户对账单有异议时，经客服或线下渠道发起申诉；进度靠人工转告，业务侧难自助跟踪。\n\n### 1.2 存在问题\n\n入口分散 → 重复提交；进度不可见 → 催单多；口径靠口头 → 争议难收口。\n\n### 1.3 业务目标\n\n| 目标编号 | 目标 | 度量 | 预期收益 |\n| -------- | ---- | ---- | -------- |\n| G-1 | 本应用内提供唯一申诉提交通道 | 主路径申诉经该通道占比达标 | 少重复单、少入口切换 |\n| G-2 | 提交后进度对用户与客服可见 | 催单量下降；自助查进度可用 | 降人工转告成本 |\n\n---\n\n## 2. 范围与约束\n\n### 2.1 核心场景\n\n用户在本应用发起账单申诉 → 填写原因与凭证 → 查看审核进度与结果说明。\n\n### 2.2 涉及角色\n\n| 用户角色 | 角色描述 | 核心关注点 |\n| -------- | -------- | ---------- |\n| 终端用户 | 发起与跟踪申诉 | 入口清晰、进度可见 |\n| 客服 | 协助解释与催办 | 状态一致、少重复问询 |\n| 审核人员 | 处理申诉结论 | 材料齐全、口径可依 |\n\n### 2.3 范围边界\n\n#### 范围内（In Scope）\n\n- 本应用内申诉提交、进度展示、结果说明\n- 与本应用既有账单查询的衔接（业务话术）\n\n#### 范围外（Out of Scope）\n\n- 跨应用系统编排与统一视图（见 `system/solutions/`、`company/solutions/`）\n- 审核规则引擎大改（本轮只对齐展示与提交流程）\n\n#### 成功标准\n\n- 主路径可在本应用完成提交与查进度\n- 典型催单场景显著减少（业务可验收口径）\n\n---\n\n## 3. 影响与冲突\n\n### 3.1 影响面\n\n- 用户：少多入口、可自助看进度\n- 客服：解释口径与系统状态对齐\n- 审核：材料入口更集中\n\n### 3.2 影响业务能力\n\n| 功能/业务能力 | 影响程度 | 影响类型 | 影响说明 |\n| ------------ | -------- | -------- | -------- |\n| 账单查询 | 中 | 衔接增强 | 从查账进入申诉入口 |\n| 申诉提交 | 高 | 流程新建/收敛 | 多入口 → 唯一通道 |\n| 进度查询 | 高 | 能力新增 | 自助可见状态 |\n\n### 3.3 影响传播路径\n\n```text\n[账单查询] → [申诉提交] → [进度查询] → [客服解释]\n```\n\n### 3.4 业务冲突\n\n| 冲突编号 | 冲突描述 | 冲突类型 | 严重程度 | 化解方案 | 化解成本 |\n| -------- | -------- | -------- | -------- | -------- | -------- |\n| C-1 | 旧线下入口与应用内通道并存导致双单 | 流程冲突 | 中 | 宣布主通道并设过渡期引导 | 中 |\n\n---\n\n## 4. 思路与方案\n\n### 4.1 解决思路\n\n**结论**：先收口提交与进度可见（本应用闭环），再视效果扩展审核协同。取舍见 §5.2。\n\n### 4.2 关键约束\n\n| 约束类型 | 约束描述 | 影响 |\n| -------- | -------- | ---- |\n| 业务 | 对外解释须与应用内状态一致 | 进度文案须可对客 |\n| 资源 | 最小改动；优先主路径账单类型 | 分阶段覆盖账单类型 |\n| 技术 | 正文不写实现栈；能力限制用业务话术 | 细节待研发确认 |\n| 交付 | 无外部硬截止；每阶段可独立验收 | 节奏由业务优先级驱动 |\n\n---\n\n## 5. 风险与待定\n\n### 5.1 风险评估\n\n| 风险编号 | 风险描述 | 可能性 | 影响程度 | 应对策略 |\n| -------- | -------- | ------ | -------- | -------- |\n| R-1 | 旧入口未关导致双单 | 中 | 中 | 过渡期双写监测 + 引导关旧 |\n| R-2 | 进度文案与审核实态不一致 | 中 | 高 | 状态词典与审核结论对齐 |\n\n### 5.2 问题决策\n\n| 决策编号 | 决策点 | 影响 | 决策要点 | 状态 |\n| -------- | ------ | ---- | -------- | ---- |\n| Q-1 | 是否本轮就关停全部线下入口 | 双单风险与切换成本 | 推荐：保留过渡期并行，主推应用内；备选：一刀切关旧 | 已决策 |\n| Q-2 | 进度状态对外文案最终词典 | 客服解释与争议 | 待业务/客服共定状态词典 | 待确认 |\n\n**技术决策索引**：见 [application/adr/CONTEXT.md](../adr/CONTEXT.md)（技术/架构选型不入上表）。\n\n---\n\n## 6. 交付计划\n\n### 6.1 关键里程碑\n\n| 里程碑 | 覆盖范围 | 前置条件 | 交付物 | 验收标准 | 退出条件 |\n| ------ | -------- | -------- | ------ | -------- | -------- |\n| 里程碑-1 | 唯一提交通道 + 基础进度可见（主路径账单） | Q-1 已决策 | 可验收提交流程 | 主路径可提交并查进度 | 双单率可控；可独立演示 |\n| 里程碑-2 | 扩账单类型与结果说明完善 | 里程碑-1 退出；Q-2 收敛或有临时词典 | 扩展覆盖 + 结果说明 | 约定类型可走通；催单下降可验收 | 无阻塞性口径缺口 |\n\n### 6.2 切换方案\n\n| 里程碑 | 试点方式 | 通过标准 | 切换流程 | 回退条件 |\n| ------ | -------- | -------- | -------- | -------- |\n| 里程碑-1 | 选定用户群/账单类型试点 | 提交成功率与进度可见达标；双单可控 | 试点通过 → 扩大类型 → 主推应用内入口 | 双单失控或进度不准 → 恢复旧入口并行并修文案 |\n\n---\n\n## 7. 附录\n\n### 7.1 术语表\n\n| 术语 | 定义 |\n| ---- | ---- |\n| 提交通道 | 本应用内发起申诉的主入口路径 |\n| 进度可见 | 用户/客服可自助查看申诉所处阶段 |\n\n### 7.2 参考文档\n\n- `application/README.md`\n- `application/features/FEATURE-EXAMPLE.md`\n\n### 7.3 内部参考（仅供研发接力）\n\n无（示例文档）。\n\n### 7.4 质量自查表 (Self-Check)\n\n- [ ] **结构与占位**：`## 1`–`## 7` 齐全；空节须标「不适用/待补充」\n- [ ] **§1**：§1.1–§1.3 有实质或「不适用」；**G-n** 表含目标/度量/预期收益\n- [ ] **§2**：主路径；§2.3 In/Out + 成功标准\n- [ ] **§3**：与 §3.2 一致；含功能/对外承诺/下游；§3.3 协作链；每 **C-n** 有化解与成本\n- [ ] **§4**：§4.1 可读；§4.2 约束表已填；多方案取舍在 §5.2\n- [ ] **§5**：每 **R-n** 有可能性、影响、应对；**Q-n** 更新（无则「无」）\n- [ ] **§6**：§6.1 含覆盖/前置/交付/验收/退出；§6.2 仅需切换节点；MVP 归 ANALYSIS\n- [ ] **业务可读**：正文无工程标识；技术线索仅 §7.3 且「待研发确认」\n- [ ] **一致性**：与需求、`knowledge/`、领域索引一致或已标盲区\n- [ ] **可追溯**：**G-n**/**C-n**/**R-n**/**Q-n** 可指回；编号连贯\n- [ ] **术语与引用**：§7.1 专用术语；§7.2 已引路径\n- [ ] **格式与元数据**：frontmatter 完整；`id` 与文件名一致",

      "body": "应用侧实现版图（SYS→APP→MS→API）实体登记与接口实现元数据。实例索引 [index.md](../index.md)（§3，扫描生成；实体 `{ID}.md` = SSOT）。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-APPLICATION` |\n| 视角 | application |\n| 层级范围 | application |\n| 说明 | 实现版图；SYS/APP/MS 系统首次定义；本层 SSOT 为 **API**，上游可留 reference / 纯 ID。 |\n| entities_shape | 实体 `{ID}.md`（OKF）；索引见 INDEX-GUIDE 第四章 §3 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | SYS | 系统（系统层首次定义；本层可为 reference） |\n| 2 | APP | 应用（系统层首次定义） |\n| 3 | MS | 对外入口宿主类聚类（系统层首次定义） |\n| 4 | API | 接口端点（HTTP/Dubbo/MQ/Job，应用层首次定义） |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | sys | SYS | `SYS-{NAME}` | SLN（公司） |\n| 2 | app | APP | `APP-{NAME}` | SYS |\n| 3 | ms | MS | `MS-{NNN}` 或 `MS-{NAME}` | APP |\n| 4 | api | API | `API-{NNN}` 或 `API-{NAME}-{NNN}` | MS |\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `application`）。详见 okf-spec §2。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| SYS | `architecture`（apps / external_dependencies / ddd_layers）；`uses_to` | 详细说明 / 跨视角 |\n| APP | `implements_to`、`implemented_by`、`supports_to`、`uses_to`、`startup_class`、`maven_module` | 关系 / 跨视角 / 详细说明 |\n| MS | `implements_to`、`implemented_by`、`maps_to`、`uses_to`、`host_class`、`host_module`、`protocol` | 关系 / 跨视角 / 详细说明 |\n| API | `implements_to`、`supports_to`、`maps_to`、`alias`、`method_signature`、`api_type`（DUBBO/HTTP/MQ/JOB） | 关系 / 跨视角 / 详细说明 |\n\n## 5. 跨层路径映射（MS/API）\n\n本层不落 SYS/APP/MS 实体文件；`MS-{NAME}/` 可作 API 宿主目录，`API` 为叶子。\n\n| 实体 | system 路径 | application 路径 | 说明 |\n| --- | --- | --- | --- |\n| SYS-EXAMPLE | `SYS-EXAMPLE.md` | （不落盘；纯 ID → 系统） | system SSOT |\n| APP-EXAMPLE | `APP-EXAMPLE/` | （不落盘；纯 ID → 系统） | system SSOT |\n| MS-EXAMPLE | `APP-EXAMPLE/MS-EXAMPLE/` | （不落 MS 实体；可宿主 API） | system SSOT |\n| API-EXAMPLE | （system 不登记） | `MS-EXAMPLE/API-*.md` | API 仅 application SSOT |\n\n**链接约定**：同 bundle 用 `/knowledge/...`；跨 bundle `# SSOT` 用仓库根相对路径。\n\n## 6. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| BC.supported_by | APP.id | 业务上下文由应用支撑 |\n| AB.maps_to | API.id | 能力对标 API |\n| API.supports_to | FT.id | 接口支撑功能点 |\n| DS.used_by | APP.id | 数据源被应用使用 |\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [index.md](../index.md) | §3 应用视角 + 五视角实例索引（扫描生成） |\n| SYS-* / APP-* / MS-* | 系统层 SSOT（reference / 纯 ID） |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md、manifest/OpenAPI（按需）。",

      "body": "应用侧 DDD 业务版图（BD→BSD→BC→AGG→AB）实体登记与实现映射元数据。实例索引 [index.md](../index.md)（§1，扫描生成；实体 `{ID}.md` = SSOT）。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | application |\n| 说明 | DDD 业务版图；公司级 BD/CAP ∈  首次定义，系统层自 BSD 起首次定义，本层承接实现映射与实例登记。 |\n| entities_shape | 实体 `{ID}.md`（OKF）；`BSD` = 目录锚点，`BC/AGG` = 容器目录，`AB` = `AGG` 下叶子；索引见 INDEX-GUIDE 第四章 §1 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | BD | 业务域（应用层可登记；公司层 = SSOT） |\n| 2 | BSD | 业务子域（系统层首次定义，应用层可引用/登记） |\n| 3 | BC | 限界上下文（系统层首次定义，应用层承接实现映射） |\n| 4 | AGG | 聚合根（系统层首次定义，应用层补充持久化/服务映射） |\n| 5 | AB | 领域能力（Ability，系统层首次定义，应用层补充 API 映射） |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | bd | BD | `BD-{NAME}` | — |\n| 2 | bsd | BSD | `BSD-{NAME}` | BD |\n| 3 | bc | BC | `BC-{NAME}` | BSD |\n| 4 | agg | AGG | `AGG-{NAME}` | BC |\n| 5 | ab | AB | `AB-{NAME}` | AGG |\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `application`）。详见 okf-spec §2。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。业务属性写正文，勿堆 frontmatter。\n\n### 各层专属（正文）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| BD | `strategic_classification`、`children` | 关系 / 详细说明 |\n| BSD | `parent`、`implemented_by` | 关系 |\n| BC | `implements_to`、`implemented_by`、`supported_by` | 关系 / 跨视角 |\n| AGG | `implements_to`、`implemented_by`、`maps_to` | 关系 / 跨视角 |\n| AB | `implements_to`、`capability`、`maps_to` | 详细说明 / 跨视角 |\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| BC.supported_by | APP.id | 上下文由应用支撑 |\n| AGG.maps_to | ENT.id \\| MS.id | 聚合对标实体 / 入口簇 |\n| AB.maps_to | API.id | 能力对标 API |\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [index.md](../index.md) | §1 业务视角 + 五视角实例索引（扫描生成） |\n| BD-*, CAP-* | 公司层 SSOT（reference） |\n| BSD-*, BC-*, AGG-*, AB-* | 系统层 SSOT（reference） |\n| index.md（库外） | 联邦索引 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md（按需）。",

      "body": "# 业务规则与策略\n\n[返回 · 业务架构](../README.md)\n\n本系统业务策略与合规约束；产品、风控与合规共用依据。\n\n> **规则与策略 SSOT**：公司级业务治理框架见 公司层 business 视角章节。\n\n> **范围说明**：本文件聚焦策略与约束；功能级 BR 见 [用户旅程 · 业务规则清单](../../product/chapters/product-user-journeys.md#业务规则清单)。\n\n## 策略规则\n\n列出规则编号、场景、条件、结论、例外与优先级。\n\n## 合规风控\n\n写清法规/政策要求、控制点、审计留痕与落实状态。\n\n## 业务策略\n\n说明定价、授信、路由等策略原则、参数边界与灰度回滚。",

      "body": "应用侧数据版图（MDG→DS→ENT→TBL）实体登记与物理落地元数据。实例索引 [index.md](../index.md)（§4，扫描生成；实体 `{ID}.md` = SSOT）。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-DATA` |\n| 视角 | data |\n| 层级范围 | application |\n| 说明 | MDG/DS/ENT 系统首次定义；本层可留 MDG/DS/ENT reference，SSOT 为 **TBL**。 |\n| entities_shape | 实体 `{ID}.md`（OKF）；索引见 INDEX-GUIDE 第四章 §4 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | MDG | 主数据域（系统层 SSOT；本层可为 reference） |\n| 2 | DS | 数据存储（系统层首次定义） |\n| 3 | ENT | 数据实体（表/集合，系统层首次定义） |\n| 4 | TBL | 物理表锚点（应用层首次定义；挂 ENT） |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | mdg | MDG | `MDG-{NAME}` | —（reference → system） |\n| 2 | ds | DS | `DS-{NAME}` | MDG（逻辑归属，`implements_to`） |\n| 3 | ent | ENT | `ENT-{NNN}` 或 `ENT-{NAME}` | DS |\n| 4 | tbl | TBL | `TBL-{NAME}` | ENT（`implements_to`） |\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `application`）。详见 okf-spec §2。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。`definition_scope` 等可作 frontmatter 扩展。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| MDG | `definition_scope: reference`、`governance_owner` | FM 扩展 / 详细说明 |\n| DS | 存储 `type`、`config_key`、`implements_to`、`used_by` | 详细说明 / 跨视角（勿与 OKF `type` 混淆） |\n| ENT | `logical_name`、`physical_table`、`implements_to`、`maps_to` | 详细说明 / 跨视角 |\n| TBL | `physical_name`、`implements_to` | 详细说明 / 关系 |\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| MDG（reference） | system MDG.id | 上游系统 SSOT |\n| DS.implements_to | MDG.id | 数据源归属主数据域 |\n| AGG.maps_to | ENT.id | 聚合对标实体 |\n| ENT.maps_to | AGG.id | 实体对标聚合 |\n| DS.used_by | APP.id | 数据源被应用使用 |\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [index.md](../index.md) | §4 数据视角 + 五视角实例索引（扫描生成） |\n| MDG-* / DS-* / ENT-* | 系统层 SSOT（reference） |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md（按需）。",

      "body": "# 数据分析\n\n[返回 · 数据架构](../README.md)\n\n本系统分析主题、指标口径与消费路径。\n\n> **数据分析 SSOT**：公司级数据框架见 公司层 data 视角章节。\n\n## 分析主题\n\n写主题域、服务对象与刷新频率。\n\n## 指标口径\n\n写核心指标定义、维度与权威来源。\n\n## 消费路径\n\n写报表/API/导出等消费方式与权限边界。",

      "body": "# 数据流转\n\n[返回 · 数据架构](../README.md)\n\n本系统数据流动、加工与一致性保障。\n\n> **数据流转 SSOT**：公司级数据框架见 公司层 data 视角章节。\n\n## 数据流图\n\n画主要 DFD；区分批/实时并与业务流程对齐。\n\n## ETL 流程\n\n写抽取/转换/加载职责、调度与质量校验嵌入点。\n\n## 实时数据流\n\n写 CDC、Topic、顺序语义与 Schema 演进约定。\n\n## 数据同步\n\n写系统间同步模式、幂等与冲突解决。\n\n## 数据一致性\n\n写强一致/最终一致/Saga 选用场景与对账规则。",

      "body": "# 数据模型\n\n[返回 · 数据架构](../README.md)\n\n本系统数据源与物理层结构。\n\n> **数据模型 SSOT**：公司级数据原则见 公司层 data · data-overview 章节。\n\n与 [领域模型](../../application/chapters/application-domain-model.md)、[概念模型](../../business/chapters/business-glossary.md#概念模型) 交叉对齐。\n\n## 物理模型\n\n### 数据源\n\n列出 OLTP、缓存、消息、对象存储等类型、用途与 SSOT 归属。\n\n### 数据实体\n\n写持久化实体定义及与领域模型/主数据的对应。\n\n## 主数据\n\n主数据域（`MDG-*`）、权威源与黄金记录规则。本层 MDG 为 SSOT；SYS 经 `uses_mdg_ids` 声明使用关系；DS 经 `authoritative_mdg_id` 归属域。\n\n### 数据表\n\n写表结构、索引、分区与 DDL 版本入口。\n\n## 服务实体映射\n\n按服务列出核心数据实体及跨服务引用处理方式。\n\n## 模型版本\n\n写 Migration 规范、兼容策略与生产变更审批。",

      "body": "应用侧产品版图（PL 公司；PD 系统；本层映射 PM→…）实体登记与交互映射元数据。实例索引 [index.md](../index.md)（§2，扫描生成；实体 `{ID}.md` = SSOT）。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-PRODUCT` |\n| 视角 | product |\n| 层级范围 | application |\n| 说明 | 产品版图；公司 PL 首次定义；公司 SLN（AA）首次定义（本层不落）；系统 PD 首次定义（本层不落 PD）。`PM.implements_to` → 系统 `PD-*`。 |\n| entities_shape | 实体 `{ID}.md`（OKF）；索引见 INDEX-GUIDE 第四章 §2 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | PL | 产品线（公司层；本层不落盘） |\n| 2 | PD | 产品服务（系统层首次定义；本层不落盘） |\n| 3 | PM | 产品模块（系统层首次定义） |\n| 4 | FT | 功能点（系统层首次定义，应用层承接 API / 验收映射） |\n| 5 | FR | 功能需求（系统层首次定义，应用层承接验收与接口映射） |\n| 6 | UC | 用户用例（系统层首次定义，应用层承接 API 映射） |\n| 7 | BR | 业务规则（系统层首次定义，应用层承接实现映射） |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | pl | PL | `PL-{NAME}` | —（公司） |\n| 2 | pd | PD | `PD-{NAME}` | PL（系统 SSOT） |\n| 3 | pm | PM | `PM-{NAME}` | PD（只许本系统 PD） |\n| 4 | ft | FT | `FT-{NAME}` | PM |\n| 5 | fr | FR | `FR-{NAME}` | FT |\n| 6 | uc | UC | `UC-{NAME}` | FR |\n| 7 | br | BR | `BR-{NAME}` | FR |\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `application`）。详见 okf-spec §2。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| PM | `implements_to`、`maps_to`、`depends_to` | 关系 / 跨视角 |\n| FT | `supported_by`、`acceptance_criteria`（推荐） | 跨视角 / 详细说明 |\n| FR | `implements_to`、`implemented_by`（UC/BR） | 关系 |\n| UC | `implements_to`、`maps_to`（推荐） | 跨视角 |\n| BR | （实现映射按需） | 跨视角 / 详细说明 |\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| PM.implements_to | 系统 PD.id | 模块归属产品服务 |\n| PM.depends_to | PM.id | 模块依赖其它模块 |\n| PM.maps_to | BC.id | 模块对标限界上下文 |\n| FT.supported_by | API.id | 功能由 API 支撑 |\n| UC.maps_to | API.id | 用例对标 API |\n\n## 6. BP 流程叙事（旁路实体）\n\n可选 `BP-{NAME}.md`（OKF：`hierarchy: BP`）：\n\n- 与本视角实体同目录级；`implements_to` 可为 `PD-*` / `PM-*`；frontmatter `parent_id` 可空\n- 正文可分 M/S/B 节，引用 `PD/PM/FT`\n- **不**挂入 `PL → PD → PM → FT → FR → UC/BR` 组成链\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [index.md](../index.md) | §2 产品视角 + 五视角实例索引（扫描生成） |\n| 系统 PD-* | 产品服务 SSOT（本层不落盘） |\n| 公司 PL-* / SLN-* | 产品线 / 解决方案（本层不落盘） |\n| PM-*, FT-*, FR-*, UC-*, BR-* | 系统层 SSOT（reference / 本层映射） |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md（按需）。",

      "body": "应用层技术版图（TSD→MW→CMP）视角元数据 SSOT。实例索引 [index.md](../index.md)（§5，扫描生成；实体 `{ID}.md` = SSOT）。\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-TECHNICAL` |\n| 视角 | technical |\n| 层级范围 | application |\n| 说明 | 中间件绑定与关键组件；公司级 TPL、系统级 TSD 在对应层首次定义，本层补齐 TSD reference 并登记 MW/CMP。 |\n| entities_shape | 实体 `{ID}.md`（OKF）；索引见 INDEX-GUIDE 第四章 §5 |\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | TSD | 系统级技术域（系统层 SSOT；本层为视角根 reference） |\n| 2 | MW | 中间件绑定实例 |\n| 3 | CMP | 关键 Maven 依赖 / 运行时组件 |\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | tsd | TSD | `TSD-{NAME}` | —（reference → system） |\n| 2 | mw | MW | `MW-{NAME}` | TSD（逻辑归属，`implements_to`） |\n| 3 | cmp | CMP | `CMP-{NAME}` | MW |\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `application`）。详见 okf-spec §2。关系字段见 [glossary § 映射关系](../../../agent/knowledge/glossary.md#映射关系常用)。无 APP↔CMP / APP↔TPL 直连。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| TSD | `definition_scope: reference` | FM 扩展 / 详细说明 |\n| MW | `binding_type`、`config_key`、`implements_to`、`used_by`、`uses_to` | 详细说明 / 关系 / 跨视角 |\n| CMP | `maven_coordinates`、`implements_to` | 详细说明 / 关系 |\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| TSD（reference） | system TSD.id | 上游系统 SSOT |\n| MW.implements_to | TSD.id | 归属系统技术域 |\n| MW.used_by | APP.id | 被应用使用（对端 APP.uses_to） |\n| MW.uses_to | DS.id | 中间件使用数据源（可选） |\n| CMP.implements_to | MW.id | 组件挂载中间件 |\n| MS.uses_to | CMP.id | 入口簇使用组件 |\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [index.md](../index.md) | MW/CMP 实例索引 |\n| TPL-* | 公司层 TPL SSOT（reference） |\n| TSD-* | 系统层 TSD SSOT（reference） |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md（按需）。",

<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
