      "body": "# 贡献指南 — application/\n\n本文件只定义最小贡献规则；目录结构、字段与模板一律引用权威入口，避免重复维护。\n\n---\n\n## 先读这些入口\n\n1. [INDEX_GUIDE.md](INDEX_GUIDE.md)：九章索引（含中央知识库挂载建联登记）、与仓库根 [INDEX_GUIDE.md](../INDEX_GUIDE.md) 分工见各文件说明\n2. [DESIGN.md](DESIGN.md)：元模型、字段语义与跨视角映射\n3. [AGENTS.md](../AGENTS.md)：仓库级约束与禁止项\n4. 目标目录 `README.md` + 对应 `{perspective}-meta.md`：落盘与命名的最终约束\n\n---\n\n## 必须遵守\n\n1. **引用优先**：能链接到权威文档就不在本文件重复定义。\n2. **ID 稳定**：禁止未评估影响面即修改已有实体 ID；若调整，必须同步全链路引用。\n3. **仅写 ID**：跨文件、跨视角关联只写 ID 字符串，不复制目标定义正文。\n4. **变更可检索**：新增/调整文档后，更新目标目录 `README.md` 索引表；必要时同步 [INDEX_GUIDE.md](INDEX_GUIDE.md) 或根目录 [INDEX_GUIDE.md](../INDEX_GUIDE.md)。\n5. **提交规范**：使用 Conventional Commits；跨目录/规则变更建议补 ADR。\n\n---\n\n## 最小执行清单\n\n- 定范围：本次改动影响哪些目录、哪些 ID、哪些映射字段  \n- 读权威：先读目标目录 `README.md` 与 `{perspective}-meta.md`  \n- 落盘：按既有命名与 frontmatter 约束写入  \n- 回链：补索引与必要交叉引用  \n- 自检：全局搜索受影响 ID/字段，确认无断链\n\n---\n\n模板、阶段细则、技能入口见 [README.md](README.md)、[INDEX_GUIDE.md](INDEX_GUIDE.md) 与根目录 [INDEX_GUIDE.md](../INDEX_GUIDE.md)。",

      "body": "# 应用知识文档库 — 设计方案摘录\n\n本文件是《应用知识文档库设计方案》的**精简版**：治理依据与演进参考。细节与入口仍以 [README.md](README.md)、[INDEX_GUIDE.md](INDEX_GUIDE.md) 及仓库根 [INDEX_GUIDE.md](../INDEX_GUIDE.md) 为准。\n\n---\n\n## 阅读顺序\n\n1. [README.md](README.md) — 应用知识库定位与 SDD 主线\n2. 本文 — 原则、元模型、映射、演进\n3. [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md) — ID 规则\n4. 各视角 [knowledge/README.md](knowledge/README.md) — 落盘与字段\n\n---\n\n## 1. 原则与约定\n\n\n| 原则       | 说明                                                                                   |\n| -------- | ------------------------------------------------------------------------------------ |\n| **SSOT** | 实体只在一处定义；他处仅 **ID 引用**                                                               |\n| **联邦治理** | 系统库管边界与索引；应用库管实现细节并 **上行对齐**                                                         |\n| **闭环**   | knowledge ← 归档回写；阶段上 solutions → analysis → requirements；规约落在需求包内 specs/ 或 knowledge/application/ |\n| **五视角**  | 业务 / 产品 / 应用 / 数据 / 技术；关联写在各视角 meta 与 **per-entity `{ID}.md`**（OKF concept），**不**维护独立映射矩阵文件；legacy `*-entities.md` 已废弃                                       |\n| **与系统/公司层视角** | 五视角在各层同构；公司/系统/应用按 [naming-conventions.md](../agent/knowledge/naming-conventions.md) 与 §2.2.1 分层首次定义实体 |\n\n\n**目录索引（约定）**：\n\n- ***应用知识库根目录**：使用 [docs_meta.md](docs_meta.md) 概括 `application/` 树与子目录 meta 指针\n  - `knowledge/knowledge-meta.md` 描述知识树；\n  - 治理与命名 SSOT 见 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md)；\n  - **`solutions/`、`analysis/`、`requirements/`、`changelogs/`** 阶段约定均收敛于各目录 **`README.md`**。`knowledge/` 五视角采用 `{perspective}-meta.md` + **per-entity `{ID}.md`**（OKF SSOT）；`KNOWLEDGE_INDEX.md` 由扫描生成。\n- 细则见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md)。\n\n**协同（目标态）**：应用仓维护 `/docs` 与 `manifest.md`；系统侧可抓取 manifest 更新 `knowledge` 并做一致性检查。\n\n### OKF per-entity SSOT\n\n`application/` 已对齐 [Open Knowledge Format v0.1](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)：**每个知识实体**为一 concept 文件（`{ID}.md` + YAML frontmatter + bundle-relative 跨链）；各级 `index.md` 供 RAG 渐进下钻；`KNOWLEDGE_INDEX.md` 由工具扫描生成而非手写聚合表。路径与 type 见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md) §OKF；工具链见 `/docs-okf`。\n\n---\n\n## 2. `application/` 目录与元模型\n\n> 规范与 Agent 配置在仓库根目录 `agent/` 等，**不在** `application/` 内。\n\n### 2.1 `application/` 内目录\n\n\n| 目录                | 说明                                               |\n| ----------------- | ------------------------------------------------ |\n| **knowledge/**    | 业务 / 产品 / 应用 / 数据 / 技术 五视角                             |\n| **solutions/**    | `SOLUTION-{IDEA-ID}.md`                          |\n| **analysis/**     | `ANALYSIS-{IDEA-ID}.md`                          |\n| **requirements/** | `REQUIREMENT-{IDEA-ID}/` 按阶段交付（规约可在各包内 `specs/`） |\n| **changelogs/**   | 变更记录与索引运维（可选）                                    |\n| **adr/**          | 应用层 ADR 正文（`ADR-{序号}-{标题}.md`）                      |\n\n\n### 2.2 应用知识库\n\n治理与命名 SSOT 见仓库根 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md)（术语、原则、命名、ADR 已自 `constitution/` 迁入 `agent/knowledge/`）。\n\n#### 业务 (business)\n\n> 该视角回答：做什么业务、边界在哪、流程与能力如何组织。\n\n- **层级**：BD → BSD → BC → AGG → AB  \n- **约定**：`business-meta.md` 在 `knowledge/business/` 根目录；**域扁平树** `BSD-EXAMPLE/`（登记入口）内扁平存放 `BD-EXAMPLE.md`(reference) 与 BSD→AB 全链 `{ID}.md`。\n\n#### 产品 (product)\n\n> 该视角回答：用户是谁、功能如何组织、旅程与场景。\n\n- **层级**：PL → PM → FT → UC  \n- **约定**：`product-meta.md` 在根目录；`{PL-ID}/{PM-ID}/` 为锚点。实例为 per-entity `{ID}.md`（OKF concept）；索引见 [KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md) §2。FT 含 `invokes_api_ids`、`realizes_use_case_ids` 等；UC 含 `map_to_api_id` 等。\n\n#### 应用 (application)\n\n> 该视角回答：系统如何拆分、服务如何协作、领域与集成边界。\n\n- **层级**：SYS → APP → MS → API  \n- **约定**：`application-meta.md` 在根目录；`{SYS-ID}/{APP目录}/` 为锚点。APP/MS/API 等实体以 per-entity `{ID}.md` frontmatter 登记 `repo_url`、`docs_manifest_path`、`service_ids` 等；索引见 [KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md) §3。\n\n#### 数据 (data)\n\n> 该视角回答：数据如何建模、存储、流转与治理。\n\n- **层级**：DS → ENT  \n- **约定**：`data-meta.md` 在根目录；`{DS-ID}/` 为存储锚点。实例为 per-entity `{ID}.md`；索引见 [KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md) §4。ENT 含 `maps_to_aggregate_id`、敏感级别等。\n\n#### 技术 (technical)\n\n> 该视角回答：如何运行、扩展、观测与交付。\n\n- **层级**：MW → CMP（公司 **TPL**、系统 **TSD** 在对应层 `technical/` 登记）  \n- **约定**：`technical-meta.md` 在 `knowledge/technical/` 根目录。中间件绑定与关键组件见 per-entity `{ID}.md`；索引见 [KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md) §5。MW 含 `parent_tsd_id`、`bound_app_id`；CMP 含 `maven_coordinates`、`parent_mw_id` 或 `parent_app_id`。\n\n> 系统层五视角关注域见 [system/DESIGN.md](../system/DESIGN.md) §五架构视角；公司层五视角见 [company/DESIGN.md](../company/DESIGN.md) §公司层五视角聚焦范围；跨层实体首次定义见 §2.2.1。\n\n### 2.2.1 跨层实体首次定义层级\n\n实体在联邦三层中**首次定义**的层级如下；他处仅 ID 引用，不重复定义字段语义。\n\n| 视角 | 实体 | 首次定义层级 |\n| --- | --- | --- |\n| **业务** business | 业务域 BD | 公司 [company/](../company/DESIGN.md) |\n| | 业务能力 CAP | 公司 |\n| | 业务子域 BSD | 系统 [system/](../system/DESIGN.md) |\n| | 限界上下文 BC | 系统 |\n| | 聚合 AGG | 系统 |\n| | 能力 AB | 系统 |\n| **产品** product | 产品线 PL | 公司 |\n| | 产品模块 PM | 系统 |\n| | 产品功能 FT | 系统 |\n| | 用户场景 UC | 系统 |\n| | 业务流程 BP | 系统 |\n| | 业务规则 BR | 系统 |\n| **应用** application | 系统层 SYS | 公司 |\n| | 应用层 APP | 系统 |\n| | 模块层 MS | 系统 |\n| | 接口层 API | 应用（本层） |\n| **数据** data | 主数据域 MDG | 公司 |\n| | 数据层 DS | 系统 |\n| | 实体 ENT | 系统 |\n| | 数据表 TBL | 应用（本层） |\n| **技术** technical | 技术平台能力 TPL | 公司 |\n| | 技术域 TSD | 系统 |\n| | 中间件绑定 MW | 应用（本层） |\n| | 组件 CMP | 应用（本层） |\n\n### 2.3 阶段目录\n\n\n| 阶段               | 约定                                                                                                                                            |\n| ---------------- | --------------------------------------------------------------------------------------------------------------------------------------------- |\n| **solutions**    | `README.md`（阶段约定 SSOT）；根目录平铺 `SOLUTION-{IDEA-ID}.md`；`archive/` 归档；文末元数据可选 `parent`/`dependencies`（无 `solutions_meta.yaml`）                                                                          |\n| **analysis**     | `README.md`（阶段约定 SSOT）；根目录平铺 `ANALYSIS-{IDEA-ID}.md`；文末元数据 `parent` → Solution（单层交付物）                                                           |\n| **requirements** | `README.md`（阶段约定 SSOT）；`REQUIREMENT-{IDEA-ID}/MVP-Phase-*/` 下 PRD / ASD / DSD / TDD；**详设正文**仅为 **`DSD-*.md`**；**`spec-asd-*.md`** 仅在各阶段 `specs/`（无 `requirements_meta.yaml`） |\n| **changelogs**   | `README.md`（阶段约定 SSOT）；`CHANGE-LOG.md`（docs-change）；`INDEXING-LOG.md`（docs-indexing）；无 `changelogs_meta.yaml`                        |\n\n\n---\n\n## 3. 核心映射（分布式引用）\n\n在源实体 frontmatter 中写**目标实体 ID**。\n\n\n| 方向   | 源        | 目标       | 字段                                 | 含义            |\n| ---- | -------- | -------- | ---------------------------------- | ------------- |\n| 实现   | BC       | APP      | `implemented_by_app_id`            | 上下文由哪个APP实现   |\n| 实现   | AGG      | MS       | `implemented_by_service_ids`       | 聚合根被哪些 MS 实现  |\n| 实现   | AB       | API      | `apis`（`apis[].id`）              | 能力绑定的 API 列表（单 API 时仅一项）    |\n| 需求支撑 | PM       | BC       | `relies_on_context_ids`            | 模块依赖哪些上下文（组件） |\n| 接口   | FT       | API      | `invokes_api_ids`                  | 功能调用的 API     |\n| 接口   | UC       | API      | `map_to_api_id`                    | 用例映射的 API     |\n| 持久化  | AGG      | ENT      | `persisted_as_entity_ids`          | 模型落哪些表        |\n| 归属   | ENT / DS | MS / APP | `owned_by_service_id` / `app_id` 等 | 写入与归属         |\n\n\n---\n\n## 4. ADR 与 ID 前缀\n\n- **ADR**：应用层 `application/adr/ADR-{序号}-{标题}.md`；系统层 `system/adr/`；结构见 [agent/knowledge/adr-template.md](../agent/knowledge/adr-template.md)\n- **前缀（摘录）**：BD、BSD、BC、AGG、AB、CAP、PL、PM、FT、UC、SYS、APP、MS、API、MDG、DS、ENT、TPL、TSD、MW、CMP — 全文见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md)\n\n---",

      "body": "# application 索引指南（INDEX_GUIDE）\n\n> **最后更新**: 2026-06-21  \n> **文档定位**: 面向 AI Agent 的 **`application/` 文档根**九章机器索引；与仓库根 [INDEX_GUIDE.md](../INDEX_GUIDE.md) 互补。中央知识库挂载建联登记见 **§十**。\n\n---\n\n## 一、项目概览（Project Overview）\n\n### 1.1 速查表\n\n| 组件 | 路径 | 描述 |\n|------|------|------|\n| 应用入口（模式分流） | [README.md](README.md) | `standalone` / `central` 见 [README-s.md](README-s.md)、[README-c.md](README-c.md) |\n| 设计元模型 | [DESIGN.md](DESIGN.md) | 五视角、实体与演进约束 |\n| 贡献与阶段 | [CONTRIBUTING.md](CONTRIBUTING.md) | SDD 阶段、闸门与模板指针 |\n| 五视角实体索引 | [knowledge/KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md) | ID 表与证据链（示例级 SSOT） |\n| 宪法与术语 | [../agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md) | 治理、命名、ADR |\n| 阶段产物目录 | `solutions/`、`analysis/`、`requirements/` | 方案～需求包与元数据 |\n| 运维日志 | [changelogs/README.md](changelogs/README.md) | `CHANGE-LOG.md`、`INDEXING-LOG.md` |\n| 仓库根全索引 | [../INDEX_GUIDE.md](../INDEX_GUIDE.md) | 中央库根路径九章地图 |\n\n### 1.2 元信息\n\n- **目录角色**: 应用侧知识主库（稳定事实、阶段交付、实现登记与应用层实体）\n- **技术栈**: Markdown、YAML、JSON（知识提取产物）\n- **已跟踪文件规模**（仅 `application/` 前缀）: **67** 个文件（`git ls-files application/`，2026-06-21）\n- **精读深度**: 本轮 **depth=3**（以已读入口与目录枚举为准，非逐文件全文内嵌）\n\n---\n\n## 二、架构视图（Architecture View）\n\n### 2.1 模块结构\n\n```text\napplication/\n├── README.md / README-s.md / README-c.md   # 入口与模式说明\n├── INDEX_GUIDE.md                          # 本文件\n├── DESIGN.md / CONTRIBUTING.md             # 元模型与贡献\n├── docs_meta.md / manifest.md          # 文档元数据\n├── adr/                                    # 应用层 ADR 正文\n├── analysis/                               # 需求分析阶段\n├── changelogs/                             # CHANGE-LOG、INDEXING-LOG\n├── knowledge/                              # 五视角：business/data/product/application/technical\n├── requirements/                           # 需求包与 REQUIREMENT-EXAMPLE\n├── solutions/                              # 方案阶段与 archive/\n└── superpowers/specs/                      # 会话 spec（通常 gitignore；DOC_DIR=application 时）\n```\n\n> **规约路径说明**：SDD 规约 `spec-asd-*.md` 在各需求包 `MVP-Phase-*/specs/`；legacy docs-push 可选 `application/specs/`（中央库可不建）。\n\n### 2.2 依赖关系\n\n```mermaid\nflowchart TB\n  subgraph app[\"application/\"]\n    k[\"knowledge/\"]\n    sol[\"solutions/\"]\n    ana[\"analysis/\"]\n    req[\"requirements/\"]\n    cl[\"changelogs/\"]\n  end\n  root[\"仓库根 INDEX_GUIDE\"]\n  agent[\"agent/skills sdx-*\"]\n  root --> app\n  sol --> ana --> req\n  k --> DESIGN[\"DESIGN.md\"]\n  agent --> sol\n  agent --> cl\n```\n\n### 2.3 包结构\n\n非 JVM 工程；以**目录 + 元数据 Markdown**组织阶段与视角，不以 Java 包分层。\n\n### 2.4 文档目录\n\n- **本索引**: [INDEX_GUIDE.md](INDEX_GUIDE.md)\n- **知识实体**: [knowledge/README.md](knowledge/README.md)\n- **阶段模板**: 各 `*/README.md`、`requirements/REQUIREMENT-EXAMPLE/`\n\n---\n\n## 三、接口清单（Interface Catalog）\n\n| 小节 | 状态 | 说明 |\n|------|------|------|\n| 3.1～3.4 | [未索引] | 无运行时 RPC/HTTP/调度/消息；对外契约为文档与 Slash 工作流 |\n\n---\n\n## 四、领域模型（Domain Model）\n\n### 4.1 业务术语\n\n| 术语 | 定义 | 落点 |\n|------|------|------|\n| 五视角 | 业务 / 产品 / 应用 / 数据 / 技术 分层与 ID 规范 | [DESIGN.md](DESIGN.md)、[../agent/knowledge/glossary.md](../agent/knowledge/glossary.md) |\n| 知识实体 | YAML/JSON 承载的层级 ID 与关系字段 | [knowledge/](knowledge/) |\n| SDD 阶段 | Solution → Analysis → PRD/设计/测试 链 | [CONTRIBUTING.md](CONTRIBUTING.md)、`agent/skills/sdx-*` |\n\n### 4.2 聚合与目录映射\n\n| 聚合 | 职责 | 路径 |\n|------|------|------|\n| 治理与标准 | 术语、架构原则、命名、ADR 模板 | [../agent/knowledge/README.md](../agent/knowledge/README.md) |\n| 五视角知识 | 实体与证据链 | [knowledge/](knowledge/) |\n| 阶段包 | 方案、分析、需求树 | [solutions/](solutions/)、[analysis/](analysis/)、[requirements/](requirements/) |\n\n### 4.3 领域服务\n\n| 能力 | 说明 |\n|------|------|\n| Slash SDD | `/sdx-solution` 等写入受管终稿前须用户与 spec 闸门 |\n| docs-build | 五视角实体提取与 `KNOWLEDGE_INDEX` 联动（见根索引 §九） |\n\n### 4.4 领域事件\n\n维护性事件见 [changelogs/CHANGE-LOG.md](changelogs/CHANGE-LOG.md)、[changelogs/INDEXING-LOG.md](changelogs/INDEXING-LOG.md)。\n\n---\n\n## 五、业务逻辑（Business Logic）\n\n### 5.1 状态流转（SDD 摘要）\n\n与根索引一致：方案 → 分析 → PRD → 设计 → 测试；**HARD-GATE** 见各 `sdx-*` Skill。\n\n### 5.2 核心流程（本目录）\n\n1. 阅读 [README.md](README.md) 选择 `standalone` / `central` 入口文档。  \n2. 变更知识实体或阶段产物时遵守 [DESIGN.md](DESIGN.md) 与 [CONTRIBUTING.md](CONTRIBUTING.md)。  \n3. 维护本目录索引：执行 `/docs-indexing`（参数见根索引与 `agent/skills/docs-indexing`）。\n\n### 5.3 业务规则\n\n| 来源 | 要点 |\n|------|------|\n| [AGENTS.md](../AGENTS.md) | 禁止擅自改实体 ID、未确认不提交 |\n| [DESIGN.md](DESIGN.md) | 元模型、映射字段、禁止破坏引用链 |\n\n### 5.4 枚举\n\n| 名称 | 取值 |\n|------|------|\n| 知识视角子目录 | `business/`、`data/`、`product/`、`application/`、`technical/` |\n\n---\n\n## 六、数据映射（Data Mapping）\n\n### 6.1 数据源\n\n| 数据源 | 类型 | 用途 |\n|--------|------|------|\n| `knowledge/**/{ID}.md` | Markdown（OKF concept） | 各视角 per-entity 实体（SSOT） |\n\n### 6.2～6.4\n\n无 RDBMS；实体映射与关系见 [DESIGN.md](DESIGN.md)、[knowledge/KNOWLEDGE_INDEX.md](knowledge/KNOWLEDGE_INDEX.md)。SQL 类索引 **[未索引]**。\n\n---\n\n## 七、配置中心（Configuration Hub）\n\n### 7.1 配置项\n\n| 项 | 位置 | 说明 |\n|----|------|------|\n| 文档元数据 | [docs_meta.md](docs_meta.md)、[knowledge/knowledge-meta.md](knowledge/knowledge-meta.md) | 阶段与目录元信息 |\n| manifest | [manifest.md](manifest.md) | 应用清单字段（按项目约定） |\n\n### 7.2 环境差异\n\n中央库模式与独立安装差异见 [README-c.md](README-c.md)、[README-s.md](README-s.md) 及 [../scripts/README.md](../scripts/README.md)。\n\n### 7.3 敏感信息\n\n不在本目录提交真实密钥；仅描述键名与流程。\n\n---\n\n## 八、索引边界（Index Boundary）\n\n### 8.1 覆盖范围\n\n| 指标 | 值 |\n|------|-----|\n| `git ls-files application/` | 67 |\n| 本轮 mode / depth | `full` / `3` |\n\n### 8.2 排除与未读\n\n- 未纳入：`../system/`、`../company/` 正文（由各自 `INDEX_GUIDE` 覆盖）。  \n- 被 `.gitignore` 排除且未入库的路径 **[未索引]**。\n\n### 8.3 维护规则\n\n- 根 `INDEX_GUIDE` 与**本文件**的索引运行均可记入 [changelogs/INDEXING-LOG.md](changelogs/INDEXING-LOG.md)（`output_path` 区分）。  \n- 增量前提：主表第一行 `indexing_finished_ms` 有效，见 `agent/skills/docs-indexing/references/indexing-log-spec.md`。\n\n---\n\n## 九、扩展资源（Extended Resources）\n\n### 9.1 核心文档\n\n| 文档 | 路径 |\n|------|------|\n| 全局索引 | [../INDEX_GUIDE.md](../INDEX_GUIDE.md) |\n| 系统库入口 | [../system/README.md](../system/README.md) |\n| Skill 总表 | [../agent/skills/README.md](../agent/skills/README.md) |\n\n### 9.2 工具链\n\nBash 5+、Git；可选 `docs-change` / `docs-build` 与本目录 changelogs 联动。\n\n---\n\n## 十、中央知识库接入工程\n\n本节用于在本仓库（中央知识库）登记各目标工程的接入信息，便于追溯与映射。由 `scripts/docs-install.sh --mode=central`（**中央知识库挂载建联**）维护本表。\n\n| APP ID | 工程路径（Git 或绝对路径） | 文档目录 |\n|--------|---------------------------|----------|\n| APP-TEST | /private/tmp/test-central | /private/tmp/test-central/docs |\n\n---\n\n**索引元数据**: 本次运行 **mode=full**，**depth=3**，**since_ms=0**，输出 **application/INDEX_GUIDE.md**；运行记录见 [changelogs/INDEXING-LOG.md](changelogs/INDEXING-LOG.md)。",

      "body": "# application — 应用知识库（mode=c）\n\n`application/` 维护应用侧稳定事实、实现登记与治理线索，是全仓库的重要知识中枢。  \n本文件面向中央知识库挂载建联（`mode=c`）阅读与维护场景，聚焦「按什么顺序读、到哪里写」；九章机器索引与 **中央知识库挂载建联登记**见 [INDEX_GUIDE.md](INDEX_GUIDE.md)。\n\n## 推荐阅读路径\n\n1. [INDEX_GUIDE.md](INDEX_GUIDE.md)：九章索引（docs-indexing 产出）、文末 **「十、中央知识库接入工程」** 为中央知识库挂载建联之登记\n2. [DESIGN.md](DESIGN.md)：元模型与跨视角关系\n3. [CONTRIBUTING.md](CONTRIBUTING.md)：新增/修改流程与模板约束\n\n## 文档流（一页纸）\n\n```text\nagent/rules（治理基线：术语/原则/命名/ADR）\n      │\n      ├──→ knowledge（五视角实体登记、实现映射与应用层实体主库）\n      │          ↑\n      │          └── 蒸馏 / 回写（如 docs-distill）\n      │\n      └──→ changelogs（变更留痕与索引运维）\n```\n\n**推荐落地顺序**：先核对 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md) 治理约束，再查 / 补 **knowledge** 实体与 ID（读 [DESIGN.md](DESIGN.md)、[CONTRIBUTING.md](CONTRIBUTING.md)），最后在 **changelogs** 留痕并维护索引链路。\n\n## 中央知识库挂载建联维护主线\n\n| 主线 | 目录 | 主要内容 |\n|------|------|----------|\n| 治理基线 | [agent/knowledge/](../agent/knowledge/knowledge-governance.md) | 术语、原则、命名、ADR |\n| 知识基线 | [knowledge](knowledge) | 五视角实体登记、实现映射与应用层实体主库 |\n| 变更留痕 | [changelogs](changelogs/README.md) | 变更记录与索引运维文件 |\n\n## 子目录入口\n\n| 目录 | 入口说明 |\n|------|----------|\n| [knowledge/README.md](knowledge/README.md) | 五视角知识实体组织与映射规则 |\n| [changelogs/README.md](changelogs/README.md) | 变更记录与索引运维文件 |\n\n## 机器可读元数据\n\n- 根元数据：[docs_meta.md](docs_meta.md)\n- 子目录元数据：`knowledge/knowledge-meta.md`（阶段目录见各 `README.md`，含 [changelogs/README.md](changelogs/README.md)）\n\n> 约束细则以 `docs_meta.md` 与 `DESIGN.md` 为准，本文件不复写字段定义。",

      "body": "# application — 应用知识库（mode=s）\n\n`application/` 维护应用侧稳定事实、实现登记与阶段交付物，是全仓库的重要知识中枢。  \n本文件面向知识库安装 standalone（模式）（`mode=s`）阅读与维护场景，回答「在 `application/` 里按什么顺序读、到哪里写」；九章机器索引与 **中央知识库挂载建联登记**见 [INDEX_GUIDE.md](INDEX_GUIDE.md)。\n\n## 推荐阅读路径\n\n1. [INDEX_GUIDE.md](INDEX_GUIDE.md)：九章索引（docs-indexing 产出）、文末 **「十、中央知识库接入工程」** 为中央知识库挂载建联之登记\n2. [DESIGN.md](DESIGN.md)：元模型与跨视角关系\n3. [CONTRIBUTING.md](CONTRIBUTING.md)：新增/修改流程与模板约束\n\n## SDD 文档流（一页纸）\n\n```text\nknowledge（实体登记、实现映射与应用层实体主库）\n    ↑ 蒸馏 / 回写（如 docs-distill）\n    │\nsolutions ──→ analysis ──→ requirements\n    │              │              │\n    └──────────────┴──────────────┴──→ 规约：需求包内 specs/ 或 knowledge/application/（可选）\n```\n\n**推荐落地顺序**：先查 / 补 **knowledge** 实体与 ID（读 [DESIGN.md](DESIGN.md)、[CONTRIBUTING.md](CONTRIBUTING.md)）→ 写 **solutions** / **analysis** → 建 **requirements** 包；规约与 `ANALYSIS-*` 对齐 **IDEA-ID**。\n\n## 阶段流转（SDD）\n\n| 阶段 | 目录 | 主要产物 |\n|------|------|----------|\n| 知识基线 | [agent/knowledge/](../agent/knowledge/knowledge-governance.md)、[knowledge](knowledge) | 治理规则、五视角实体登记与应用层实体 |\n| 方案阶段 | [solutions](solutions) | `SOLUTION-{IDEA-ID}.md` |\n| 分析阶段 | [analysis](analysis) | `ANALYSIS-{IDEA-ID}.md` |\n| 交付阶段 | [requirements](requirements) | `REQUIREMENT-{IDEA-ID}/MVP-Phase-*`（PRD/ASD/DSD/TDD/`specs/`） |\n\n变更留痕与索引运维见 [changelogs/README.md](changelogs/README.md)。\n\n## 子目录入口\n\n| 目录 | 入口说明 |\n|------|----------|\n| [knowledge/README.md](knowledge/README.md) | 五视角知识实体组织与映射规则 |\n| [solutions/README.md](solutions/README.md) | 方案阶段编写规则 |\n| [analysis/README.md](analysis/README.md) | 分析阶段编写规则 |\n| [requirements/README.md](requirements/README.md) | 交付阶段结构与产物规则 |\n| [changelogs/README.md](changelogs/README.md) | 变更记录与索引运维文件 |\n\n## 机器可读元数据\n\n- 根元数据：[docs_meta.md](docs_meta.md)\n- 子目录元数据：`knowledge/knowledge-meta.md`（**solutions** / **analysis** / **requirements** / **changelogs** 见各目录 `README.md`）\n\n> 约束细则以 `docs_meta.md` 与 `DESIGN.md` 为准，本文件不复写字段定义。",

      "body": "# analysis — 需求分析文档\n\nSDD **需求分析**阶段目录：产出 `ANALYSIS-{IDEA-ID}.md`，作为 [../requirements](../requirements) 输入；上游 [../solutions](../solutions) 中 `SOLUTION-{IDEA-ID}.md`。\n\n## 交付物\n\n| 项 | 约定 |\n|----|------|\n| 文件 | 根目录平铺 `ANALYSIS-{IDEA-ID}.md` |\n| IDEA-ID | 与 `SOLUTION-{IDEA-ID}.md`、`REQUIREMENT-{IDEA-ID}/` **同链**（见 [../../agent/knowledge/naming-conventions.md](../../agent/knowledge/naming-conventions.md)） |\n| 文档元数据 | 文末 `## 文档元数据`：`id` 与文件名一致；`parent` → 对应 `SOLUTION-{IDEA-ID}`（**勿**在文首使用 `---` YAML frontmatter） |\n\n## 输入\n\n- [../solutions/](../solutions/) — `SOLUTION-{IDEA-ID}.md`\n- [../knowledge/](../knowledge/) — 五视角实体登记、实现映射与[治理基线](../../agent/knowledge/knowledge-governance.md)\n- 规约：各需求包内 `specs/`\n\n细化结论可与 **business、product** 等系统层实体 ID 追溯；实现方案宜与 **application、data** 的应用层登记与物理落地对齐。\n\n## 分析索引表\n\n| 文档文件名 | 标题 | 关联解决方案 | 简要说明 |\n|------------|------|--------------|----------|\n| ... | ... | ... | ... |\n\n## 规范\n\n- 工作流：[../../agent/skills/sdx-analysis/SKILL.md](../../agent/skills/sdx-analysis/SKILL.md)\n- 模板：[../../agent/skills/sdx-analysis/assets/analysis-template.md](../../agent/skills/sdx-analysis/assets/analysis-template.md)\n\n## 索引维护\n\n每新增或评审一份 `ANALYSIS-{IDEA-ID}.md`，须同步更新上表；重大结构变更时按需更新根 `INDEX_GUIDE.md`。",

      "body": "# changelogs — 变更留痕与索引运维\n\n`application/` 侧知识主库变更可追溯入口：仅约定 **Markdown** 日志产物，不重复阶段文档写作规范。阶段约定 SSOT 为本 README（无 `{dirname}_meta.yaml`）。\n\n## 目录文件\n\n| 文件 | 用途 |\n|------|------|\n| `README.md` | 本说明 |\n| [CHANGE-LOG.md](CHANGE-LOG.md) | `application/` 侧维护性变更与 **docs-change** 聚合；文末 `<!-- docs-change:baseline_time_ms=... -->` 为增量基线 |\n| [INDEXING-LOG.md](INDEXING-LOG.md) | **docs-indexing** 运行记录；主表**第一行** `indexing_finished_ms` 为增量锚点（[indexing-log-spec.md](../../agent/skills/docs-indexing/references/indexing-log-spec.md)） |\n\n## 关联索引\n\n- [../INDEX_GUIDE.md](../INDEX_GUIDE.md)\n- 仓库根 [INDEX_GUIDE.md](../../INDEX_GUIDE.md)（按需）\n\n## Skill 指针\n\n| Skill | 说明 |\n|-------|------|\n| [docs-change](../../agent/skills/docs-change/SKILL.md) | 聚合 git / CHANGELOG / 本地 mtime，**写入/更新** `CHANGE-LOG.md` |\n| [docs-indexing](../../agent/skills/docs-indexing/SKILL.md) | 生成 `INDEX_GUIDE.md`，在 `INDEXING-LOG.md` 主表**插入**一行（最新在上） |\n\n命令清单与执行入口见 [../../agent/skills/README.md](../../agent/skills/README.md)。\n\n## 索引维护\n\n目录结构或日志约定变更时，须更新本 README 与相关 `INDEX_GUIDE.md`（按需）。",

ments；规约落在需求包内 specs/ 或 knowledge/application/；knowledge 为事实源，归档可回写\"\n\nreferences:\n  - path: \"./README.md\"\n  - path: \"./INDEX_GUIDE.md\"\n  - path: \"./DESIGN.md\"\n  - path: \"./CONTRIBUTING.md\"\n  - path: \"../agent/knowledge/knowledge-governance.md\"\n```",

      "body": "# 知识库 · 五视角实体 ID 索引（SSOT）\n\n> 本文件仅保留示例，用于演示五视角索引结构与字段形状。\n\n---\n\n---\n\n## 统一表头规范\n\n- **标准表头**：`[\"层级\",\"ID\",\"别名（英文名）\",\"名称\",\"证据链\"]`\n- **字段语义**：`ID` 为示例编码，`别名（英文名）` 为英文编码，`名称` 为中文名称\n- **唯一性约束**：`层级+ID` 全知识库唯一；`层级+别名（英文名）` 全知识库唯一\n\n---\n\n## §1 业务视角（business · BD → BSD → BC → AGG → AB）\n\n| 层级 | ID | 别名（英文名） | 名称 | 证据链 |\n|------|----|--------------|------|---------|\n| BD | EXAMPLE |  | 示例业务域 | `business/BD-EXAMPLE.md` |\n| BSD | EXAMPLE |  | 示例业务子域 | `business/BSD-EXAMPLE/BSD-EXAMPLE.md` |\n| BC | EXAMPLE |  | 示例限界上下文 | `business/BSD-EXAMPLE/BC-EXAMPLE.md` |\n| AGG | EXAMPLE |  | 示例聚合 | `business/BSD-EXAMPLE/AGG-EXAMPLE.md` |\n| AB | EXAMPLE |  | 示例能力 | `business/BSD-EXAMPLE/AB-EXAMPLE.md` |\n\n---\n\n## §2 产品视角（product · PL → PM → FT → UC）\n\n| 层级 | ID | 别名（英文名） | 名称 | 证据链 |\n|------|----|--------------|------|---------|\n| PL | EXAMPLE |  | 示例产品线 | `product/PL-EXAMPLE.md` |\n| PM | EXAMPLE |  | 示例产品模块 | `product/PM-EXAMPLE/PM-EXAMPLE.md` |\n| FT | EXAMPLE |  | 示例功能 | `product/PM-EXAMPLE/FT-EXAMPLE.md` |\n| UC | EXAMPLE-001 |  | 示例用例 | `product/PM-EXAMPLE/UC-EXAMPLE-001.md` |\n\n---\n\n## §3 应用视角（application · SYS → APP → MS → API）\n\n| 层级 | ID | 别名（英文名） | 名称 | 证据链 |\n|------|----|--------------|------|---------|\n| SYS | EXAMPLE |  | 示例系统 | `application/SYS-EXAMPLE.md` |\n| APP | EXAMPLE |  | 示例应用 | `application/APP-EXAMPLE.md` |\n| MS | EXAMPLE |  | 示例微服务 | `application/MS-EXAMPLE/MS-EXAMPLE.md` |\n| API | EXAMPLE-001 | ExampleService.create | 示例 API：创建 | `application/MS-EXAMPLE/API-EXAMPLE-001.md` |\n\n---\n\n## §4 数据视角（data · DS → ENT）\n\n| 层级 | ID | 别名（英文名） | 名称 | 证据链 |\n|------|----|--------------|------|---------|\n| DS | EXAMPLE |  | 示例数据源 | `data/DS-EXAMPLE.md` |\n| ENT | EXAMPLE |  | 示例实体 | `data/ENT-EXAMPLE/ENT-EXAMPLE.md` |\n\n---\n\n## §5 技术视角（technical · MW → CMP）\n\n| 层级 | ID | 别名（英文名） | 名称 | 证据链 |\n|------|----|--------------|------|---------|\n| MW | EXAMPLE |  | 示例中间件绑定 | `technical/MW-EXAMPLE/MW-EXAMPLE.md` |\n| CMP | EXAMPLE |  | 示例组件 | `technical/MW-EXAMPLE/CMP-EXAMPLE.md` |\n\n---\n\n> 公司级 **TPL-***、系统级 **TSD-*** 不在本索引登记；见 `company/knowledge/technical/`、`system/knowledge/technical/`。\n\n---\n\n## 物化目录映射（示例）\n\n| 索引 ID | 命名式 ID（锚点目录） |\n|---------|----------------------|\n| BD-EXAMPLE | `business/BSD-EXAMPLE/BSD-EXAMPLE.md` |\n| PL-EXAMPLE | `product/PL-EXAMPLE.md` |\n| SYS-EXAMPLE | `application/SYS-EXAMPLE.md` |\n| DS-EXAMPLE | `data/DS-EXAMPLE.md` |\n\n---\n\n## 交叉引用\n\n- 应用：[application/index.md](application/index.md) · [KNOWLEDGE_INDEX.md](KNOWLEDGE_INDEX.md) §3\n- 业务：[business/index.md](business/index.md) · §1\n- 产品：[product/index.md](product/index.md) · §2\n- 数据：[data/index.md](data/index.md) · §4\n- 技术：[technical/index.md](technical/index.md) · §5\n- 知识库总说明：[README.md](README.md)",

      "body": "# knowledge — 应用侧知识主体\n\n**应用侧知识树**（联邦单元内 `knowledge/`）：承接 **业务 / 产品 / 应用 / 数据 / 技术** 五视角的实体登记、实现映射与应用层实体主定义；治理与命名 SSOT 见 [`../../agent/knowledge/knowledge-governance.md`](../../agent/knowledge/knowledge-governance.md)。与中央库 `application/knowledge/` 同构。中央库阶段文档（solutions、analysis）见 [`../solutions`](../solutions/README.md)、[`../analysis`](../analysis/README.md)；本应用 requirements 以本树及中央库为事实源；归档时可回写。\n\n---\n\n## 五视角实体 ID 与登记\n\n- **链上实体 ID 登记表**：[KNOWLEDGE_INDEX.md](KNOWLEDGE_INDEX.md) — business / product / application / data / technical 五视角（**不含** `DIR-*` 联邦/阶段）。`application/` 入口见 [../README.md](../README.md)；仓库根 Index Guide 见 [INDEX_GUIDE.md](../../INDEX_GUIDE.md) **§1.2**。\n- **视角实例索引**：各视角 per-entity `{ID}.md`（OKF concept SSOT）；ID 登记表 [KNOWLEDGE_INDEX.md](KNOWLEDGE_INDEX.md)（扫描生成）。\n- **机器契约**：[../../agent/skills/docs-build/SKILL.md](../../agent/skills/docs-build/SKILL.md)（ssot、symmetry、meta_read_order）；[knowledge-meta.md](knowledge-meta.md) 保留联邦/目录元数据。\n\n## 子目录\n\n| 路径 | 说明 | 视角元数据 |\n|------|------|----------|\n| [business](business) | BD → BSD → BC → AGG → AB（系统层首次定义链在本树承接实例登记与实现映射） | [business/business-meta.md](business/business-meta.md) |\n| [product](product) | PL → PM → FT → UC（系统层首次定义链在本树承接交互与验收映射） | [product/product-meta.md](product/product-meta.md) |\n| [application](application) | SYS → APP → MS → API（API 为应用层首次定义） | [application/application-meta.md](application/application-meta.md) |\n| [data](data) | DS → ENT → TBL（TBL 为应用层首次定义；ENT 在本树承接物理落地） | [data/data-meta.md](data/data-meta.md) |\n| [technical](technical) | MW → CMP | [technical/technical-meta.md](technical/technical-meta.md) |\n\n公司级 **TPL-***、系统级 **TSD-*** 分别在 `company/knowledge/technical/`、`system/knowledge/technical/` 登记；本树技术视角登记 **MW/CMP**。\n\n---\n\n## 维护（三步）\n\n1. 改前读 **机器契约**（见上）、本目录 [knowledge-meta.md](knowledge-meta.md)（目录元数据）与目标视角 `README.md`、相关 `{perspective}-meta.md`\n2. 只增删改 **ID** 与 Markdown 约定字段；跨视角不写重复叙述\n3. 更新 [KNOWLEDGE_INDEX.md](KNOWLEDGE_INDEX.md)（各视角实体 ID）或该视角 README 中的登记 / 示例（若影响导航）\n\n**索引指针**：各视角实体 ID [KNOWLEDGE_INDEX.md](KNOWLEDGE_INDEX.md)；仓库根 [INDEX_GUIDE.md](../../INDEX_GUIDE.md)；`application/` 九章索引与中央知识库挂载建联登记 [../INDEX_GUIDE.md](../INDEX_GUIDE.md)。\n\n---\n\n## 约定（最小集）\n\n- 文内路径优先可解析的相对路径（如自 `knowledge/` 起）\n- PL/PM/FT、SYS、DS/ENT、MW/CMP 等元数据 **集中在各视角根目录**，细则见各 `README.md` 与 DESIGN §2",

      "body": "# application — 应用视角\n\n本目录描述本应用的物理实现、部署架构与服务接口；系统层 `APP/MS` 在此承接实例登记与实现映射，应用层 `API` 在此主定义。应用注册与索引见 [application-meta.md](application-meta.md) 与 **[../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)**（§3）。\n\n- **实现入口**：HTTP（`@GatewayApi`）与 ZSS Job 见 [INDEX_GUIDE.md](../../../INDEX_GUIDE.md) **第三节 · 3.1**、**第三节 · 3.3**。\n- **统一元数据**：[application-meta.md](application-meta.md) — `layers`（sys / app / ms / api）。\n\n---\n\n## 应用索引表（示例）\n\n| 类型 | 名称 | ID (KNOWLEDGE_INDEX) | 路径 / 说明 |\n|------|------|----------------------|-------------|\n| 系统 | 示例系统边界 | SYS-EXAMPLE | [SYS-EXAMPLE.md](SYS-EXAMPLE.md) |\n| 应用 | 示例应用 | APP-EXAMPLE | [APP-EXAMPLE.md](APP-EXAMPLE.md) |\n| 微服务（MS） | 示例微服务 | MS-EXAMPLE | [MS-EXAMPLE/MS-EXAMPLE.md](MS-EXAMPLE/MS-EXAMPLE.md) |\n| 接口 | 示例 API | API-EXAMPLE-001 | [MS-EXAMPLE/API-EXAMPLE-001.md](MS-EXAMPLE/API-EXAMPLE-001.md) |\n\n本目录仅保留**示例**，用于演示 SYS/APP/MS/API 的层级与字段形状。完整 ID 清单以 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §3 为准。\n\n---\n\n## 层级结构\n\n```\n系统 (SYS) → 应用 (APP) → 微服务 (MS) → API   （per-entity `{ID}.md` 为 SSOT；扫描索引见 KNOWLEDGE_INDEX §3）\n```\n\n- **字段模板**：[application-meta.md](application-meta.md) → §4 必填字段\n- **层级内容**：per-entity `{ID}.md`；枚举见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §3\n\n---\n\n## 应用注册（最小字段）\n\n- `id`, `name`, `description`\n- `repo_url`\n- `docs_manifest_path`（如 `/application/manifest.md`）\n- `service_ids`（MS-*）\n- `owner_team`（可选）\n\n---\n\n## 与其他视角的映射\n\n- **应用 ← 业务**：`implemented_by_app_id` → APP。\n- **应用 ← 产品**：`invokes_api_ids` → API。\n\n仓库根 Index Guide：[INDEX_GUIDE.md](../../../INDEX_GUIDE.md)；设计：[../../DESIGN.md](../../DESIGN.md)。",

      "body": "# 应用视角元数据（application/knowledge/application）\n\n应用侧实现版图（SYS→APP→MS→API）实体登记与接口实现元数据。实例索引见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§3，扫描生成；per-entity `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-APPLICATION` |\n| 视角 | application |\n| 层级范围 | application |\n| 说明 | 实现版图；公司级 SYS 在 `company/knowledge/application/` 首次定义，系统层自 APP 起首次定义，本层重点登记 API 与应用实现映射（示例含 SYS/APP/MS/API）。 |\n| entities_shape | per-entity `{ID}.md`（OKF concept）；索引见 KNOWLEDGE_INDEX §3 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | SYS | 系统（公司层首次定义） |\n| 2 | APP | 应用（代码仓库/部署单元，系统层首次定义） |\n| 3 | MS | 对外入口宿主类聚类（系统层首次定义） |\n| 4 | API | 接口端点（HTTP/Dubbo/MQ/Job，应用层首次定义） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | sys | SYS | `SYS-{NAME}` | — |\n| 2 | app | APP | `APP-{NAME}` | SYS |\n| 3 | ms | MS | `MS-{NNN}` 或 `MS-{NAME}` | APP |\n| 4 | api | API | `API-{NNN}` 或 `API-{NAME}-{NNN}` | MS |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `SYS` / `APP` / `MS` / `API` |\n| full_id 或 id | 规范 ID（API 可用 `id` 字段） |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| SYS | `architecture`（apps / external_dependencies / ddd_layers） |\n| APP | `parent_sys_id`、`startup_class`、`maven_module`、`service_ids` |\n| MS | `host_class`、`host_module`、`protocol` |\n| API | `service_id`、`alias`、`method_signature`、`api_type`（DUBBO/HTTP/MQ/JOB） |\n\n---\n\n## 5. 跨层路径映射（MS/API 分层差异化）\n\napplication 层与 system 层 MS/API 落盘路径 **intentionally 不同**；跨层对照以本表为准，不强制文件搬迁。\n\n| 实体 | system 路径 | application 路径 | 说明 |\n|------|-------------|-------------------|------|\n| SYS-EXAMPLE | `system/knowledge/application/SYS-EXAMPLE.md` | `application/knowledge/application/SYS-EXAMPLE.md` | 均为视角根 reference |\n| APP-EXAMPLE | `system/knowledge/application/APP-EXAMPLE/APP-EXAMPLE.md` | `application/knowledge/application/APP-EXAMPLE.md` | system 有 APP 锚点目录 |\n| MS-EXAMPLE | `system/knowledge/application/APP-EXAMPLE/MS-EXAMPLE.md` | `application/knowledge/application/MS-EXAMPLE/MS-EXAMPLE.md` | system 嵌于 APP；application 独立 MS 目录 |\n| API-EXAMPLE-001 | （system 不登记） | `application/knowledge/application/MS-EXAMPLE/API-EXAMPLE-001.md` | API 仅 application SSOT |\n\n**链接约定**：同 bundle 用 `/knowledge/...`；跨 bundle `# SSOT` 用仓库根相对路径。\n\n---\n\n## 6. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| BC.implemented_by_app_id | APP.full_id | 业务上下文实现 |\n| AB.apis[].id | API.id | 能力 API |\n| FT.invokes_api_ids | API.id | 产品功能调用 |\n| DS.owned_by_app_id | APP.full_id | 数据源归属 |\n\n---\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | §3 应用视角实例索引（扫描生成） |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | 五视角索引 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、KNOWLEDGE_INDEX.md、manifest/OpenAPI（按需）。",

      "body": "# business — 业务视角\n\n本目录描述业务版图与领域规则（DDD），不依赖具体技术实现。本树承接业务实体登记与实现映射；元数据与实例索引见 [business-meta.md](business-meta.md)、[../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§1）。\n\n---\n\n## 层级结构\n\n```\n业务域 (BD) → 业务子域 (BSD) → 限界上下文 (BC) → 聚合 (AGG) → 能力 (AB)\n```\n\n| 层级    | 代码    | 物理形态 | 说明                  |\n| ----- | ----- | ---- | ------------------- |\n| 业务域   | `BD`  | Markdown 实体表 | 顶层业务边界              |\n| 业务子域  | `BSD` | Markdown 实体表 | BD 下 0-N 个子域        |\n| 限界上下文 | `BC`  | Markdown 实体表 | BSD 下 1-N 个上下文      |\n| 聚合    | `AGG` | Markdown 实体表 | BC 下多个聚合，每个含业务规则    |\n| 能力    | `AB`  | Markdown 实体表 | AGG 下多个能力（含 API 列表） |\n\n**关键设计决策**：各级实体以 per-entity `{ID}.md` 为 SSOT；全库扫描索引见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§1）。\n\n---\n\n## 目录树（示例）\n\n```\nbusiness/\n├── README.md              # 本文件（人类导航）\n├── business-meta.md       # 视角元数据（元模型、层级约定、跨视角映射）\n├── index.md               # OKF 浏览入口\n├── BD-EXAMPLE.md          # 示例业务域（per-entity SSOT）\n└── BSD-EXAMPLE/           # 示例子域树（BC/AGG/AB）\n```\n\n---\n\n## AI 检索指南\n\n| 检索需求            | 推荐入口 |\n| --------------- | ---- |\n| 快速枚举全部业务实体 ID   | [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §1（扫描生成） |\n| 了解某聚合的业务规则与能力   | 对应 `{ID}.md`（如 [BSD-EXAMPLE/AGG-EXAMPLE.md](BSD-EXAMPLE/AGG-EXAMPLE.md)） |\n| 了解上下文边界与通用语言    | 对应 `{ID}.md`（如 [BSD-EXAMPLE/BC-EXAMPLE.md](BSD-EXAMPLE/BC-EXAMPLE.md)） |\n| 跨视角映射（业务→技术/数据） | [business-meta.md](business-meta.md) → §5 跨视角引用 |\n| 全库五视角索引         | [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) |\n\n---\n\n## 业务索引表（示例）\n\n本目录仅保留**示例**，用于演示 BD→AB 的层级与字段形状。完整 ID 清单以 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §1 为准。\n\n| 链序  | 层级    | ID（示例）      | 名称（示例）  | 文件 |\n| --- | ----- | ----------- | ------- | --- |\n| L1  | 业务域   | BD-EXAMPLE  | 示例业务域   | [BD-EXAMPLE.md](BD-EXAMPLE.md) |\n| L2  | 业务子域  | BSD-EXAMPLE | 示例业务子域  | [BSD-EXAMPLE/BSD-EXAMPLE.md](BSD-EXAMPLE/BSD-EXAMPLE.md) |\n| L3  | 限界上下文 | BC-EXAMPLE  | 示例限界上下文 | [BSD-EXAMPLE/BC-EXAMPLE.md](BSD-EXAMPLE/BC-EXAMPLE.md) |\n| L4  | 聚合    | AGG-EXAMPLE | 示例聚合    | [BSD-EXAMPLE/AGG-EXAMPLE.md](BSD-EXAMPLE/AGG-EXAMPLE.md) |\n| L5  | 能力    | AB-EXAMPLE  | 示例能力    | [BSD-EXAMPLE/AB-EXAMPLE.md](BSD-EXAMPLE/AB-EXAMPLE.md) |\n\n---\n\n## 关键字段（用于映射）\n\n- **BC（限界上下文）**：`implemented_by_app_id`（→ application APP）\n- **AGG（聚合）**：`persisted_as_entity_ids`（→ data ENT）\n- **AB（能力）**：`apis`（含 API-ID，→ application API）\n\n（字段细则以 per-entity `{ID}.md` 为准；映射见 [business-meta.md](business-meta.md)。）\n\n---\n\n## 与其他视角的映射\n\n- **业务 → 技术**：BC/AGG/AB → APP/MS/API（见 business-meta.md §5）。\n- **业务 → 数据**：AGG → ENT，见 [../data/ENT-EXAMPLE/ENT-EXAMPLE.md](../data/ENT-EXAMPLE/ENT-EXAMPLE.md) 或 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §4。\n\n仓库根 Index Guide：[INDEX_GUIDE.md](../../../INDEX_GUIDE.md)。",

        "knowledge/business/business-meta"
      ]
    },

      "body": "# 业务视角元数据（application/knowledge/business）\n\n应用侧 DDD 业务版图（BD→BSD→BC→AGG→AB）实体登记与实现映射元数据。实例索引见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§1，扫描生成；per-entity `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | application |\n| 说明 | DDD 业务版图；公司级 BD/CAP 在 `company/knowledge/business/` 首次定义，系统层自 BSD 起首次定义，本层承接实现映射与实例登记。 |\n| entities_shape | per-entity `{ID}.md`（OKF concept）；索引见 KNOWLEDGE_INDEX §1 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | BD | 业务域（应用层可登记实例；公司层为 SSOT） |\n| 2 | BSD | 业务子域（系统层首次定义，应用层可引用/登记） |\n| 3 | BC | 限界上下文（系统层首次定义，应用层承接实现映射） |\n| 4 | AGG | 聚合根（系统层首次定义，应用层补充持久化/服务映射） |\n| 5 | AB | 领域能力（Ability，系统层首次定义，应用层补充 API 映射） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | bd | BD | `BD-{NAME}` | — |\n| 2 | bsd | BSD | `BSD-{NAME}` | BD |\n| 3 | bc | BC | `BC-{NAME}` | BSD |\n| 4 | agg | AGG | `AGG-{NAME}` | BC |\n| 5 | ab | AB | `AB-{NAME}` | AGG |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `BD` / `BSD` / `BC` / `AGG` / `AB` |\n| full_id | 规范 ID |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| BD | `strategic_classification`、`children`（子 BSD full_id 列表） |\n| BSD | `parent_id`、`bounded_contexts` |\n| BC | `parent_id`、`implemented_by_app_id`、`aggregates` |\n| AGG | `parent_id`、`root_entity`、`persisted_as_entity_ids`、`implemented_by_service_ids`、`abilities` |\n| AB | `parent_id`、`capability`、`apis`（含 `id`、`method`、`description`） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| BC.implemented_by_app_id | APP.full_id | 上下文实现应用 |\n| AGG.persisted_as_entity_ids | ENT.full_id | 聚合持久化实体 |\n| AGG.implemented_by_service_ids | MS.full_id | 聚合实现入口簇 |\n| AB.apis[].id | API.id | 能力实现 API |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | §1 业务视角实例索引（扫描生成） |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | 五视角索引 |\n| [../../INDEX_GUIDE.md](../../INDEX_GUIDE.md) | 联邦索引 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、KNOWLEDGE_INDEX.md、INDEX_GUIDE.md（按需）。",

      "body": "# data — 数据视角\n\n本目录描述数据存储结构、数据实体与治理属性，并通过 ID 与其他视角建立映射；系统层 `DS/ENT` 在此承接实例登记与物理落地，应用层 `TBL` 作为物理表锚点在本树主定义。元数据与实例索引见 [data-meta.md](data-meta.md)、[../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§4）。\n\n---\n\n## 数据线索引表（示例）\n\n| 链序 | 层级 | 类型 | 名称 | 锚点 |\n|:----:|------|------|------|------|\n| — | 索引 | 数据视角 | 数据视角 | [data-meta.md](data-meta.md) |\n| L1 | 数据存储 | DS | 示例数据源 | [DS-EXAMPLE.md](DS-EXAMPLE.md) |\n| L2 | 数据实体 | ENT | 示例实体 | [ENT-EXAMPLE/ENT-EXAMPLE.md](ENT-EXAMPLE/ENT-EXAMPLE.md) |\n\n---\n\n## 层级结构\n\n```\n数据存储 (DS) → 数据实体 (ENT)   （per-entity `{ID}.md` 为 SSOT；扫描索引见 KNOWLEDGE_INDEX §4）\n```\n\n- **字段模板**：[data-meta.md](data-meta.md) → §4 必填字段\n- **层级内容**：per-entity `{ID}.md`；枚举见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §4\n\n---\n\n## 关键字段（用于映射）\n\n- **DS**：`owned_by_app_id`（→ APP/MS）\n- **ENT**：`maps_to_aggregate_id`（→ AGG）\n\n---\n\n## 本视角导航\n\n- 数据存储与实体清单（唯一事实来源）：per-entity `{ID}.md` + [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §4\n\n---\n\n## 与其他视角的映射\n\n- **数据 ← 业务**：`persisted_as_entity_ids` ↔ ENT。\n- **数据 ← 技术**：`owned_by_app_id` → APP/MS。\n\n仓库根 Index Guide：[INDEX_GUIDE.md](../../../INDEX_GUIDE.md)；设计：[../../DESIGN.md](../../DESIGN.md)。",

    "knowledge/product/README": {
      "id": "knowledge/product/README",
      "type": "Documentation",
      "title": "product — 产品视角",
      "description": null,
      "tags": [],
      "body": "# product — 产品视角\n\n本目录描述产品功能、用户故事与需求规格，并通过 ID 与其他视角建立映射。本树承接产品实体登记与交互映射；元数据与实例索引见 [product-meta.md](product-meta.md)、[../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§2）。\n\n---\n\n## 产品线索引表（示例）\n\n| 链序 | 层级 | 类型 | 名称 | 锚点 |\n|:----:|------|------|------|------|\n| — | 索引 | 产品视角 | 产品视角 | [product-meta.md](product-meta.md) |\n| L1 | 产品线 | PL | 示例产品线 | [PL-EXAMPLE.md](PL-EXAMPLE.md) |\n| L2 | 产品模块 | PM | 示例产品模块 | [PM-EXAMPLE/PM-EXAMPLE.md](PM-EXAMPLE/PM-EXAMPLE.md) |\n| L3 | 功能 | FT | 示例功能 | [PM-EXAMPLE/FT-EXAMPLE.md](PM-EXAMPLE/FT-EXAMPLE.md) |\n| L4 | 用例 | UC | 示例用例 | [PM-EXAMPLE/UC-EXAMPLE-001.md](PM-EXAMPLE/UC-EXAMPLE-001.md) |\n\n本目录仅保留**示例**，用于演示 PL/PM/FT/UC 的层级与字段形状。完整 ID 清单以 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §2 为准。\n\n---\n\n## 文档与导航\n\n| 推荐入口 | 说明 |\n|---------|------|\n| per-entity `{ID}.md` + [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §2 | **产品层级（PL/PM/FT/UC）唯一事实来源** |\n| [product-meta.md](product-meta.md) | 元模型与跨视角映射 |\n\n---\n\n## 层级结构\n\n```\n产品线 (PL) → 产品模块 (PM) → 功能 (FT) → 用例 (UC)   （per-entity `{ID}.md` 为 SSOT；扫描索引见 KNOWLEDGE_INDEX §2）\n```\n\n- **层级与 ID 模式**：[product-meta.md](product-meta.md) → §3 层定义\n- **层级内容**：per-entity `{ID}.md`；枚举见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §2\n\n---\n\n## 关键字段（用于映射）\n\n- **PM**：`relies_on_context_ids`（→ business BC）\n- **FT**：`invokes_api_ids`（→ application API）、`realizes_use_case_ids`（→ UC）\n- **UC**：`map_to_api_id`（→ application API）\n\n---\n\n## 与其他视角的映射\n\n- **产品 → 业务**：`relies_on_context_ids` → BC。\n- **产品 → 技术**：`invokes_api_ids` / `map_to_api_id` → API（manifest）。\n\n仓库根 Index Guide：[INDEX_GUIDE.md](../../../INDEX_GUIDE.md)；设计：[../../DESIGN.md](../../DESIGN.md)。",
      "backlinks": [
        "knowledge/product/product-meta"
      ]
    },

      "body": "# 产品视角元数据（application/knowledge/product）\n\n应用侧产品版图（PL→PM→FT→UC）实体登记与交互映射元数据。实例索引见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§2，扫描生成；per-entity `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-PRODUCT` |\n| 视角 | product |\n| 层级范围 | application |\n| 说明 | 产品版图；公司级 PL 在 `company/knowledge/product/` 首次定义，系统层自 PM 起首次定义，本层承接 API / 验收映射与实例登记（示例含 PL/PM/FT/UC）。 |\n| entities_shape | per-entity `{ID}.md`（OKF concept）；索引见 KNOWLEDGE_INDEX §2 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | PL | 产品线（公司层首次定义） |\n| 2 | PM | 产品模块（系统层首次定义） |\n| 3 | FT | 功能点（系统层首次定义，应用层承接 API / 验收映射） |\n| 4 | UC | 用户用例（系统层首次定义，应用层承接 API 映射） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | pl | PL | `PL-{NAME}` | — |\n| 2 | pm | PM | `PM-{NAME}` | PL |\n| 3 | ft | FT | `FT-{NAME}` | PM |\n| 4 | uc | UC | `UC-{NAME}` 或 `UC-{NAME}-{NNN}` | FT |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `PL` / `PM` / `FT` / `UC` |\n| full_id | 规范 ID |\n| name | 中文名称 |\n| description | 实体描述（PM 可省略） |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| PL | `target_users` |\n| PM | `parent_id` |\n| FT | `parent_id`、`invokes_api_ids`、`acceptance_criteria`、`realizes_use_case_ids` |\n| UC | `map_to_api_id`（推荐） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| PM.cross_references.business | BC / AGG | 模块依赖业务上下文 |\n| FT.invokes_api_ids | API.id | 功能调用 API |\n| FT.realizes_use_case_ids | UC.full_id | 功能实现用例 |\n| UC.map_to_api_id | API.id | 用例映射 API |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | §2 产品视角实例索引（扫描生成） |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | 五视角索引 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、KNOWLEDGE_INDEX.md（按需）。",

      "body": "# technical — 技术视角\n\n本目录描述中间件绑定、关键运行时组件，并通过 ID 与其他视角建立映射。公司级 **TPL-***、系统级 **TSD-*** 在对应层目录首次定义；本层主定义并登记 **MW-*** 与 **CMP-***。元数据与实例索引见 [technical-meta.md](technical-meta.md)、[../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§5）。\n\n---\n\n## 技术线索引表（示例）\n\n| 链序 | 层级 | 类型 | 名称 | 锚点 |\n|:----:|------|------|------|------|\n| — | 索引 | 技术视角 | 技术视角 | [technical-meta.md](technical-meta.md) |\n| L1 | 中间件绑定 | MW | 示例中间件绑定 | [MW-EXAMPLE/MW-EXAMPLE.md](MW-EXAMPLE/MW-EXAMPLE.md) |\n| L2 | 组件 | CMP | 示例组件 | [MW-EXAMPLE/CMP-EXAMPLE.md](MW-EXAMPLE/CMP-EXAMPLE.md) |\n\n---\n\n## 层级结构\n\n```\n中间件绑定 (MW) → 组件 (CMP)   （per-entity `{ID}.md` 为 SSOT；扫描索引见 KNOWLEDGE_INDEX §5）\n```\n\n- **字段模板**：[technical-meta.md](technical-meta.md) → §4 必填字段\n- **层级内容**：per-entity `{ID}.md`；枚举见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) §5\n\n**边界**：MW 登记基础设施绑定（数据源、缓存、MQ Topic/集群等）；MS/API 仍登记业务入口宿主类，不迁入本视角。\n\n---\n\n## 关键字段（用于映射）\n\n- **MW**：`parent_tsd_id`（→ TSD）、`bound_app_id`（→ APP）、`related_ds_id`（→ DS，可选）\n- **CMP**：`parent_mw_id`（→ MW）或 `parent_app_id`（→ APP）、`maven_coordinates`\n\n---\n\n## 与其他视角的映射\n\n- **技术 ← 应用**：`bound_app_id` → APP；`implements_tpl_ids`（APP 字段）→ TPL。\n- **技术 ← 数据**：`related_ds_id` → DS（数据源类绑定）。\n\n仓库根 Index Guide：[INDEX_GUIDE.md](../../../INDEX_GUIDE.md)；设计：[../../DESIGN.md](../../DESIGN.md)；命名：[../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md)。",

      "body": "# 技术视角元数据（application/knowledge/technical）\n\n应用层技术版图（MW→CMP）视角元数据 SSOT。实例索引见 [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md)（§5，扫描生成；per-entity `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-TECHNICAL` |\n| 视角 | technical |\n| 层级范围 | application |\n| 说明 | 中间件绑定与关键组件；公司级 TPL、系统级 TSD 在对应层首次定义，本层登记 MW/CMP。 |\n| entities_shape | per-entity `{ID}.md`（OKF concept）；索引见 KNOWLEDGE_INDEX §5 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | MW | 中间件绑定实例 |\n| 2 | CMP | 关键 Maven 依赖 / 运行时组件 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | mw | MW | `MW-{NAME}` | TSD（逻辑归属，`parent_tsd_id`） |\n| 2 | cmp | CMP | `CMP-{NAME}` | MW |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `MW` / `CMP` |\n| full_id | 规范 ID |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| MW | `binding_type`、`config_key`、`parent_tsd_id`、`bound_app_id` |\n| CMP | `maven_coordinates`、`parent_mw_id` 或 `parent_app_id`（二选一） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| MW.parent_tsd_id | TSD.full_id | 归属系统技术域 |\n| MW.bound_app_id | APP.full_id | 绑定应用 |\n| MW.related_ds_id | DS.full_id | 关联数据源（可选） |\n| CMP.parent_mw_id | MW.full_id | 组件挂载中间件 |\n| APP.implements_tpl_ids | TPL.full_id | 应用实现平台能力 |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../KNOWLEDGE_INDEX.md](../KNOWLEDGE_INDEX.md) | MW/CMP 实例索引 |\n| [../../../company/knowledge/technical/technical-meta.md](../../../company/knowledge/technical/technical-meta.md) | 公司级 TPL 元数据 |\n| [../../../company/knowledge/KNOWLEDGE_INDEX.md](../../../company/knowledge/KNOWLEDGE_INDEX.md) | 公司级 TPL 实例 |\n| [../../../system/knowledge/technical/technical-meta.md](../../../system/knowledge/technical/technical-meta.md) | 系统级 TSD 元数据 |\n| [../../../system/knowledge/KNOWLEDGE_INDEX.md](../../../system/knowledge/KNOWLEDGE_INDEX.md) | 系统级 TSD 实例 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、KNOWLEDGE_INDEX.md（按需）。",

    "requirements/README": {
      "id": "requirements/README",
      "type": "Documentation",
      "title": "requirements — 需求交付",
      "description": null,
      "tags": [],
      "body": "# requirements — 需求交付\n\n将 **analysis** 中的高层次需求按 MVP / 阶段落为可执行交付版本（PRD / **ASD** / **DSD** / TDD 等）。阶段约定 SSOT 为本 README（无 `{dirname}_meta.yaml`）；各 `REQUIREMENT-{IDEA-ID}/` 内不复制根级 meta。\n\n## 层级与交付物\n\n| 层级 | 路径 / 文件 | 约定 |\n|------|---------------|------|\n| 交付包 | `REQUIREMENT-{IDEA-ID}/` | 与 `ANALYSIS-{IDEA-ID}.md` **同 IDEA-ID**（见 [../../agent/knowledge/naming-conventions.md](../../agent/knowledge/naming-conventions.md)） |\n| MVP 阶段 | `MVP-Phase-{N}/` | 阶段目录，其下平铺阶段产物 |\n| 阶段产物 | `PRD-{IDEA-ID}.md`、`ASD-{IDEA-ID}-{N}.md`、`DSD-{IDEA-ID}-{N}.md`、`TDD-{IDEA-ID}.md` 等 | 文末 `## 文档元数据`（ fenced `yaml`）；**勿**在文首使用 `---` YAML frontmatter |\n| 规约 | `MVP-Phase-{N}/specs/` | `spec-asd-*.md` 等（见 `sdx-architect`） |\n\n## 阶段文档元数据\n\n| 文件 | 关键字段 |\n|------|----------|\n| `PRD-{IDEA-ID}.md` | `id`、`parent`、`mvp_phase`；`parent` 与 `REQUIREMENT-{IDEA-ID}` 或 `ANALYSIS-{IDEA-ID}` 可追溯一致 |\n| `ASD-{IDEA-ID}-{N}.md` | `id`、`parent`；`parent` → 对应 PRD |\n| `DSD-{IDEA-ID}-{N}.md` | `id`、`parent`、`architecture_ref`（ASD）；`parent` → 对应 PRD |\n| `TDD-{IDEA-ID}.md` | `id`、`parent`；`parent` → 对应 PRD |\n\n## 输入\n\n- [../analysis/](../analysis/) — `ANALYSIS-{IDEA-ID}.md`（可选）\n- [../solutions/](../solutions/) — `SOLUTION-{IDEA-ID}.md`（可选）\n- [../knowledge/](../knowledge/) — 五视角实体登记、实现映射与应用层实体主定义\n- 各需求包内 `specs/` 与 SDX 模板\n\n## 主线（四步）\n\n1. **输入**：`analysis/ANALYSIS-{IDEA-ID}.md`、`solutions/SOLUTION-{IDEA-ID}.md`、模板\n2. **建包**：新建 **`REQUIREMENT-{IDEA-ID}/`**（与 `ANALYSIS-*`、`PRD-*` 同属 `*-{IDEA-ID}`，仅类型前缀不同）\n3. **分阶段**：`MVP-Phase-1/`、`MVP-Phase-2/` …\n4. **落盘**：每阶段 PRD / ASD / DSD / TDD，并与上游 **IDEA-ID** 对齐\n\n## 目录结构\n\n```text\nrequirements/\n├── REQUIREMENT-{IDEA-ID}/\n│   ├── MVP-Phase-1/\n│   │   ├── PRD-{IDEA-ID}.md\n│   │   ├── ASD-{IDEA-ID}-{N}.md\n│   │   ├── DSD-{IDEA-ID}-{N}.md\n│   │   ├── TDD-{IDEA-ID}.md\n│   │   └── specs/\n│   └── MVP-Phase-2/\n│       └── ...\n└── README.md\n```\n\n## 交付包索引表\n\n| REQUIREMENT 目录 | 标题 | 关联 ANALYSIS | 状态 | 更新时间 |\n|------------------|------|---------------|------|----------|\n| ... | ... | ... | ... | ... |\n\n## 模板与命令\n\n- 模板：PRD → [../../agent/skills/sdx-prd/assets/prd-template.md](../../agent/skills/sdx-prd/assets/prd-template.md)；ASD → [../../agent/skills/sdx-architect/assets/asd-template.md](../../agent/skills/sdx-architect/assets/asd-template.md)；DSD → [../../agent/skills/sdx-design/assets/dsd-template.md](../../agent/skills/sdx-design/assets/dsd-template.md)；TDD → [../../agent/skills/sdx-test/assets/tdd-template.md](../../agent/skills/sdx-test/assets/tdd-template.md)\n- Skills：`sdx-prd`、`sdx-architect`、`sdx-design`、`sdx-test`（见 [../../agent/README.md](../../agent/README.md)）\n\n## 示例\n\n结构说明见 [REQUIREMENT-EXAMPLE/README.md](REQUIREMENT-EXAMPLE/README.md)。\n\n## 索引维护\n\n变更交付包或 MVP 阶段时，须同步更新上表；重大结构变更时按需更新根 `INDEX_GUIDE.md`。",

      "body": "# REQUIREMENT-EXAMPLE — 需求包结构示例（占位）\n\n本目录为 **命名与结构示例**，演示 `REQUIREMENT-{IDEA-ID}/` 下 MVP 阶段与 PRD/ASD/DSD/TDD 等落盘方式；非生产需求内容。\n\n实际需求包请按 [../README.md](../README.md) 复制本结构，并将 **IDEA-ID** 与上游 `ANALYSIS-{IDEA-ID}.md` 对齐。",

      "body": "# solutions — 解决方案文档\n\nSDD **解决方案**阶段目录：产出 `SOLUTION-{IDEA-ID}.md`，作为 [../analysis](../analysis) 输入。\n\n## 交付物\n\n| 项 | 约定 |\n|----|------|\n| 文件 | 根目录平铺 `SOLUTION-{IDEA-ID}.md`（本目录无 `{dirname}_meta.yaml`） |\n| 归档 | 已完结或 superseded 方案移入 [archive/](archive/) |\n| IDEA-ID | 需求链统一标识（见 [../../agent/knowledge/naming-conventions.md](../../agent/knowledge/naming-conventions.md)） |\n| 文档元数据 | 文末 `## 文档元数据`：`id` 与文件名一致；可选 `parent`、`dependencies`、`tags`（**勿**在文首使用 `---` YAML frontmatter） |\n\n## 输入\n\n- 外部 — 业务诉求（邮件、会议纪要、工单等）\n- [../knowledge/](../knowledge/) — 五视角实体登记、实现映射与[治理基线](../../agent/knowledge/knowledge-governance.md)\n- 规约：各需求包内 `specs/`\n\n影响面评估可与 **business、product、application、data** 实体 ID 建立引用；系统层首次定义实体用于边界与能力表达，应用层实体用于实现与落地表达，不重复定义实体。\n\n## 方案索引表\n\n| 解决方案编号 | 标题 | 关联 analysis | 状态 | 更新时间 |\n|--------------|------|---------------|------|----------|\n| ... | ... | ... | ... | ... |\n\n## 规范\n\n- 工作流：[../../agent/skills/sdx-solution/SKILL.md](../../agent/skills/sdx-solution/SKILL.md)\n- 模板：[../../agent/skills/sdx-solution/assets/solution-template.md](../../agent/skills/sdx-solution/assets/solution-template.md)\n\n## 索引维护\n\n每新增或评审一份 `SOLUTION-{IDEA-ID}.md`，须同步更新上表；重大结构变更时按需更新根 `INDEX_GUIDE.md`。",

<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
