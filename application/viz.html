      "body": "# 贡献指南 — application/\n\n本文件只定义最小贡献规则；目录结构、字段与模板一律引用权威入口，避免重复维护。\n\n---\n\n## 先读这些入口\n\n1. [INDEX-GUIDE.md](INDEX-GUIDE.md)：九章索引指南（含中央知识库挂载建联登记）；目录索引页见 [index.md](index.md)，与仓库根 [INDEX-GUIDE.md](../INDEX-GUIDE.md) 分工见各文件说明\n2. [DESIGN.md](DESIGN.md)：元模型、字段语义与跨视角映射\n3. [AGENTS.md](../AGENTS.md)：仓库级约束与禁止项\n4. 目标目录 `README.md` + 对应 `{perspective}-meta.md`：落盘与命名的最终约束\n\n---\n\n## 必须遵守\n\n1. **引用优先**：能链接到权威文档就不在本文件重复定义。\n2. **ID 稳定**：禁止未评估影响面即修改已有实体 ID；若调整，必须同步全链路引用。\n3. **仅写 ID**：跨文件、跨视角关联只写 ID 字符串，不复制目标定义正文。\n4. **变更可检索**：新增/调整文档后，更新目标目录 `README.md` 索引表；必要时同步 [INDEX-GUIDE.md](INDEX-GUIDE.md)、[index.md](index.md) 或根目录 [INDEX-GUIDE.md](../INDEX-GUIDE.md)。\n5. **提交规范**：使用 Conventional Commits；跨目录/规则变更建议补 ADR。\n\n---\n\n## 最小执行清单\n\n- 定范围：本次改动影响哪些目录、哪些 ID、哪些映射字段  \n- 读权威：先读目标目录 `README.md` 与 `{perspective}-meta.md`  \n- 落盘：按既有命名与 frontmatter 约束写入  \n- 回链：补索引与必要交叉引用  \n- 自检：全局搜索受影响 ID/字段，确认无断链\n\n---\n\n模板、阶段细则、技能入口见 [README.md](README.md)、[INDEX-GUIDE.md](INDEX-GUIDE.md)、[index.md](index.md) 与根目录 [INDEX-GUIDE.md](../INDEX-GUIDE.md)。",

      "body": "本文件是《应用知识文档库设计方案》的**精简版**：治理依据与演进参考。细节与入口仍以 [README.md](README.md)、[INDEX-GUIDE.md](INDEX-GUIDE.md)、[index.md](index.md) 及仓库根 [INDEX-GUIDE.md](../INDEX-GUIDE.md) 为准。\n\n---\n\n## 阅读顺序\n\n1. [README.md](README.md) — 应用知识库定位与 SDD 主线\n2. 本文 — 原则、元模型、映射、演进\n3. [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md) — ID 规则\n4. 各视角 [knowledge/README.md](knowledge/README.md) — 落盘与字段\n\n---\n\n## 1. 原则与约定\n\n|原则|说明|\n|---|---|\n|**SSOT**|实体只在一处定义；他处仅 **ID 引用**|\n|**联邦治理**|系统库管边界与索引；应用库管实现细节并 **上行对齐**|\n|**闭环**|knowledge ← 归档回写；阶段上 solutions → analysis → requirements；规约落在需求包内 specs/ 或 knowledge/application/|\n|**五视角**|业务 / 产品 / 应用 / 数据 / 技术；关联写在各视角 meta 与 **实体文件 `{ID}.md`**（OKF 概念实体），**不**维护独立映射矩阵文件；legacy `*-entities.md` 已废弃|\n|**与系统/公司层视角**|五视角在各层同构；公司/系统/应用按 [naming-conventions.md](../agent/knowledge/naming-conventions.md) 与 §2.2.1 分层首次定义实体|\n\n**目录索引（约定）**：\n\n- ***应用知识库根目录**：使用 [docs-meta.md](docs-meta.md) 概括 `application/` 树与子目录 meta 指针\n  - `knowledge/knowledge-meta.md` 描述知识树；\n  - 治理与命名 SSOT 见 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md)；\n- **`solutions/`、`analysis/`、`requirements/`、`changelogs/`** 阶段约定均收敛于各目录 **`README.md`**。`knowledge/` 五视角采用 `{perspective}-meta.md` + **实体文件 `{ID}.md`**（OKF SSOT）；`index.md` 由扫描生成。\n\n**协同（目标态）**：应用仓维护 `/docs` 与 `manifest.md`；系统侧可抓取 manifest 更新 `knowledge` 并做一致性检查。\n\n### OKF 实体文件（per-entity）SSOT\n\n`application/` 已对齐 [Open Knowledge Format v0.1](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)：**每个知识实体**为一概念实体文件（`{ID}.md` + YAML frontmatter + bundle-relative 跨链）；各级 `index.md` 供 RAG 渐进下钻；`index.md` 由工具扫描生成而非手写聚合表。路径与 type 见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md) §OKF；工具链见 `/docs-okf`。\n\n---\n\n## 2. `application/` 目录与元模型\n\n> 规范与 Agent 配置在仓库根目录 `agent/` 等，**不在** `application/` 内。\n\n### 2.1 `application/` 内目录\n\n|目录|说明|\n|---|---|\n|**knowledge/**|业务 / 产品 / 应用 / 数据 / 技术 五视角|\n|**solutions/**|`SOLUTION-{IDEA-ID}.md`|\n|**analysis/**|`ANALYSIS-{IDEA-ID}.md`|\n|**requirements/**|`REQUIREMENT-{IDEA-ID}/` 按阶段交付（规约可在各包内 `specs/`）|\n|**changelogs/**|变更记录与索引运维（可选）|\n|**adr/**|应用层 ADR 正文（`ADR-{序号}-{标题}.md`）|\n\n### 2.2 应用知识库\n\n治理与命名 SSOT 见仓库根 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md)（术语、原则、命名、ADR 已自 `constitution/` 迁入 `agent/knowledge/`）。\n\n#### 业务 (business)\n\n> 该视角回答：做什么业务、边界在哪、流程与能力如何组织。\n\n- **层级**：BD → BSD → BC → AGG → AB\n- **约定**：`business-meta.md` 在 `knowledge/business/` 根目录；`BD-{NAME}.md` 保留在 business 根目录；目录从 `BSD-{NAME}/` 开始，`BC/AGG` 采用容器目录，`AB` 为 `AGG` 下叶子文件。\n\n#### 产品 (product)\n\n> 该视角回答：用户是谁、功能如何组织、旅程与场景。\n\n- **层级**：PL → PM → FT → FR → UC/BR\n- **约定**：`product-meta.md` 在根目录；`PL-{NAME}.md` 保留在 product 根目录；目录从 `PM-{NAME}/` 开始，`FT/FR` 采用容器目录，`UC/BR` 为 `FR` 下单文件（文件内编号）。可选维护 `BP-{NAME}.md` 作为流程叙事文件，与 `PL-{NAME}.md` 同目录且不进入 hierarchy。\n\n#### 应用 (application)\n\n> 该视角回答：系统如何拆分、服务如何协作、领域与集成边界。\n\n- **层级**：SYS → APP → MS → API\n- **约定**：`application-meta.md` 在根目录；`SYS-{NAME}.md` 与 `APP-{NAME}.md` 保留为根文件；目录从 `MS-{NAME}/` 开始，`API` 为 `MS` 目录下叶子文件；索引见 [index.md](knowledge/index.md) §3。\n\n#### 数据 (data)\n\n> 该视角回答：数据如何建模、存储、流转与治理。\n\n- **层级**：MDG → DS → ENT\n- **约定**：`data-meta.md` 在根目录；`MDG-{NAME}.md` 作为 reference 根文件；目录从 `DS-{NAME}/` 开始；实例为实体文件 `{ID}.md`；索引见 [index.md](knowledge/index.md) §4。ENT 含 `maps_to_aggregate_id` 等；应用物理锚点（如 `TBL-*`）可保留在 `DS` 目录内。\n\n#### 技术 (technical)\n\n> 该视角回答：如何运行、扩展、观测与交付。\n\n- **层级**：TSD → MW → CMP（公司 **TPL**、系统 **TSD** 在对应层首次定义；本层补齐 TSD reference）\n- **约定**：`technical-meta.md` 在 `knowledge/technical/` 根目录；`TSD-{NAME}.md` 作为 reference 根文件；目录从 `MW-{NAME}/` 开始。MW 含 `parent_tsd_id`、`bound_app_id`；CMP 含 `maven_coordinates`、`parent_mw_id` 或 `parent_app_id`。\n\n> 系统层五视角关注域见 [system/DESIGN.md](../system/DESIGN.md#五视角系统层聚焦)；公司层五视角见 [company/DESIGN.md](../company/DESIGN.md#五视角聚焦)；跨层实体首次定义见 §2.2.1。\n\n### 2.2.1 跨层实体首次定义层级\n\n实体在联邦三层中**首次定义**的层级如下；他处仅 ID 引用，不重复定义字段语义。\n\n|视角|实体|首次定义层级|\n|---|---|---|\n|**业务** business|业务域 BD|公司 [company/](../company/DESIGN.md)|\n|**业务** business|业务能力 CAP|公司|\n|**业务** business|业务子域 BSD|系统 [system/](../system/DESIGN.md)|\n|**业务** business|限界上下文 BC|系统|\n|**业务** business|聚合 AGG|系统|\n|**业务** business|能力 AB|系统|\n|**产品** product|产品线 PL|公司|\n|**产品** product|产品模块 PM|系统|\n|**产品** product|产品功能 FT|系统|\n|**产品** product|功能需求 FR|系统|\n|**产品** product|用户场景 UC|系统|\n|**产品** product|业务流程 BP|系统|\n|**产品** product|业务规则 BR|系统|\n|**应用** application|系统层 SYS|公司|\n|**应用** application|应用层 APP|系统|\n|**应用** application|模块层 MS|系统|\n|**应用** application|接口层 API|应用（本层）|\n|**数据** data|主数据域 MDG|公司|\n|**数据** data|数据层 DS|系统|\n|**数据** data|实体 ENT|系统|\n|**数据** data|数据表 TBL|应用（本层）|\n|**技术** technical|技术平台能力 TPL|公司|\n|**技术** technical|技术域 TSD|系统|\n|**技术** technical|中间件绑定 MW|应用（本层）|\n|**技术** technical|组件 CMP|应用（本层）|\n\n### 2.3 阶段目录\n\n|阶段|约定|\n|---|---|\n|**solutions**|`README.md`（阶段约定 SSOT）；根目录平铺 `SOLUTION-{IDEA-ID}.md`；`archive/` 归档；文首 frontmatter 含 `id` 与可选 `parent`/`dependencies`（无 `solutions_meta.yaml`）|\n|**analysis**|`README.md`（阶段约定 SSOT）；根目录平铺 `ANALYSIS-{IDEA-ID}.md`；文首 frontmatter 含 `parent` → Solution（单层交付物）|\n|**requirements**|`README.md`（阶段约定 SSOT）；`REQUIREMENT-{IDEA-ID}/MVP-Phase-*/` 下 PRD / ASD / DSD / TDD；**详设正文**仅为 **`DSD-*.md`**；**`spec-asd-*.md`** 仅在各阶段 `specs/`（无 `requirements_meta.yaml`）|\n|**changelogs**|`README.md`（阶段约定 SSOT）；`CHANGE-LOG.md`（docs-change）；`INDEXING-LOG.md`（docs-indexing）；无 `changelogs_meta.yaml`|\n\n## 3. 核心映射（分布式引用）\n\n在源实体 frontmatter 中写**目标实体 ID**。\n\n|方向|源|目标|字段|含义|\n|---|---|---|---|---|\n|实现|BC|APP|`implemented_by_app_id`|上下文由哪个 APP 实现|\n|实现|AGG|MS|`implemented_by_service_ids`|聚合根被哪些 MS 实现|\n|实现|AB|API|`apis`（`apis[].id`）|能力绑定的 API 列表（单 API 时仅一项）|\n|需求支撑|PM|BC|`relies_on_context_ids`|模块依赖哪些上下文（组件）|\n|接口|FT|API|`invokes_api_ids`|功能调用的 API|\n|接口|UC|API|`map_to_api_id`|用例映射的 API|\n|持久化|AGG|ENT|`persisted_as_entity_ids`|模型落哪些表|\n|归属|ENT / DS|MS / APP|`owned_by_service_id` / `app_id` 等|写入与归属|\n\n---\n\n## 4. ADR 与 ID 前缀\n\n- **ADR**：应用层 `application/adr/ADR-{序号}-{标题}.md`；系统层 `system/adr/`；结构见 [agent/knowledge/adr-template.md](../agent/knowledge/adr-template.md)\n- **前缀（摘录）**：BD、BSD、BC、AGG、AB、CAP、PL、PM、FT、UC、SYS、APP、MS、API、MDG、DS、ENT、TPL、TSD、MW、CMP — 全文见 [agent/knowledge/naming-conventions.md](../agent/knowledge/naming-conventions.md)\n\n---",

      "body": "# application INDEX-GUIDE\n\n> **最后更新**: 2026-07-18  \n> **定位**: `application/` 九章索引指南。目录索引见 [index.md](index.md)。\n\n---\n\n## 一、项目概览\n\n### 1.1 速查\n\n* [README.md](README.md) — 人类入口（standalone → [README-s.md](README-s.md)；central → [README-c.md](README-c.md)）  \n* [index.md](index.md) — OKF 目录索引  \n* [DESIGN.md](DESIGN.md) — 设计契约与 §2.2.1  \n* [knowledge/README.md](knowledge/README.md) — 五视角  \n* [CONTRIBUTING.md](CONTRIBUTING.md) — 贡献约定  \n* [changelogs/README.md](changelogs/README.md) — 变更/索引  \n\n### 1.2 元信息\n\n* **角色**: 应用知识库；实现级实体（API/TBL/MW/CMP）SSOT + 五视角映射  \n* **栈**: Markdown、YAML  \n* **范围**: `knowledge/` · `solutions/` · `analysis/` · `requirements/` · `adr/` · `changelogs/`  \n\n---\n\n## 二、架构视图\n\n```text\napplication/\n├── README.md / INDEX-GUIDE.md / index.md / DESIGN.md / docs-meta.md\n├── knowledge/ · solutions/ · analysis/ · requirements/ · adr/\n└── changelogs/\n```\n\n入口：[knowledge/](knowledge/README.md) · [solutions/](solutions/README.md) · [analysis/](analysis/README.md) · [requirements/](requirements/README.md) · [adr/](adr/README.md)\n\n---\n\n## 三、接口清单\n\n无运行时 API。契约 = 目录 + Markdown + 实体 `{ID}.md`。\n\n---\n\n## 四、模块依赖\n\n* `knowledge/` ↔ `system/knowledge/`：系统 SSOT / 本层实现映射  \n* `knowledge/` ↔ `company/knowledge/`：公司实体 reference  \n* `solutions/` → `analysis/` → `requirements/`  \n\n---\n\n## 五、详细索引\n\n样本实体：[knowledge/index.md](knowledge/index.md)\n\n应用层首次：`API` · `TBL` · `MW` · `CMP`（见 [DESIGN.md](DESIGN.md) §2.2.1）\n\n---\n\n## 六、API / 字典边界\n\nAPI/TBL 实体在 `knowledge/`；不承载运行时 OpenAPI/DDL 全文（可链外部）。\n\n---\n\n## 七、变更与运维\n\n[changelogs/](changelogs/README.md)：`CHANGE-LOG.md` · `INDEXING-LOG.md`\n\n---\n\n## 八、技能与脚本\n\n* `/docs-okf` — 刷新 `index.md` / `viz.html`  \n* `/docs-build` · `/docs-indexing` — 实体与九章  \n* [docs-okf/SKILL.md](../agent/skills/docs-okf/SKILL.md)  \n\n---\n\n## 九、附录\n\n[viz.html](viz.html) · [manifest.md](manifest.md) · 系统对照 [../system/INDEX-GUIDE.md](../system/INDEX-GUIDE.md)",

      "body": "# application（应用知识库，mode=c）\n\n`application/` 维护应用侧稳定事实、实现登记与治理线索，是全仓库的重要知识中枢。  \n本文件面向中央知识库挂载建联（`mode=c`）阅读与维护场景，聚焦「按什么顺序读、到哪里写」；九章索引指南见 [INDEX-GUIDE.md](INDEX-GUIDE.md)，目录索引页见 [index.md](index.md)，**中央知识库挂载建联登记**见 [INDEX-GUIDE.md](INDEX-GUIDE.md) §十。\n\n## 推荐阅读路径\n\n1. [INDEX-GUIDE.md](INDEX-GUIDE.md)：九章索引指南（docs-indexing 产出），含 **「十、中央知识库接入工程」**\n2. [index.md](index.md)：目录索引页与 OKF 渐进披露入口\n3. [DESIGN.md](DESIGN.md)：元模型与跨视角关系\n4. [CONTRIBUTING.md](CONTRIBUTING.md)：新增/修改流程与模板约束\n\n## 文档流（一页纸）\n\n```text\nagent/rules（治理基线：术语/原则/命名/ADR）\n      │\n      ├──→ knowledge（五视角实体登记、实现映射与应用层实体主库）\n      │          ↑\n      │          └── 蒸馏 / 回写（如 docs-distill）\n      │\n      └──→ changelogs（变更留痕与索引运维）\n```\n\n**推荐落地顺序**：先核对 [agent/knowledge/knowledge-governance.md](../agent/knowledge/knowledge-governance.md) 治理约束，再查 / 补 **knowledge** 实体与 ID（读 [DESIGN.md](DESIGN.md)、[CONTRIBUTING.md](CONTRIBUTING.md)），最后在 **changelogs** 留痕并维护索引链路。\n\n## 中央知识库挂载建联维护主线\n\n| 主线 | 目录 | 主要内容 |\n|------|------|----------|\n| 治理基线 | [agent/knowledge/](../agent/knowledge/knowledge-governance.md) | 术语、原则、命名、ADR |\n| 知识基线 | [knowledge](knowledge) | 五视角实体登记、实现映射与应用层实体主库 |\n| 变更留痕 | [changelogs](changelogs/README.md) | 变更记录与索引运维文件 |\n\n## 子目录入口\n\n| 目录 | 入口说明 |\n|------|----------|\n| [knowledge/README.md](knowledge/README.md) | 五视角知识实体组织与映射规则 |\n| [changelogs/README.md](changelogs/README.md) | 变更记录与索引运维文件 |\n\n## 机器可读元数据\n\n- 根元数据：[docs-meta.md](docs-meta.md)\n- 子目录元数据：`knowledge/knowledge-meta.md`（阶段目录见各 `README.md`，含 [changelogs/README.md](changelogs/README.md)）\n\n> 约束细则以 `docs-meta.md` 与 `DESIGN.md` 为准，本文件不复写字段定义。",

      "body": "```yaml\n# application/ 目录元数据（根导航与 SSOT 指针）\nid: \"DIR-APPLICATION\"\nname: \"应用知识库根（application）\"\ndescription: \"企业级知识库 application/ 根目录：人类与 Agent 的主导航（README、index）、设计约束（DESIGN、CONTRIBUTING）及 SDD 各阶段与 knowledge SSOT。\"\n\nrole:\n  kind: \"documentation_root\"\n  ssot_subdirectory: \"knowledge/\"\n  # 治理与命名 SSOT 见 agent/knowledge/knowledge-governance.md\n\nchild_directories:\n  knowledge:\n    meta: \"knowledge/knowledge-meta.md\"\n    description: \"五视角业务 / 产品 / 应用 / 数据 / 技术（SSOT）\"\n  solutions:\n    readme: \"solutions/README.md\"\n    description: \"解决方案阶段：平铺 SOLUTION-{IDEA-ID}.md（约定见 README，无 solutions_meta.yaml）\"\n  analysis:\n    readme: \"analysis/README.md\"\n    description: \"需求分析阶段：平铺 ANALYSIS-{IDEA-ID}.md（约定见 README，无 analysis_meta.yaml）\"\n  requirements:\n    readme: \"requirements/README.md\"\n    description: \"需求交付阶段：REQUIREMENT-{IDEA-ID}/ 树（约定见 README，无 requirements_meta.yaml）\"\n  changelogs:\n    readme: \"changelogs/README.md\"\n    description: \"变更留痕与索引运维：CHANGE-LOG.md、INDEXING-LOG.md（约定见 README，无 changelogs_meta.yaml）\"\n  adr:\n    readme: \"adr/README.md\"\n    description: \"应用层 ADR 正文（ADR-{序号}-{标题}.md）\"\n\nchild_files:\n  - \"README.md\"\n  - \"index.md\"\n  - \"INDEX-GUIDE.md\"\n  - \"DESIGN.md\"\n  - \"CONTRIBUTING.md\"\n  - \"docs-meta.md\"\n  - \"manifest.md\"\n  - \"viz.html\"\n\ninputs:\n  - path: \"(from-repository-and-delivery)\"\n    description: \"仓库治理、方案/分析/交付产出与归档回写\"\n\noutputs:\n  primary_artifact:\n    pattern: \"README.md, index.md, DESIGN.md, CONTRIBUTING.md, knowledge/**/*\"\n    description: \"child_files（根级）+ knowledge/ 树（{perspective}-meta.md + 实体文件 {ID}.md，OKF SSOT）\"\n\nnaming_conventions:\n  directory_index:\n    description: \"knowledge/ 根见 knowledge-meta.md；五视角见 {perspective}-meta.md + 实体文件 {ID}.md\"\n    reference: \"../agent/knowledge/naming-conventions.md\"\n\nintegration:\n  upstream:\n    - path: \"../agent/\"\n      description: \"规范、模板与 Agent 技能（治理 SSOT：agent/rules/）\"\n  traceability:       "body": "应用侧产品版图（PL→PM→FT→FR→UC/BR）实体登记与交互映射元数据。实例索引见 [../index.md](../index.md)（§2，扫描生成；实体文件 `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-PRODUCT` |\n| 视角 | product |\n| 层级范围 | application |\n| 说明 | 产品版图；公司级 PL 在 `company/knowledge/product/` 首次定义，系统层自 PM 起首次定义，本层承接 API / 验收映射与实例登记（示例含 PL/PM/FT/FR/UC/BR；另有 BP 叙事文件）。 |\n| entities_shape | 实体文件 `{ID}.md`（OKF 概念实体）；索引见 KNOWLEDGE_INDEX §2 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | PL | 产品线（公司层首次定义） |\n| 2 | PM | 产品模块（系统层首次定义） |\n| 3 | FT | 功能点（系统层首次定义，应用层承接 API / 验收映射） |\n| 4 | FR | 功能需求（系统层首次定义，应用层承接验收与接口映射） |\n| 5 | UC | 用户用例（系统层首次定义，应用层承接 API 映射） |\n| 6 | BR | 业务规则（系统层首次定义，应用层承接实现映射） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | pl | PL | `PL-{NAME}` | — |\n| 2 | pm | PM | `PM-{NAME}` | PL |\n| 3 | ft | FT | `FT-{NAME}` | PM |\n| 4 | fr | FR | `FR-{NAME}` | FT |\n| 5 | uc | UC | `UC-{NAME}` | FR |\n| 6 | br | BR | `BR-{NAME}` | FR |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `PL` / `PM` / `FT` / `FR` / `UC` / `BR` |\n| full_id | 规范 ID |\n| name | 中文名称 |\n| description | 实体描述（PM 可省略） |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| PL | `target_users` |\n| PM | `parent_id` |\n| FT | `parent_id`、`invokes_api_ids`、`acceptance_criteria`（推荐） |\n| FR | `parent_id`、`children`（UC/BR 文件 full_id 列表） |\n| UC | `parent_id`、`map_to_api_id`（推荐） |\n| BR | `parent_id` |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| PM.cross_references.business | BC / AGG | 模块依赖业务上下文 |\n| FT.invokes_api_ids | API.id | 功能调用 API |\n| UC.map_to_api_id | API.id | 用例映射 API |\n\n## 6. BP 叙事文件（不属于 hierarchy）\n\n本视角可选维护 `BP-{NAME}.md` 作为流程叙事文件：\n\n- 与 `PL-{NAME}.md` 同目录\n- 文件内分 `M`、`S`、`B` 三层（用标题分节），仅通过正文引用 `PL/PM/FT`\n- 不进入 `PL -> PM -> FT -> FR -> UC/BR` 正式实体链，不使用 `hierarchy`、`parent_id`、`children`\n\n---\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../index.md](../index.md) | §2 产品视角实例索引（扫描生成） |\n| [../index.md](../index.md) | 五视角索引 |\n\n**索引**：`readme_index_table: true`；变更 ID 时同步 README、index.md（按需）。",

      "body": "应用层技术版图（TSD→MW→CMP）视角元数据 SSOT。实例索引见 [../index.md](../index.md)（§5，扫描生成；实体文件 `{ID}.md` 为 SSOT）。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-KNOWLEDGE-TECHNICAL` |\n| 视角 | technical |\n| 层级范围 | application |\n| 说明 | 中间件绑定与关键组件；公司级 TPL、系统级 TSD 在对应层首次定义，本层补齐 TSD reference 并登记 MW/CMP。 |\n| entities_shape | 实体文件 `{ID}.md`（OKF 概念实体）；索引见 KNOWLEDGE_INDEX §5 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | TSD | 系统级技术域（系统层 SSOT；本层为视角根 reference） |\n| 2 | MW | 中间件绑定实例 |\n| 3 | CMP | 关键 Maven 依赖 / 运行时组件 |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | tsd | TSD | `TSD-{NAME}` | —（reference → system） |\n| 2 | mw | MW | `MW-{NAME}` | TSD（逻辑归属，`parent_tsd_id`） |\n| 3 | cmp | CMP | `CMP-{NAME}` | MW |\n\n---\n\n## 4. 必填字段\n\n### 通用字段\n\n| 字段 | 说明 |\n| --- | --- |\n| hierarchy | `TSD` / `MW` / `CMP` |\n| full_id | 规范 ID |\n| name | 中文名称 |\n| description | 实体描述 |\n| evidence_source | 证据来源 |\n| layer_scope | 固定为 `application` |\n\n### 各层专属\n\n| 层级 | 必填字段 |\n| --- | --- |\n| TSD | `definition_scope: reference` |\n| MW | `binding_type`、`config_key`、`parent_tsd_id`、`bound_app_id` |\n| CMP | `maven_coordinates`、`parent_mw_id` 或 `parent_app_id`（二选一） |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| TSD（reference） | system TSD.full_id | 上游系统 SSOT |\n| MW.parent_tsd_id | TSD.full_id | 归属系统技术域 |\n| MW.bound_app_id | APP.full_id | 绑定应用 |\n| MW.related_ds_id | DS.full_id | 关联数据源（可选） |\n| CMP.parent_mw_id | MW.full_id | 组件挂载中间件 |\n| APP.implements_tpl_ids | TPL.full_id | 应用实现平台能力 |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 人类可读说明 |\n| [../index.md](../index.md) | MW/CMP 实例索引 |\n| [../../../company/knowledge/technical/technical-meta.md](../../../company/knowledge/technical/technical-meta.md) | 公司级 TPL 元数据 |\n| [../../../company/knowledge/index.md](../../../company/knowledge/index.md) | 公司级 TPL 实例 |\n| [../../../system/know <script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
