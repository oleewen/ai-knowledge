main {

  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  margin: 2px 4px 2px 0;
  font-size: 0.75rem;
}
#detail .body {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  line-height: 1.55;
  font-size: 0.92rem;
}
#detail .body a { color: var(--accent); }
#detail .body pre {
  background: var(--bg);

  border-radius: 6px;
  overflow: auto;

#backlinks {

  padding: 10px 16px;
  max-height: 140px;
  overflow: auto;

.legend-item {
  display: inline-flex;
  align-items: center;
  margin: 2px 10px 2px 0;
  font-size: 0.75rem;

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;

.empty-hint { color: var(--muted); font-style: italic; }
@media (max-width: 900px) {

      "body": "<!-- markdownlint-disable-next-line MD025 -->\n# 系统知识库设计\n\n`system/`：系统层知识编排、架构聚合与应用槽位治理。路径 SSOT 见 [knowledge-layout](../agent/references/knowledge-layout.md)。首次定义矩阵见 [application/DESIGN.md](../application/DESIGN.md) §2.2.1。\n\n## 阅读顺序\n\n1. [README.md](README.md) — 定位  \n2. 本文 — 边界、契约、同步  \n3. [knowledge/README.md](knowledge/README.md) — 五视角  \n4. [../company/DESIGN.md](../company/DESIGN.md) / [../application/DESIGN.md](../application/DESIGN.md) — 上下游对照  \n\n## 1. 定位与边界\n\n| 层 | 职责 |\n|----|------|\n| `company/` | 公司级实体正文 SSOT（BD/CAP/PL/SYS/MDG/TPL） |\n| `system/` | 系统层首次定义实体 SSOT + 五视角落地叙事 + `application-{name}/` 槽位 |\n| `application/` | 应用层首次定义（API/TBL/MW/CMP）+ 实现映射与实例登记 |\n\n- **系统层 SSOT**：`BSD/BC/AGG/AB/PM/FT/FR/UC/BP/BR/APP/MS/DS/ENT/TSD`  \n- **公司层 reference**：视角根单文件 `BD/PL/SYS/MDG-*.md`（正文 SSOT 在 company）  \n- **应用层 reference**：`MW` 等可在本层留 reference，指向 application SSOT  \n- **禁止**：跨层字段语义双源  \n\n## 2. 目录契约\n\n| 层级 | 目录 | 职责 |\n| --- | --- | --- |\n| 根导航 | README / INDEX-GUIDE / index / docs-meta | 入口与索引 |\n| ADR | [adr/](adr/README.md) | 系统层决策正文 |\n| 架构 | `knowledge/` | 五视角 + [`overview/`](knowledge/overview/NAME-overview.md) 蒸馏缓冲区 |\n| SDD | solutions → analysis → requirements | 系统方案链；交付在 `REQUIREMENT-*/MVP-Phase-*/` |\n| 槽位 | `application-{name}/` | docs-pull 镜像 |\n| 清单 | [knowledge-links.yaml](knowledge-links.yaml) | 建联 |\n| 运维 | [changelogs/](changelogs/README.md) | CHANGE-LOG / INDEXING-LOG |\n\n### SDD（system 模式）\n\n| 阶段 | 目录 | 产出 |\n| --- | --- | --- |\n| 方案 | `solutions/` | `SOLUTION-{IDEA-ID}.md` |\n| 分析 | `analysis/` | `ANALYSIS-{IDEA-ID}.md` |\n| 交付 | `requirements/` | `REQUIREMENT-{IDEA-ID}/MVP-Phase-*/` 下 PRD/ASD/DSD/TDD |\n\n跨系统上游见 [company/DESIGN.md](../company/DESIGN.md)。\n\n### 五视角（系统层聚焦）\n\n| 视角 | 系统层聚焦 | 入口 |\n| --- | --- | --- |\n| 业务 | BSD→AB；BD 为 company reference | [knowledge/business/](knowledge/business/README.md) |\n| 产品 | PM→FT→FR→UC/BR、BP；PL 为 company reference | [knowledge/product/](knowledge/product/README.md) |\n| 应用 | APP/MS；SYS 为 company reference；API 在 application | [knowledge/application/](knowledge/application/README.md) |\n| 数据 | DS/ENT；MDG 为 company reference；TBL 在 application | [knowledge/data/](knowledge/data/README.md) |\n| 技术 | TSD；MW/CMP 在 application（本层可 reference） | [knowledge/technical/](knowledge/technical/README.md) |\n\n### 关键路径约定\n\n| 实体 | system 路径 |\n| --- | --- |\n| BD（ref） | `knowledge/business/BD-{NAME}.md` |\n| BSD→AB | `knowledge/business/BSD-{NAME}/…` |\n| APP | `knowledge/application/APP-{NAME}/APP-{NAME}.md` |\n| MS | `knowledge/application/MS-{NAME}/MS-{NAME}.md` |\n| MW（ref） | `knowledge/technical/MW-{NAME}/MW-{NAME}.md` → application SSOT |\n\n#### 系统层 BD 落盘\n\n公司 SSOT：`company/knowledge/business/BD-{NAME}/`。本层仅视角根单文件 reference（`definition_scope: reference`），路径见上表 BD 行；BSD→AB 为本层域树 SSOT。\n\n### Overview\n\n`knowledge/overview/*-overview.md` = distill/extract 缓冲区，非实体 SSOT。归档后落入各视角 chapters。核心行序见 [knowledge-layout](../agent/references/knowledge-layout.md)；📎 按需章可不进 overview。\n\n### ADR\n\n`adr/` 存系统层决策正文；**无强制 EXAMPLE**。overview 应用视角末行链 [adr/](adr/README.md)，不进 `knowledge/*/chapters/`。\n\n### 章节 SSOT 继承\n\n| 类型 | 规则 |\n| --- | --- |\n| 公司对齐 | 有同名 company 章 → 引用为上游 |\n| 框架参照 | 无同名 → 本层 SSOT，链 company 视角 README |\n| 实体字段 | 不重复铺字段表；见 application/DESIGN §2.2.1 |\n\n## 3. 同步闭环\n\n1. **docs-pull** → `application-{name}/`  \n2. 校核 `knowledge/` 与治理约定  \n3. **docs-distill / docs-archive** 上行  \n4. **changelogs** 追溯  \n\n## 4. 门禁\n\n- 术语/目录/链接与 README、INDEX-GUIDE、index 一致  \n- 跨层无双份主定义  \n- 槽位更新记来源与回写策略  \n- 改目录语义先改本文  \n\n## 参考\n\n[README](README.md) · [knowledge/](knowledge/README.md) · [knowledge-links.yaml](knowledge-links.yaml) · [knowledge-layout](../agent/references/knowledge-layout.md) · [naming-conventions](../agent/knowledge/naming-conventions.md) · [company/DESIGN](../company/DESIGN.md) · [application/DESIGN](../application/DESIGN.md)",

      "body": "```yaml\n# system/ 目录元数据（根导航与 SSOT 指针）\nid: \"DIR-SYSTEM\"\nname: \"系统知识库根（system）\"\ndescription: \"企业级知识库 system/ 根目录：人类与 Agent 的主导航（README、index）、设计约束（DESIGN）及知识聚合与联邦槽位。\"\n\nrole:\n  kind: \"documentation_root\"\n  ssot_subdirectory: \"knowledge/\"\n  # 治理与命名 SSOT 见 agent/knowledge/knowledge-governance.md\n  # 文件分型与概念实体结构 SSOT 见 agent/knowledge/okf-spec.md\n\nchild_directories:\n  knowledge:\n    readme: \"knowledge/README.md\"\n    description: \"五架构视角聚合；含 overview/ 蒸馏缓冲区\"\n  adr:\n    readme: \"adr/README.md\"\n    description: \"系统层 ADR 正文\"\n  application-APPNAME:\n    readme: \"application-APPNAME/README.md\"\n    description: \"联邦应用镜像槽位（占位 APPNAME）\"\n  solutions:\n    readme: \"solutions/README.md\"\n    description: \"解决方案阶段：平铺 SOLUTION-{IDEA-ID}.md\"\n  analysis:\n    readme: \"analysis/README.md\"\n    description: \"需求分析阶段：平铺 ANALYSIS-{IDEA-ID}.md\"\n  requirements:\n    readme: \"requirements/README.md\"\n    description: \"需求交付阶段：REQUIREMENT-{IDEA-ID}/ 树\"\n  changelogs:\n    readme: \"changelogs/README.md\"\n    description: \"变更留痕与索引运维\"\n\nchild_files:\n  - \"README.md\"\n  - \"index.md\"\n  - \"INDEX-GUIDE.md\"\n  - \"DESIGN.md\"\n  - \"docs-meta.md\"\n  - \"knowledge-links.yaml\"\n  - \"viz.html\"\n\ninputs:\n  - path: \"(from-repository-and-delivery)\"\n    description: \"仓库治理、方案/分析/交付产出与归档回写\"\n\noutputs:\n  primary_artifact:\n    pattern: \"README.md, index.md, DESIGN.md, knowledge/**/*\"\n    description: \"根级导航与设计 + knowledge/ 聚合视图与实体文件 OKF 概念实体\"\n\nnaming_conventions:\n  directory_index:\n    description: \"实体 ID 与 IDEA-ID 命名以 agent/knowledge/naming-conventions.md 为准\"\n    reference: \"../agent/knowledge/naming-conventions.md\"\n\nintegration:\n  upstream:\n    - path: \"../agent/\"\n      description: \"规范、模板与 Agent 技能（命名 SSOT：agent/knowledge/；闸门：agent/rules/）\"\n  traceability:\n    description: \"阶段链 solutions → analysis → requirements；架构蒸馏经 overview → archive\"\n\nreferences:\n  - path: \"./README.md\"\n  - path: \"./index.md\"\n  - path: \"./DESIGN.md\"\n  - path: \"../agent/knowledge/knowledge-governance.md\"\n  - path: \"../agent/knowledge/okf-spec.md\"\n```",
      "backlinks": [
        "README"
      ]
    },

    "knowledge/application/application-meta": {
      "id": "knowledge/application/application-meta",
      "type": "Perspective Meta",
      "title": "应用视角元数据（system/knowledge/application）",
      "description": null,
      "tags": [],
      "body": "# 应用视角元数据（system/knowledge/application）\n\n系统级应用版图（SYS→APP→MS）视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-KNOWLEDGE-APPLICATION` |\n| 视角 | application |\n| 层级范围 | system |\n| 说明 | 系统级服务拆分与集成边界；公司级 SYS 在 `company/knowledge/application/` 首次定义，本层 SYS 为视角根 reference，自 APP 起为系统 SSOT；API 在应用层首次定义。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | SYS | 系统（公司层 SSOT；系统层为视角根 reference） |\n| 2 | APP | 应用（代码仓库/部署单元，系统层首次定义） |\n| 3 | MS | 对外入口宿主类聚类（系统层首次定义） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | sys | SYS | `SYS-{NAME}` | —（reference → company） |\n| 2 | app | APP | `APP-{NAME}` | SYS |\n| 3 | ms | MS | `MS-{NAME}` | APP |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `system`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| SYS | `definition_scope: reference`、`architecture` | FM 扩展 / 详细说明 |\n| APP | `parent_sys_id`、`service_ids`、`startup_class`、`maven_module` | 关系 / 详细说明 |\n| MS | `host_class`、`host_module`、`protocol` | 详细说明 |\n\n---\n\n## 5. 跨层路径映射（MS/API）\n\nMS 路径三层同构：`MS-{NAME}/MS-{NAME}.md`。APP 在 system 为目录锚点，在 application 可为视角根单文件。\n\n| 实体 | system 路径 | application 路径 | 说明 |\n|------|-------------|-------------------|------|\n| SYS-EXAMPLE | `system/knowledge/application/SYS-EXAMPLE.md` | `application/knowledge/application/SYS-EXAMPLE.md` | company reference |\n| APP-EXAMPLE | `system/knowledge/application/APP-EXAMPLE/APP-EXAMPLE.md` | `application/knowledge/application/APP-EXAMPLE.md` | system SSOT；app 可为实例 |\n| MS-EXAMPLE | `system/knowledge/application/MS-EXAMPLE/MS-EXAMPLE.md` | `application/knowledge/application/MS-EXAMPLE/MS-EXAMPLE.md` | 同构；system SSOT |\n| API-EXAMPLE-001 | （system 不登记） | `application/knowledge/application/MS-EXAMPLE/API-EXAMPLE-001.md` | API 仅 application SSOT |\n\n**链接约定**：同 bundle 用 `/knowledge/...`；跨层（如 system→application API/TBL/MW/CMP）用仓库相对路径，勿写他层不存在的 bundle-absolute `/knowledge/...`。\n\n---\n\n## 6. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| SYS（reference） | company SYS.full_id | 上游公司 SSOT |\n| BC.implemented_by_app_id | APP.full_id | 业务上下文实现 |\n| DS.owned_by_app_id | APP.full_id | 数据源归属 |\n| 应用层 AB.apis / API | API.id | 接口端点（下游引用） |\n\n---\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | SYS/APP/MS 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 系统库设计契约 |\n| [../../../company/knowledge/application/application-meta.md](../../../company/knowledge/application/application-meta.md) | 公司级 SYS 元数据 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |\n\n**索引**：`readme_index_table: false`；变更 ID 时同步 index.md 与 narrative 章节（按需）。",

        "knowledge/knowledge-meta"
      ]

      "title": "业务视角元数据（system/knowledge/business）",

      "tags": [],
      "body": "# 业务视角元数据（system/knowledge/business）\n\n系统级业务版图（BD→BSD→BC→AGG→AB）视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-KNOWLEDGE-BUSINESS` |\n| 视角 | business |\n| 层级范围 | system |\n| 说明 | 系统级 DDD 业务版图；公司级 BD 在 `company/knowledge/business/` 首次定义，本层 BD 为视角根 reference，自 BSD 起为系统 SSOT；应用层承接实现映射。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | BD | 业务域（公司层 SSOT；系统层为视角根 reference 单文件） |\n| 2 | BSD | 业务子域（系统层首次定义） |\n| 3 | BC | 限界上下文（系统层首次定义） |\n| 4 | AGG | 聚合根（系统层首次定义） |\n| 5 | AB | 领域能力（系统层首次定义） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | bd | BD | `BD-{NAME}` | —（reference → company） |\n| 2 | bsd | BSD | `BSD-{NAME}` | BD |\n| 3 | bc | BC | `BC-{NAME}` | BSD |\n| 4 | agg | AGG | `AGG-{NAME}` | BC |\n| 5 | ab | AB | `AB-{NAME}` | AGG |\n\n---\n\n## 4. BD 落盘例外\n\n| 层级 | 路径 | 说明 |\n| --- | --- | --- |\n| company | `company/knowledge/business/BD-{NAME}/BD-{NAME}.md` | 公司 SSOT |\n| system | `knowledge/business/BD-{NAME}.md` | 视角根 reference（非域文件夹） |\n| system | `knowledge/business/BSD-{NAME}/` | BSD→AB 域扁平树 |\n| application | `application/knowledge/business/BSD-{NAME}/BD-*.md` | 应用 reference |\n\n---\n\n## 5. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `system`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| BD | `definition_scope: reference`、`strategic_classification` | FM 扩展 / 详细说明 |\n| BSD | `bounded_contexts` | 关系 |\n| BC | `aggregates`、`implemented_by_app_id` | 关系 / 跨视角 |\n| AGG | `abilities`、`root_entity`、`persisted_as_entity_ids`、`implemented_by_service_ids` | 关系 / 跨视角 / 详细说明 |\n| AB | `capability`（`apis` 多在应用层补全） | 详细说明 / 跨视角 |\n\n---\n\n## 6. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| BD（reference） | company BD.full_id | 上游公司 SSOT |\n| BC.implemented_by_app_id | APP.full_id | 上下文实现应用 |\n| AGG.persisted_as_entity_ids | ENT.full_id | 聚合持久化实体 |\n| AGG.implemented_by_service_ids | MS.full_id | 聚合实现入口簇 |\n| 应用层 AB.apis | API.id | 能力 API（下游引用） |\n\n---\n\n## 7. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | BD/BSD/BC/AGG/AB 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 系统库设计契约（含 BD 落盘） |\n| [../../../company/knowledge/business/business-meta.md](../../../company/knowledge/business/business-meta.md) | 公司级 BD/CAP 元数据 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |\n\n**索引**：`readme_index_table: false`；变更 ID 时同步 index.md 与 narrative 章节（按需）。",

      "body": "# 数据流转\n\n[返回 · 数据架构](../README.md)\n\n本系统数据流动、加工与一致性保障.\n\n> **数据流转 SSOT**：公司级数据治理框架见 [company/knowledge/data/README.md](../../../../company/knowledge/data/README.md)。\n\n## 数据流图\n\n画主要 DFD；区分批/实时并与业务流程对齐.\n\n## ETL 流程\n\n写抽取/转换/加载职责、调度与质量校验嵌入点.\n\n## 实时数据流\n\n写 CDC、Topic、顺序语义与 Schema 演进约定.\n\n## 数据同步\n\n写系统间同步模式、幂等与冲突解决.\n\n## 数据一致性\n\n写强一致/最终一致/Saga 选用场景与对账规则.",

      "tags": [],
      "body": "# 数据视角元数据（system/knowledge/data）\n\n系统级数据版图（MDG→DS→ENT）视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-KNOWLEDGE-DATA` |\n| 层级范围 | system |\n| 视角 | data |\n| 说明 | 系统级数据存储与实体建模；公司级 MDG 在 `company/knowledge/data/` 首次定义，本层 MDG 为视角根 reference，自 DS/ENT 起为系统 SSOT；应用层补充物理表锚点。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | MDG | 主数据域（公司层 SSOT；系统层为视角根 reference） |\n| 2 | DS | 数据存储（系统层首次定义） |\n| 3 | ENT | 数据实体（表/集合，系统层首次定义） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | mdg | MDG | `MDG-{NAME}` | —（reference → company） |\n| 2 | ds | DS | `DS-{NAME}` | MDG（逻辑归属，`authoritative_mdg_id`） |\n| 3 | ent | ENT | `ENT-{NNN}` 或 `ENT-{NAME}` | DS |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `system`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| MDG | `definition_scope: reference`、`governance_owner` | FM 扩展 / 详细说明 |\n| DS | 存储 `type`、`config_key`、`owned_by_app_id`、`authoritative_mdg_id`（推荐） | 详细说明 / 跨视角 |\n| ENT | `logical_name`、`physical_table`、`maps_to_aggregate_id`（推荐） | 详细说明 / 跨视角 |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| MDG（reference） | company MDG.full_id | 上游公司 SSOT |\n| DS.authoritative_mdg_id | MDG.full_id | 数据源归属主数据域 |\n| DS.owned_by_app_id | APP.full_id | 数据源归属应用 |\n| AGG.persisted_as_entity_ids | ENT.full_id | 聚合持久化 |\n| ENT.maps_to_aggregate_id | AGG.full_id | 实体归属聚合 |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | MDG/DS/ENT 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 系统库设计契约 |\n| [../../../company/knowledge/data/data-meta.md](../../../company/knowledge/data/data-meta.md) | 公司级 MDG 元数据 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |\n\n**索引**：`readme_index_table: false`；变更 ID 时同步 index.md 与 narrative 章节（按需）。",

        "knowledge/data/README",
        "knowledge/knowledge-meta"
      ]

      "tags": [],
      "body": "# 知识树元数据（system/knowledge）\n\n系统知识库五视角知识树元数据 SSOT。实例索引见 [index.md](index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-KNOWLEDGE` |\n| layer_scope | system |\n| perspectives | business, product, application, data, technical |\n\n---\n\n## 2. 子目录\n\n| 目录 | 视角 | meta | 实例索引 |\n| --- | --- | --- | --- |\n| business/ | 业务 | [business-meta.md](business/business-meta.md) | [index.md](index.md) §1 |\n| product/ | 产品 | [product-meta.md](product/product-meta.md) | [index.md](index.md) §2 |\n| application/ | 应用 | [application-meta.md](application/application-meta.md) | [index.md](index.md) §3 |\n| data/ | 数据 | [data-meta.md](data/data-meta.md) | [index.md](index.md) §4 |\n| technical/ | 技术 | [technical-meta.md](technical/technical-meta.md) | [index.md](index.md) §5 |\n\n**子文件**：[README.md](README.md)\n\n---\n\n## 3. 角色\n\n| 字段 | 值 |\n| --- | --- |\n| is_single_source_of_truth | true（系统层实体与叙事 SSOT） |\n| upstream | `company/knowledge/`（公司级 BD/CAP/PL/SYS/MDG/TPL 首次定义） |\n| downstream | `application/knowledge/`（API/TBL/MW/CMP 及实现映射） |\n\n---\n\n## 4. 索引\n\n| 类型 | 路径 |\n| --- | --- |\n| system_index | [../index.md](../index.md) |\n| per_perspective_readmes | business/README.md, product/README.md, application/README.md, data/README.md, technical/README.md |\n| governance | [../../agent/knowledge/knowledge-governance.md](../../agent/knowledge/knowledge-governance.md) |\n| entity_index | [index.md](index.md) |\n| design | [../DESIGN.md](../DESIGN.md) |\n\n---\n\n## 5. 系统层 BD 落盘例外\n\n与 `company/`、`application/` 区分；实现 SSOT 见 [../DESIGN.md](../DESIGN.md#系统层-bd-落盘)。\n\n| 层级 | 路径 | 说明 |\n| --- | --- | --- |\n| company | `company/knowledge/business/BD-{NAME}/BD-{NAME}.md` | 公司 SSOT |\n| system | `knowledge/business/BD-{NAME}.md` | 视角根单文件 reference（`definition_scope: reference`，`layer_scope: system`；上游 SSOT 见 # SSOT 段） |\n| system | `knowledge/business/BSD-{NAME}/` | BSD→BC→AGG→AB 域扁平树 SSOT |\n| application | `application/knowledge/business/BSD-{NAME}/BD-*.md` | 应用 reference |\n\n`okf_lib.entity_relpath(bundle=\"system\", BD)` → `knowledge/business/{full_id}.md`\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 五视角架构入口 |\n| [../index.md](../index.md) | system 索引 |\n| [../../index.md](../../index.md) | 仓库根目录索引页 |\n| [../DESIGN.md](../DESIGN.md) | 系统库设计契约 |\n| [../../company/knowledge/knowledge-meta.md](../../company/knowledge/knowledge-meta.md) | 公司级知识树元数据 |\n| [../../agent/knowledge/naming-conventions.md](../../agent/knowledge/naming-conventions.md) | 命名 SSOT |\n\n---\n\n## 7. docs-build meta_read_order\n\n| 顺序 | 路径 |\n| --- | --- |\n| 1 | docs-meta.md |\n| 2 | knowledge/knowledge-meta.md |\n| 3 | knowledge/business/business-meta.md |\n| 4 | knowledge/product/product-meta.md |\n| 5 | knowledge/application/application-meta.md |\n| 6 | knowledge/data/data-meta.md |\n| 7 | knowledge/technical/technical-meta.md |\n| 8 | changelogs/README.md |\n| 9 | ../agent/knowledge/knowledge-governance.md |",

      "tags": [],
      "body": "# 产品视角元数据（system/knowledge/product）\n\n系统级产品版图（PL→PM→FT→FR→UC/BR · BP）视角元数据 SSOT。实例索引见 [../index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-KNOWLEDGE-PRODUCT` |\n| 视角 | product |\n| 层级范围 | system |\n| 说明 | 系统级产品功能组织；公司级 PL 在 `company/knowledge/product/` 首次定义，本层 PL 为视角根 reference，自 PM 起为系统 SSOT；应用层承接 API / 验收映射。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | PL | 产品线（公司层 SSOT；系统层为视角根 reference） |\n| 2 | PM | 产品模块（系统层首次定义） |\n| 3 | FT | 功能点（系统层首次定义） |\n| 4 | FR | 功能需求（系统层首次定义） |\n| 5 | UC / BR | 用例 / 业务规则（系统层首次定义；挂 FR） |\n| 6 | BP | 业务流程（系统层首次定义；可挂 PL/PM，非 FR 子树） |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | pl | PL | `PL-{NAME}` | —（reference → company） |\n| 2 | pm | PM | `PM-{NAME}` | PL |\n| 3 | ft | FT | `FT-{NAME}` | PM |\n| 4 | fr | FR | `FR-{NAME}` | FT |\n| 5 | uc | UC | `UC-{NAME}` | FR |\n| 6 | br | BR | `BR-{NAME}` | FR |\n| 7 | bp | BP | `BP-{NAME}` | PL / PM（可选） |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `system`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### 各层专属（正文 / 扩展）\n\n| 层级 | 字段 | 建议段落 |\n| --- | --- | --- |\n| PL | `definition_scope: reference`、`target_users` | FM 扩展 / 详细说明 |\n| PM | `relies_on_context_ids` | 跨视角 |\n| FT | `acceptance_criteria`、`realizes_use_case_ids`（`invokes_api_ids` 多在应用层） | 详细说明 / 跨视角 |\n| FR | （UC/BR 子链） | 关系 |\n| UC | `map_to_api_id`（推荐；可应用层补全） | 跨视角 |\n| BR | （按需） | 跨视角 / 详细说明 |\n| BP | 旁路流程叙事；`parent_id` 可选 | 关系 |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| PL（reference） | company PL.full_id | 上游公司 SSOT |\n| PM.parent_id | PL.full_id | 模块归属产品线 |\n| PM.relies_on_context_ids | BC.full_id | 模块依赖限界上下文 |\n| FT.realizes_use_case_ids | UC.full_id | 功能实现用例 |\n| 应用层 FT.invokes_api_ids | API.full_id | 功能调用 API（下游引用） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [../index.md](../index.md) | PL/PM/FT/FR/UC/BR/BP 实例 SSOT |\n| [../../DESIGN.md](../../DESIGN.md) | 系统库设计契约 |\n| [../../../company/knowledge/product/product-meta.md](../../../company/knowledge/product/product-meta.md) | 公司级 PL 元数据 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | ID 命名 SSOT |\n\n**索引**：`readme_index_table: false`；变更 ID 时同步 index.md 与 narrative 章节（按需）。",

      "body": "# 基础设施架构\n\n[返回 · 技术架构](../README.md)\n\n本系统计算、网络与边缘交付落地.\n\n> **基础设施 SSOT**：公司级部署、网络与云资源标准见 [`technical-infrastructure.md`](../../../../company/knowledge/technical/chapters/technical-infrastructure.md)。\n\n## 部署架构\n\n写机房/区域/可用区拓扑与跨区策略.\n\n## 网络拓扑\n\n写 VPC、子网、防火墙与安全域分层.\n\n## 云资源规划\n\n写网段、NAT、安全组、标签与成本分摊.\n\n## 容器编排\n\n写 K8s 集群划分、命名空间、配额与升级策略.\n\n## 流量接入\n\n写 CDN、LB、DNS、证书与 HTTPS 终止.",

      "body": "# 中间件与基础组件\n\n[返回 · 技术架构](../README.md)\n\n本系统共享平台能力选型与使用规范.\n\n> **中间件 SSOT**：MW/CMP 首次定义在 application；本系统章为落地叙事 + TSD 边界。绑定样例见 [MW-EXAMPLE](../MW-EXAMPLE/MW-EXAMPLE.md)（reference）→ `application/knowledge/technical/MW-EXAMPLE/`。公司框架见 [company/knowledge/technical/README.md](../../../../company/knowledge/technical/README.md)。\n\n## 消息队列\n\n写集群划分、主题/队列命名、保留策略与事件流对齐.\n\n## 缓存\n\n写部署模式、淘汰策略、穿透/击穿/雪崩防护与 TTL 约定.\n\n## 搜索引擎\n\n写集群角色、索引生命周期、分片副本与安全隔离.\n\n## 配置注册\n\n写配置分层、敏感处理、灰度回滚与服务发现.\n\n## 任务调度\n\n写批处理/定时平台、幂等、重试与告警.\n\n## 对象存储\n\n写桶命名、生命周期、预签名 URL 与权限策略.",

      "body": "# 技术视角元数据（system/knowledge/technical）\n\n系统级技术域（TSD）视角元数据 SSOT。实例索引见 [index.md](../index.md)。\n\n---\n\n## 1. 概览\n\n| 字段 | 值 |\n| --- | --- |\n| meta_id | `DIR-SYSTEM-ARCH-TECHNICAL` |\n| 视角 | technical |\n| 层级范围 | system |\n| 说明 | 系统级 TSD SSOT；MW/CMP 首次在 application；本层可挂 MW reference。 |\n\n---\n\n## 2. 层级链\n\n| 链序 | 层级代码 | 说明 |\n| --- | --- | --- |\n| 1 | TSD | 系统级技术域（中间件域、可观测域等） |\n| 2 | MW | 应用层首次定义；本层可为 reference |\n\n---\n\n## 3. 层定义\n\n| order | key | code | id_pattern | parent |\n| --- | --- | --- | --- | --- |\n| 1 | tsd | TSD | `TSD-{NAME}` | TPL（逻辑归属，`parent_tpl_id`） |\n\n---\n\n## 4. 字段（OKF）\n\n**Frontmatter（10 必填）**：`type` · `title` · `description` · `tags` · `timestamp` · `full_id` · `perspective` · `hierarchy` · `parent_id` · `layer_scope`（本层固定 `system`）。详见 [okf-spec](../../../agent/knowledge/okf-spec.md) §2。\n\n**正文四段**：`## 关系` · `## 跨视角` · `## 详细说明` · `## 依据与证据`。\n\n### TSD 专属（正文 / 扩展）\n\n| 字段 | 说明 |\n| --- | --- |\n| domain | 技术域分类（如 middleware、observability） |\n| parent_tpl_id | 归属公司级 TPL 的 full_id |\n\n---\n\n## 5. 跨视角引用\n\n| 源字段 | 目标 | 说明 |\n| --- | --- | --- |\n| TSD.parent_tpl_id | TPL.full_id | 归属平台能力 |\n| MW.parent_tsd_id | TSD.full_id | 应用中间件绑定归属（下游引用） |\n\n---\n\n## 6. 关联文档\n\n| 路径 | 说明 |\n| --- | --- |\n| [README.md](README.md) | 叙事文档索引 |\n| [index.md](../index.md) | TSD 实例 SSOT |\n| [../../../company/knowledge/technical/technical-meta.md](../../../company/knowledge/technical/technical-meta.md) | 公司级 TPL 元数据 |\n| [../../../company/knowledge/index.md](../../../company/knowledge/index.md) | 公司级 TPL 实例 |\n| [../../../agent/knowledge/naming-conventions.md](../../../agent/knowledge/naming-conventions.md) | 命名 SSOT |\n\n**索引**：`readme_index_table: false`；变更 TSD ID 时同步 system/DESIGN.md 与 overview（按需）。",

    "Documentation Root",
    "Entity",
    "Feature",
    "Functional Requirement",
    "Master Data Domain",
    "Microservice",
    "Middleware Binding",
    "PRD",
    "Perspective Meta",
    "Perspective Tree Meta",
    "Product Line",
    "Product Module",
    "Requirement Package",
    "System",
    "TDD",
    "Technical Subdomain",
    "Use Case"
  ],
  "typeColors": {
    "ASD": "#4e79a7",
    "Ability": "#b07aa1",
    "Aggregate": "#edc948",
    "Analysis Document": "#76b7b2",
    "Application": "#86bcb6",
    "Architecture Chapter": "#edc948",
    "Architecture Overview Buffer": "#b07aa1",
    "Bounded Context": "#76b7b2",
    "Business Domain": "#4e79a7",
    "Business Process": "#bab0ac",
    "Business Rule": "#4e79a7",
    "Business Subdomain": "#59a14f",
    "DSD": "#e15759",
    "Data Store": "#79706e",
    "Design Document": "#59a14f",
    "Directory Meta": "#edc948",
    "Documentation": "#b07aa1",
    "Documentation Root": "#ff9da7",
    "Entity": "#b6992d",
    "Feature": "#bab0ac",
    "Functional Requirement": "#4e79a7",
    "Master Data Domain": "#f28e2b",
    "Microservice": "#f28e2b",
    "Middleware Binding": "#8cd17d",
    "PRD": "#59a14f",
    "Perspective Meta": "#edc948",
    "Perspective Tree Meta": "#b07aa1",
    "Product Line": "#ff9da7",
    "Product Module": "#9c755f",
    "Requirement Package": "#bab0ac",
    "System": "#499894",
    "TDD": "#f28e2b",
    "Technical Subdomain": "#e15759",
    "Use Case": "#e15759"
  }
}
</script>
<script>
(function () {
  const bundle = JSON.parse(document.getElementById('okf-bundle-data').textContent);
  const concepts = bundle.concepts;
  const typeColors = bundle.typeColors || {};
  let cy = null;
  let selectedId = null;

  function normalizeLinkToId(href, baseId) {
    if (!href) return null;
    let link = href.split('#')[0].trim();
    if (!link.endsWith('.md')) return null;
    if (link.startsWith('http://') || link.startsWith('https://')) return null;
    let rel;
    if (link.startsWith('/')) {
      rel = link.replace(/^\/+/, '').replace(/\.md$/, '');
    } else {
      const baseParts = baseId.split('/');
      baseParts.pop();
      const linkParts = link.replace(/\.md$/, '').split('/');
      for (const part of linkParts) {
        if (part === '..') baseParts.pop();
        else if (part !== '.' && part !== '') baseParts.push(part);
      }
      rel = baseParts.join('/');
    }
    return concepts[rel] ? rel : null;
  }

  function buildElements() {
    const nodes = Object.values(concepts).map(c => ({
      data: {
        id: c.id,
        label: c.title || c.id,
        type: c.type || 'unknown',
        title: c.title,
        tags: (c.tags || []).join(' '),
        searchText: [c.id, c.title, ...(c.tags || [])].join(' ').toLowerCase(),
      },
    }));
    const nodeIds = new Set(nodes.map(n => n.data.id));
    const edges = bundle.edges
      .filter(e => nodeIds.has(e.source) && nodeIds.has(e.target))
      .map((e, i) => ({
        data: { id: 'e' + i, source: e.source, target: e.target },
      }));
    return nodes.concat(edges);
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    const items = (bundle.types || []).map(t => {
      const color = typeColors[t] || '#888';
      return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${t}</span>`;
    }).join('');
    el.innerHTML = '<h3>类型图例</h3>' + (items || '<span class="empty-hint">无</span>');
  }

  function populateTypeFilter() {
    const sel = document.getElementById('typeFilter');
    (bundle.types || []).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      sel.appendChild(opt);
    });
  }

  function nodeStyle() {
    const style = [
      {
        selector: 'node',
        style: {
          label: 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': '9px',
          color: '#c9d1d9',
          'text-outline-color': '#0f1419',
          'text-outline-width': 2,
          'background-color': '#888',
          width: 28,
          height: 28,
        },
      },
      {
        selector: 'edge',
        style: {
          width: 1.2,
          'line-color': '#3d4f66',
          'target-arrow-color': '#3d4f66',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          opacity: 0.65,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-width': 3,
          'border-color': '#58a6ff',
        },
      },
      {
        selector: '.hidden',
        style: { display: 'none' },
      },
      {
        selector: '.faded',
        style: { opacity: 0.15 },
      },
    ];
    (bundle.types || []).forEach(t => {
      style.push({
        selector: `node[type = "${t.replace(/"/g, '\\"')}"]`,
        style: { 'background-color': typeColors[t] || '#888' },
      });
    });
    return style;
  }

  function initGraph() {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: buildElements(),
      style: nodeStyle(),
      layout: { name: 'cose', animate: false, padding: 40 },
      minZoom: 0.2,
      maxZoom: 3,
    });
    cy.on('tap', 'node', evt => selectConcept(evt.target.id()));
    cy.on('tap', evt => {
      if (evt.target === cy) {
        selectedId = null;
        cy.$('node:selected').unselect();
      }
    });
  }

  function applyFilters() {
    if (!cy) return;
    const q = document.getElementById('search').value.trim().toLowerCase();
    const typeVal = document.getElementById('typeFilter').value;
    cy.nodes().removeClass('hidden faded');
    cy.edges().removeClass('hidden faded');
    cy.nodes().forEach(node => {
      const d = node.data();
      let visible = true;
      if (typeVal && d.type !== typeVal) visible = false;
      if (visible && q && !d.searchText.includes(q)) visible = false;
      if (!visible) node.addClass('hidden');
    });
    cy.edges().forEach(edge => {
      if (edge.source().hasClass('hidden') || edge.target().hasClass('hidden')) {
        edge.addClass('hidden');
      }
    });
    if (q || typeVal) {
      cy.nodes(':visible').forEach(n => {
        if (selectedId && n.id() !== selectedId) n.addClass('faded');
      });
    }
  }

  function renderBacklinks(id) {
    const box = document.getElementById('backlinks');
    const c = concepts[id];
    const links = (c && c.backlinks) || [];
    if (!links.length) {
      box.innerHTML = '<h3>Cited by</h3><p class="empty-hint">无引用</p>';
      return;
    }
    const items = links.map(src => {
      const sc = concepts[src];
      const label = sc ? (sc.title || src) : src;
      return `<li><a data-id="${src}">${label}</a> <span class="empty-hint">(${src})</span></li>`;
    }).join('');
    box.innerHTML = '<h3>Cited by</h3><ul>' + items + '</ul>';
    box.querySelectorAll('a[data-id]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        selectConcept(a.getAttribute('data-id'));
      });
    });
  }

  function renderDetail(id) {
    const c = concepts[id];
    const detail = document.getElementById('detail');
    if (!c) {
      detail.innerHTML = '<p class="empty-hint">概念不存在</p>';
      return;
    }
    const desc = c.description != null && c.description !== '' ? String(c.description) : '—';
    const tags = (c.tags || []).map(t => `<span>${t}</span>`).join('') || '<span class="empty-hint">—</span>';
    const bodyHtml = marked.parse(c.body || '', { breaks: true });
    detail.innerHTML =
      `<h2>${c.title || c.id}</h2>` +
      `<div class="meta"><div><strong>ID:</strong> ${c.id}</div>` +
      `<div><strong>Type:</strong> ${c.type || '—'}</div>` +
      `<div><strong>Description:</strong> ${desc}</div></div>` +
      `<div class="tags">${tags}</div>` +
      `<div class="body">${bodyHtml}</div>`;
    detail.querySelector('.body').addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      const targetId = normalizeLinkToId(a.getAttribute('href'), id);
      if (targetId) {
        e.preventDefault();
        selectConcept(targetId);
      }
    });
  }

  function selectConcept(id) {
    if (!concepts[id]) return;
    selectedId = id;
    if (cy) {
      const node = cy.getElementById(id);
      if (node.nonempty()) {
        cy.$('node:selected').unselect();
        node.select();
        cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.2) }, { duration: 250 });
      }
    }
    renderDetail(id);
    renderBacklinks(id);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('typeFilter').addEventListener('change', applyFilters);

  renderLegend();
  populateTypeFilter();
  initGraph();
})();
</script>
</body>
</html>
