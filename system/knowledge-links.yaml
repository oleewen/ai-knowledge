# 知识库建联清单（可由 docs-link.sh / docs-install.sh 维护）
# 可含一条 type: parent（上级 solution）、一条 type: meta（装机源元库）与若干 type: child。
# 每条必须写 type：parent、child 或 meta。字段约定见 agent/knowledge/knowledge-governance.md。
# dir：meta 的值 = 本库 KNOWLEDGE_TYPE（system），指向元仓模板子树；parent/child 的值 = 对方 DOC_DIR。空则省略。
# 示例：
#   - type: meta
#     repository: "git@github.com:example/ai-knowledge.git"
#     path: "${WORK_SPACE}/ai-knowledge"
#     dir: "system"
#   - type: parent
#     repository: "git@github.com:example/sln-foo.git"
#     path: "${WORK_SPACE}/sln-foo"
#     dir: "docs"
#     name: "sln-foo"
#     label: "sln-foo"
#   - type: child
#     repository: "https://example.com/org/app-foo.git"
#     path: "${WORK_SPACE}/app-foo"
#     dir: "docs"
#     name: "app-foo"
#     label: "app-foo"
links:
  - type: meta
    repository: "git@github.com:oleewen/ai-knowledge.git"
    path: "${WORK_SPACE}/ai-knowledge"
    dir: "system"
